  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 2; }

  }
  /* 양옆 세로 전구 스트립 — 도트가 흘러내리며 점멸합니다 */
  .marquee::before, .marquee::after {
    content: ""; position: absolute; top: 6px; bottom: 6px; width: 10px;
    background-image:
      radial-gradient(circle at 5px 6px, var(--gold) 2.5px, transparent 3px),

  }
  .marquee::before { left: 8px; }
  .marquee::after { right: 8px; animation-delay: .6s; }
  @keyframes bulbrun { to { background-position: 0 44px, 0 66px; } }
  .bulbs { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; }

  .crt {

  .fx { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .fx::before {
    content: ""; position: absolute; inset: -2px 0;

    animation: interlace .134s steps(2, jump-none) infinite;

  @keyframes interlace { from { transform: translateY(0); } to { transform: translateY(1px); } }
  .fx::after {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,0,0,.05) 0 1px, rgba(0,255,0,.05) 1px 2px, rgba(0,0,255,.05) 2px 3px),

  .sync {

  @keyframes hsync {

  .tear {

<script>
(function () {
  "use strict";
  /* 모션 감소 설정을 실시간으로 따라갑니다 */
  var reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reduce = reduceMq.matches;
  function onReduceChange(e) { reduce = e.matches; }
  if (reduceMq.addEventListener) reduceMq.addEventListener("change", onReduceChange);
  else if (reduceMq.addListener) reduceMq.addListener(onReduceChange);

  var dm = document.getElementById("demo"), dx = dm.getContext("2d");
  var DW = dm.width, DH = dm.height;
  function px(x, y, w, h, col) { dx.fillStyle = col; dx.fillRect(x | 0, y | 0, w, h); }
  function text(str, x, y, col) {
    dx.fillStyle = col; dx.font = "8px 'Oraksil', monospace";
    dx.textBaseline = "top"; dx.fillText(str, x, y);
  }

  var rac = { x: 20, dir: 1 };
  function scene(t) {
    px(0, 0, DW, DH, "rgba(10,26,18,.45)");
    for (var f = 0; f < 3; f++) px(0, 26 + f * 22, DW, 3, "#2e7d5b");
    for (var l = 0; l < 2; l++) {
      var lx = 60 + l * 120;
      px(lx, 26, 2, 44, "#8a6a3a"); px(lx + 10, 26, 2, 44, "#8a6a3a");
      for (var r = 0; r < 7; r++) px(lx, 30 + r * 6, 12, 2, "#c49a5a");
    }
    for (var i = 0; i < 5; i++) {
      var fx = 24 + i * 46, fy = 40 + (i % 2) * 22;
      if ((t + i * 40) % 200 > 60) { px(fx, fy, 5, 5, "#ff3b6b"); px(fx + 1, fy - 2, 2, 2, "#35e0a1"); }
    }
    var sx = (t * 0.9) % (DW + 40) - 20;
    for (var s = 0; s < 5; s++) px(sx - s * 5, 62 + Math.sin((t * 0.15) + s) * 2, 4, 4, "#7ee06b");
    px(sx + 4, 62, 4, 4, "#b7ff8a");
    rac.x += rac.dir * 0.7;
    if (rac.x > DW - 24) rac.dir = -1;
    if (rac.x < 10) rac.dir = 1;
    var rx = rac.x | 0, ry = 56, step = (t % 16 < 8) ? 0 : 1;
    px(rx + 1, ry - 10, 2, 3, "#8a8a9e"); px(rx + 8, ry - 10, 2, 3, "#8a8a9e");
    px(rx, ry - 8, 11, 8, "#8a8a9e");
    px(rx + 1, ry - 5, 3, 3, "#2b2b38"); px(rx + 7, ry - 5, 3, 3, "#2b2b38");
    px(rx + 2, ry - 4, 1, 1, "#f3eee2"); px(rx + 8, ry - 4, 1, 1, "#f3eee2");
    px(rx + 4, ry - 2, 3, 2, "#f3eee2");
    px(rx + 1, ry, 9, 4, "#9a9aae");
    px(rx + 1 + step * 2, ry + 4, 3, 2, "#2b2b38");
    px(rx + 6 - step * 2, ry + 4, 3, 2, "#2b2b38");
    text("NEOGURI", 6, 6, "#ffd23f");
  }

  var t = 0, last = 0;
  function loop(ts) {
    if (ts - last > 33 && !reduce) { last = ts; t++; scene(t); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  if (reduce) scene(1);

  /* CONTINUE 카운트다운 — 0이 되면 다시 9부터 셉니다 */
  var cnum = document.getElementById("cnum"), cval = 9;
  setInterval(function () {
    cval = cval === 0 ? 9 : cval - 1;
    cnum.textContent = String(cval);
  }, 1000);

  /* 수평 동기 글리치 — 이따금 화면이 찢깁니다 */
  var crt = document.getElementById("crt"), tear = document.getElementById("tear");
  function schedGlitch() {
    setTimeout(function () {
      if (!reduce && !document.hidden) {
        tear.style.top = (10 + Math.random() * 80) + "%";
        crt.classList.add("glitch");
        setTimeout(function () { crt.classList.remove("glitch"); }, 180);
      }
      schedGlitch();
    }, 9000 + Math.random() * 13000);
  }
  if (!reduce) setTimeout(schedGlitch, 6000);
})();
</script>
