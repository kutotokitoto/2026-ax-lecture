    background-size: auto, 120px 120px;

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 2; }

<script>
(function () {
  "use strict";

  /* ══ 상수 ══════════════════════════════════ */
  var W = 256, H = 224;
  var FLOORS = [64, 110, 156, 202];      /* 각 층 윗면 y (발 위치) */
  var TILE = 16;
  var FRUIT_PTS = { A: 100, B: 300, C: 500 };
  var FRUIT_COL = { A: "#ff3b6b", B: "#ffd23f", C: "#b98cff" };
  var STAGE_TIME = 3600;                 /* 60초 */

  /* 'H' 사다리(그 층 → 아래층), A/B/C 과일, '^' 가시, '.' 빈칸 */
  var LAYOUTS = [
    {
      map: [
        "..A..H....B..H..",
        "H....A....H...C.",
        "...H..B.^....H.A",
        ".A....^....B...."
      ],
      snakes: [{ f: 0, x: 200, d: -1 }, { f: 2, x: 40, d: 1 }]
    },
    {
      map: [
        ".C...H..A...H..B",
        "..H....B....H...",
        "H...A..^..C..H..",
        "...B...^....A..."
      ],
      snakes: [{ f: 1, x: 60, d: 1 }, { f: 3, x: 220, d: -1 }]
    },
    {
      map: [
        "B...H...C..H...A",
        ".A...H.....B.H..",
        "..H..^..B...H...",
        "....A..^...C...."
      ],
      snakes: [{ f: 0, x: 120, d: 1 }, { f: 2, x: 200, d: -1 }, { f: 3, x: 60, d: 1 }]
    }
  ];

  var cv = document.getElementById("game"), cx = cv.getContext("2d");
  var ov = document.getElementById("ov");
  function px(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x | 0, y | 0, w, h); }
  function txt(s, x, y, c) {
    cx.fillStyle = c; cx.font = "8px 'Oraksil', monospace"; cx.textBaseline = "top";
    cx.fillText(s, x, y);
  }

  /* ══ 상태 ══════════════════════════════════ */
  var score = 0, lives = 3, stage = 1, paused = false, frame = 0;
  var ladders = [], fruits = [], spikes = [], snakes = [];
  var timer = STAGE_TIME, contN = 9, newBest = false;
  var pl = { x: 16, y: FLOORS[3], floor: 3, st: "G", vx: 0, vy: 0, dir: 1,
             ladder: null, anim: 0, deadT: 0 };
  var A = ARC.audio;

  ARC.hud.bind({ score: "#score", hi: "#hi", lives: "#lives" });
  function syncHud() {
    ARC.hud.set("score", score, 6);
    ARC.hud.set("hi", ARC.best.get("neoguri"), 6);
    var h = ""; for (var i = 0; i < lives; i++) h += "♥";
    ARC.hud.set("lives", h || "-");
  }
  function ovShow(html) { ov.innerHTML = html; ov.classList.add("on"); }
  function ovHide() { ov.classList.remove("on"); ov.innerHTML = ""; }

  /* ══ 스테이지 구성 ═════════════════════════ */
  function enterStage(n) {
    stage = n;
    var lay = LAYOUTS[(n - 1) % LAYOUTS.length];
    ladders = []; fruits = []; spikes = []; snakes = [];
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 16; c++) {
        var t = lay.map[r][c];
        var cxp = c * TILE + TILE / 2;
        if (t === "H" && r < 3) ladders.push({ f: r, x: cxp });
        else if (t === "A" || t === "B" || t === "C")
          fruits.push({ f: r, x: cxp, t: t, on: true });
        else if (t === "^") spikes.push({ f: r, x: cxp });
      }
    }
    var spd = Math.min(1.1, 0.5 + 0.08 * (n - 1));
    for (var s = 0; s < lay.snakes.length; s++) {
      var sn = lay.snakes[s];
      snakes.push({ f: sn.f, x: sn.x, d: sn.d, spd: spd, grace: 0 });
    }
    /* 3스테이지마다 뱀 한 마리 추가 (최대 4) */
    var extra = Math.max(0, Math.min(4 - snakes.length, Math.floor((n - 1) / 3)));
    for (var e = 0; e < extra; e++) {
      snakes.push({ f: (n + e) % 4, x: 128, d: e % 2 ? 1 : -1, spd: spd, grace: 0 });
    }
    timer = STAGE_TIME;
    respawn();
  }
  function respawn() {
    pl.x = 16; pl.floor = 3; pl.y = FLOORS[3];
    pl.st = "G"; pl.vx = 0; pl.vy = 0; pl.dir = 1; pl.ladder = null; pl.deadT = 0;
    if (timer < 1200) timer = 1200;      /* 리스폰 최소 20초 보장 */
    for (var i = 0; i < snakes.length; i++) snakes[i].grace = 30;
  }

  function ladderAt(f, x) {
    for (var i = 0; i < ladders.length; i++) {
      if (ladders[i].f === f && Math.abs(ladders[i].x - x) <= 5) return ladders[i];
    }
    return null;
  }

  /* ══ 갱신 ══════════════════════════════════ */
  function die() {
    if (pl.st === "D") return;
    pl.st = "D"; pl.deadT = 0;
    A.beep(400, 0.5, "sawtooth", 0.06, 60);
    A.noise(0.2, 0.05, 600);
  }

  function updatePlay(auto) {
    if (pl.st === "D") {
      pl.deadT++;
      if (pl.deadT >= 70) {
        if (auto) { respawn(); return; }
        lives--;
        syncHud();
        if (lives <= 0) fsm.go("OVER");
        else respawn();
      }
      return;
    }

    /* 타이머 */
    if (!auto) {
      timer--;
      if (timer <= 0) { die(); return; }
      if (timer < 600 && timer % 30 === 0) A.beep(990, 0.06, "square", 0.05);
    }

    /* 입력 (auto 는 간단한 순찰 AI) */
    var inL, inR, inU, inD, inJ;
    if (auto) {
      if (pl.x < 14) pl.dir = 1;
      if (pl.x > 230) pl.dir = -1;
      inL = pl.dir < 0; inR = pl.dir > 0; inU = false; inD = false;
      inJ = false;
      for (var si = 0; si < snakes.length; si++) {
        var s0 = snakes[si];
        if (s0.f === pl.floor && Math.abs(s0.x - pl.x) < 30 &&
            ((s0.x - pl.x) * pl.dir > 0) && pl.st === "G") inJ = true;
      }
    } else {
      inL = ARC.input.down("left"); inR = ARC.input.down("right");
      inU = ARC.input.down("up"); inD = ARC.input.down("down");
      inJ = ARC.input.pressed("a");
    }

    if (pl.st === "G") {
      pl.vx = 0;
      if (inL) { pl.vx = -1; pl.dir = -1; }
      if (inR) { pl.vx = 1; pl.dir = 1; }
      pl.x = ARC.clamp(pl.x + pl.vx, 8, 248);
      if (pl.vx !== 0) {
        pl.anim++;
        if (pl.anim % 12 === 0) A.beep(220, 0.03, "square", 0.02);
      }
      /* 사다리 진입 */
      if (inU && pl.floor > 0) {
        var lu = ladderAt(pl.floor - 1, pl.x);
        if (lu) { pl.st = "C"; pl.ladder = lu; pl.x = lu.x; }
      }
      if (pl.st === "G" && inD && pl.floor < 3) {
        var ld = ladderAt(pl.floor, pl.x);
        if (ld) { pl.st = "C"; pl.ladder = ld; pl.x = ld.x; }
      }
      /* 점프 */
      if (pl.st === "G" && inJ) {
        pl.st = "J"; pl.vy = -2.6;
        pl.vx = inL ? -1 : inR ? 1 : 0;
        A.beep(320, 0.12, "square", 0.04, 520);
      }
    } else if (pl.st === "C") {
      var topY = FLOORS[pl.ladder.f], botY = FLOORS[pl.ladder.f + 1];
      if (inU) { pl.y -= 0.75; if (pl.anim++ % 14 === 0) A.beep(260, 0.03, "triangle", 0.03); }
      if (inD) { pl.y += 0.75; if (pl.anim++ % 14 === 0) A.beep(260, 0.03, "triangle", 0.03); }
      if (pl.y <= topY) { pl.y = topY; pl.floor = pl.ladder.f; pl.st = "G"; pl.ladder = null; }
      else if (pl.y >= botY) { pl.y = botY; pl.floor = pl.ladder.f + 1; pl.st = "G"; pl.ladder = null; }
    } else if (pl.st === "J") {
      pl.x = ARC.clamp(pl.x + pl.vx, 8, 248);
      pl.vy += 0.18;
      pl.y += pl.vy;
      if (pl.vy > 0 && pl.y >= FLOORS[pl.floor]) {
        pl.y = FLOORS[pl.floor];
        pl.st = "G"; pl.vy = 0;
      }
    }

    /* 뱀 */
    for (var i = 0; i < snakes.length; i++) {
      var s = snakes[i];
      s.x += s.d * s.spd;
      if (s.x < 8) { s.x = 8; s.d = 1; s.grace = 4; }
      if (s.x > 240) { s.x = 240; s.d = -1; s.grace = 4; }
      if (s.grace > 0) { s.grace--; continue; }
      if (!auto && s.f === pl.floor && pl.y > FLOORS[pl.floor] - 10 &&
          Math.abs(s.x - pl.x) < 10) die();
    }
    /* 가시 */
    if (!auto && pl.st !== "D") {
      for (var k = 0; k < spikes.length; k++) {
        var sp = spikes[k];
        if (sp.f === pl.floor && pl.y > FLOORS[pl.floor] - 8 &&
            Math.abs(sp.x - pl.x) < 8) { die(); break; }
      }
    }
    if (pl.st === "D") return;

    /* 과일 */
    var left = 0;
    for (var f = 0; f < fruits.length; f++) {
      var fr = fruits[f];
      if (!fr.on) continue;
      if (fr.f === pl.floor && Math.abs(fr.x - pl.x) < 9 && pl.y > FLOORS[fr.f] - 14) {
        fr.on = false;
        score += FRUIT_PTS[fr.t];
        syncHud();
        A.beep(880, 0.06, "square", 0.05);
        setTimeout(function () { A.beep(1175, 0.08, "square", 0.05); }, 40);
        continue;
      }
      left++;
    }
    if (!auto && left === 0) fsm.go("CLEAR");
    if (auto && left === 0) {
      for (var rf = 0; rf < fruits.length; rf++) fruits[rf].on = true;
    }
  }

  /* ══ 렌더 ══════════════════════════════════ */
  function drawRaccoon() {
    var x = (pl.x - 6) | 0, y = pl.y | 0;   /* x: 좌상단, y: 발 */
    var step = (pl.st === "G" && pl.vx !== 0 && (pl.anim % 16) < 8) ? 1 : 0;
    var climb = pl.st === "C" ? ((pl.anim % 16) < 8 ? 1 : 0) : 0;
    /* 귀 */
    px(x + 1, y - 14, 2, 3, "#8a8a9e"); px(x + 9, y - 14, 2, 3, "#8a8a9e");
    /* 머리·몸 */
    px(x, y - 12, 12, 8, "#8a8a9e");
    /* 마스크·눈 */
    px(x + 1, y - 9, 3, 3, "#2b2b38"); px(x + 8, y - 9, 3, 3, "#2b2b38");
    if (pl.st === "D") {
      px(x + 2, y - 8, 1, 1, "#ff3b6b"); px(x + 9, y - 8, 1, 1, "#ff3b6b");
      txt("!", x + 4, y - 26, "#ffd23f");
    } else {
      px(x + 2, y - 8, 1, 1, "#f3eee2"); px(x + 9, y - 8, 1, 1, "#f3eee2");
    }
    px(x + 4, y - 6, 4, 2, "#f3eee2");       /* 주둥이 */
    px(x + 1, y - 4, 10, 3, "#9a9aae");      /* 하체 */
    if (pl.st === "C") {                     /* 사다리: 팔 위로 */
      px(x - 1, y - 13 + climb * 2, 2, 4, "#8a8a9e");
      px(x + 11, y - 11 - climb * 2, 2, 4, "#8a8a9e");
      px(x + 3, y - 1, 2, 2, "#2b2b38"); px(x + 7, y - 1, 2, 2, "#2b2b38");
    } else if (pl.st === "J") {              /* 점프: 다리 오므림 */
      px(x + 2, y - 2, 3, 2, "#2b2b38"); px(x + 7, y - 2, 3, 2, "#2b2b38");
    } else {
      px(x + 1 + step * 2, y - 1, 3, 2, "#2b2b38");
      px(x + 8 - step * 2, y - 1, 3, 2, "#2b2b38");
    }
  }

  function render() {
    px(0, 0, W, H, "#0a1a12");
    /* 타이머 바 */
    txt("TIME", 8, 4, "#9d97be");
    px(48, 5, 168, 6, "#173325");
    var tw = Math.max(0, Math.round(timer / STAGE_TIME * 168));
    px(48, 5, tw, 6, timer < 600 ? "#ff3b6b" : "#ffd23f");
    txt("ST." + stage, W - 40, 4, "#35e0a1");

    /* 층 */
    for (var f = 0; f < 4; f++) px(0, FLOORS[f], W, 4, "#2e7d5b");
    /* 사다리 */
    for (var l = 0; l < ladders.length; l++) {
      var ld = ladders[l];
      var ty = FLOORS[ld.f], by = FLOORS[ld.f + 1];
      px(ld.x - 6, ty, 2, by - ty, "#8a6a3a");
      px(ld.x + 4, ty, 2, by - ty, "#8a6a3a");
      for (var ry = ty + 5; ry < by; ry += 7) px(ld.x - 6, ry, 12, 2, "#c49a5a");
    }
    /* 가시 */
    for (var k = 0; k < spikes.length; k++) {
      var sp = spikes[k];
      for (var t3 = 0; t3 < 3; t3++)
        px(sp.x - 6 + t3 * 4, FLOORS[sp.f] - 5, 2, 5, "#9d97be");
      px(sp.x - 6, FLOORS[sp.f] - 1, 12, 1, "#6a6a80");
    }
    /* 과일 */
    for (var fi = 0; fi < fruits.length; fi++) {
      var fr = fruits[fi];
      if (!fr.on) continue;
      px(fr.x - 3, FLOORS[fr.f] - 7, 6, 6, FRUIT_COL[fr.t]);
      px(fr.x - 1, FLOORS[fr.f] - 9, 2, 2, "#35e0a1");
    }
    /* 뱀 */
    for (var si = 0; si < snakes.length; si++) {
      var s = snakes[si];
      for (var seg = 1; seg < 5; seg++)
        px(s.x - s.d * seg * 5, FLOORS[s.f] - 5 + Math.sin(frame * 0.15 + seg) * 2, 4, 4, "#7ee06b");
      px(s.x, FLOORS[s.f] - 6, 5, 5, "#b7ff8a");
      px(s.x + (s.d > 0 ? 3 : 0), FLOORS[s.f] - 5, 1, 1, "#000");
    }
    drawRaccoon();
  }

  /* ══ 상태 머신 ═════════════════════════════ */
  var fsm = ARC.fsm({
    ATTRACT: {
      enter: function () {
        score = 0; lives = 3;
        enterStage(1);
        syncHud();
        ovShow(
          '<span class="ov-big ov-gold ov-blink">PUSH START</span>' +
          '<span class="ov-sub">과일을 전부 먹으면 스테이지 클리어</span>' +
          '<span class="ov-dim">← → 이동 · ↑ ↓ 사다리 · Z 점프</span>'
        );
      },
      step: function () {
        /* 모션 감소 설정이면 데모는 정지 화면으로 둡니다 */
        if (!ARC.reduced) updatePlay(true);
        if (ARC.input.pressed("start") || ARC.input.pressed("a")) newGame();
      }
    },
    READY: {
      enter: function () {
        ovShow('<span class="ov-big">STAGE ' + stage + '</span><span class="ov-sub ov-blink">READY!</span>');
        A.chord([523, 659, 784]);
      },
      step: function (t) { if (t >= 90) { ovHide(); fsm.go("PLAY"); } }
    },
    PLAY: {
      step: function () {
        if (ARC.input.pressed("start")) {
          paused = !paused;
          if (paused) ovShow('<span class="ov-big">PAUSE</span><span class="ov-dim">ENTER로 계속합니다</span>');
          else ovHide();
        }
        if (!paused) updatePlay(false);
      },
      exit: function () { paused = false; ovHide(); }
    },
    CLEAR: {
      enter: function () {
        score += 5000;
        syncHud();
        ovShow('<span class="ov-big ov-gold">STAGE CLEAR!</span><span class="ov-sub">보너스 +5000</span>');
        A.chord([523, 659, 784, 1047]);
      },
      step: function (t) {
        if (t >= 150) { enterStage(stage + 1); fsm.go("READY"); }
      }
    },
    OVER: {
      enter: function () {
        newBest = ARC.best.submit("neoguri", score);
        contN = 9;
        syncHud();
      },
      step: function (t) {
        var n = 9 - Math.floor(t / 60);
        if (n !== contN && n >= 0) { contN = n; A.beep(880 - (9 - n) * 60, 0.08, "square", 0.05); }
        if (n < 0) { fsm.go("FINAL"); return; }
        ovShow(
          '<span class="ov-big">CONTINUE?</span>' +
          '<span class="ov-big ov-gold">' + n + '</span>' +
          '<span class="ov-dim">START를 누르면 이어서 도전합니다</span>'
        );
        if (ARC.input.pressed("start") || ARC.input.pressed("a")) {
          lives = 3;
          syncHud();
          enterStage(stage);
          fsm.go("READY");
        }
      }
    },
    FINAL: {
      enter: function () {
        ovShow(
          '<span class="ov-big">GAME OVER</span>' +
          '<span class="ov-sub">최종 점수 ' + ARC.pad(score, 6) + '</span>' +
          (newBest ? '<span class="ov-sub ov-gold ov-blink">NEW BEST!</span>' : '')
        );
        A.beep(200, 0.8, "sawtooth", 0.06, 40);
      },
      step: function (t) {
        if (t >= 240 || ARC.input.pressed("start")) fsm.go("ATTRACT");
      }
    }
  });

  function newGame() {
    score = 0; lives = 3;
    enterStage(1);
    syncHud();
    fsm.go("READY");
  }

  /* ══ 배선 ══════════════════════════════════ */
  ARC.input.init({
    keys: {
      left: ["ArrowLeft"], right: ["ArrowRight"], up: ["ArrowUp"], down: ["ArrowDown"],
      a: [" ", "z"], b: ["x"], start: ["Enter"]
    },
    touchRoot: document.getElementById("tpad"),
    preventScroll: function () { return !fsm.is("ATTRACT"); }
  });
  document.addEventListener("pointerdown", function () { A.unlock(); }, { once: true });
  A.bindButton(document.getElementById("soundBtn"),
               ["♪ SOUND OFF", "♪ SFX ON", "♫ SFX+BGM"]);

  ARC.glitch(document.getElementById("crt"), document.getElementById("tear"));
  ARC.pageshowReset(function () { if (fsm.is("PLAY")) { paused = false; ovHide(); } });

  var loop = ARC.loop({
    update: function () {
      if (!(ARC.reduced && fsm.is("ATTRACT"))) frame++;
      fsm.step();
    },
    render: render
  });
  fsm.go("ATTRACT");
  loop.start();
  ARC.fit(cv, { w: W, h: H, maxScale: 2 });

  window.__GAME = {
    state: function () { return fsm.state(); },
    score: function () { return score; },
    start: newGame
  };
  if (/[?&]autostart/.test(location.search)) setTimeout(newGame, 400);
})();
</script>

</body>
</html>
