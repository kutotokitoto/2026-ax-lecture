<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽돌깨기 — 옛날 오락실</title>
<style>
  :root {
    --room: #e7e2d6;
    --room-line: rgba(30, 24, 16, .10);
    --ink: #241f1a;
    --ink-soft: #6b6254;
    --ink-faint: #918878;
    --panel: #1c1b2e;
    --panel-hi: #35334f;
    --panel-lo: #08080f;
    --screen: #0b0b14;
    --screen-2: #12121f;
    --screen-ink: #f3eee2;
    --screen-soft: #9a94b5;
    --scan: rgba(0, 0, 0, .30);
    --tint: #ff3b6b;
    --shadow-hard: 8px 8px 0 rgba(20, 16, 10, .28);
    --font-ui: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
               "Malgun Gothic", system-ui, sans-serif;
    --font-arcade: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --room: #0a0a11;
      --room-line: rgba(255, 255, 255, .06);
      --ink: #ece7dc;
      --ink-soft: #a09a8d;
      --ink-faint: #6f6a60;
      --panel: #17162a;
      --panel-hi: #2e2c49;
      --panel-lo: #000004;
      --screen: #07070e;
      --screen-2: #0d0d18;
      --screen-ink: #f6f2e8;
      --screen-soft: #8f89ad;
      --scan: rgba(0, 0, 0, .42);
      --shadow-hard: 8px 8px 0 rgba(0, 0, 0, .55);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--room);
    background-image:
      linear-gradient(var(--room-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--room-line) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px;
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  .navs { display: flex; gap: 18px; flex-wrap: wrap; padding: 22px 0 18px; }
  .navs a {
    font-family: var(--font-arcade);
    font-size: 12px; letter-spacing: .08em;
    color: var(--ink-soft); text-decoration: none;
  }
  .navs a:hover, .navs a:focus-visible { color: var(--tint); outline: none; }

  .crt {
    position: relative;
    border: 4px solid var(--panel-lo);
    box-shadow: var(--shadow-hard);
    background: radial-gradient(120% 90% at 50% 0%, var(--screen-2), var(--screen) 70%);
    padding: 34px 22px 40px;
    text-align: center;
    overflow: hidden;
  }
  .crt::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 2px, var(--scan) 2px 3px);
    pointer-events: none;
  }
  .art {
    display: block;
    width: 108px; height: 108px;
    margin: 0 auto 20px;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .55));
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--screen-ink);
    text-shadow: 0 4px 0 rgba(0, 0, 0, .6);
  }
  .en {
    margin: 0 0 22px;
    font-family: var(--font-arcade);
    font-size: 11px; letter-spacing: .26em;
    color: var(--tint);
  }
  .blink {
    margin: 0 0 10px;
    font-family: var(--font-arcade);
    font-size: 13px; letter-spacing: .2em;
    color: var(--screen-ink);
    animation: blink 1.1s steps(2, end) infinite;
  }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
  .desc { margin: 0 auto; max-width: 46ch; font-size: 14px; color: var(--screen-soft); }

  footer {
    padding: 20px 0 44px;
    font-family: var(--font-arcade);
    font-size: 11px; letter-spacing: .1em;
    color: var(--ink-faint); text-align: center;
  }
  footer p { margin: 0; }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <nav class="navs">
    <a href="../../index.html">← 오락실로</a>
    <a href="../../../../index.html">← 목록으로</a>
  </nav>

  <div class="crt">
    <svg class="art" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="2" width="4" height="2" fill="#ff3b6b"/>
      <rect x="6" y="2" width="4" height="2" fill="#ffd23f"/>
      <rect x="11" y="2" width="4" height="2" fill="#4cc2ff"/>
      <rect x="1" y="5" width="4" height="2" fill="#35e0a1"/>
      <rect x="6" y="5" width="4" height="2" fill="#b98cff"/>
      <rect x="11" y="5" width="4" height="2" fill="#ff3b6b"/>
      <rect x="9" y="9" width="2" height="2" fill="#f3eee2"/>
      <rect x="5" y="13" width="6" height="2" fill="#f3eee2"/>
      <rect x="5" y="13" width="6" height="1" fill="#9a94b5"/>
    </svg>

    <h1>벽돌깨기</h1>
    <p class="en">Brick Breaker</p>
    <p class="blink">COMING SOON</p>
    <p class="desc">공을 튕겨 벽돌을 부수는 원조 반사신경 게임입니다. 게임은 아직 준비 중입니다.</p>
  </div>

  <footer><p>2026 AX 강의 · 옛날 오락실</p></footer>
</div>

</body>
</html>
