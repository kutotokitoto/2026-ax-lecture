<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블록 월드 — 요즘 오락실</title>
<meta name="description" content="복셀 오픈 월드 샌드박스 — 요즘 오락실">
<link rel="stylesheet" href="../../lib/ax-ui.css">
<style>
  /* ── 블록 월드 전용 HUD ─────────────────── */

  /* 조준점 */
  .cross {
    position: absolute;
    left: 50%; top: 50%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    opacity: .9;
  }
  .cross::before, .cross::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 3px rgba(0, 0, 0, .8);
    mix-blend-mode: difference;
  }
  .cross::before { left: 9px; top: 2px; width: 2px; height: 16px; }
  .cross::after { top: 9px; left: 2px; height: 2px; width: 16px; }

  /* 핫바 */
  .hotbar {
    position: absolute;
    left: 50%; bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 7px;
    border: 1px solid var(--ax-stroke);
    border-radius: 16px;
    background: rgba(6, 8, 16, .55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .slot {
    position: relative;
    width: 46px; height: 46px;
    border: 1px solid transparent;
    border-radius: 11px;
    background-size: cover;
    background-position: center;
    image-rendering: auto;
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .slot::after {
    content: attr(data-key);
    position: absolute;
    right: 3px; bottom: 1px;
    font-family: var(--ax-mono);
    font-size: 9px;
    color: rgba(255, 255, 255, .55);
    text-shadow: 0 1px 2px #000;
  }
  .slot[data-on="1"] {
    border-color: var(--ax-tint);
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 6px 20px -6px var(--ax-tint), 0 0 0 1px var(--ax-tint) inset;
  }
  .slot-name {
    position: absolute;
    left: 50%; bottom: 82px;
    transform: translateX(-50%);
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(6, 8, 16, .6);
    font-size: 12px;
    color: var(--ax-text);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .slot-name[data-show="1"] { opacity: 1; }

  /* 좌측 상단 정보 */
  .readout {
    position: absolute;
    left: 18px; top: 58px;
    display: grid;
    gap: 2px;
    font-family: var(--ax-mono);
    font-size: 11px;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .55);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
    font-variant-numeric: tabular-nums;
  }
  .readout b { color: rgba(255, 255, 255, .85); font-weight: 600; }

  /* 시간대 배지 */
  .timebadge {
    position: absolute;
    right: 18px; bottom: 26px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border: 1px solid var(--ax-stroke);
    border-radius: 999px;
    background: rgba(6, 8, 16, .55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: var(--ax-mono);
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--ax-text-soft);
  }
  .sun-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--ax-amber);
    box-shadow: 0 0 10px var(--ax-amber);
  }

  /* 화면 가장자리 비네트 — 몰입감을 조금 더합니다 */
  .edge {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0, 0, 0, .38));
  }

  @media (max-width: 560px) {
    .slot { width: 38px; height: 38px; }
    .readout { font-size: 10px; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<script src="../../lib/ax3d.js"></script>
<script src="../../lib/ax-ui.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     블록 정의
     ══════════════════════════════════════════════════════════ */

  var CX = 16, CY = 64, CZ = 16;      // 청크 크기
  var SEA = 30;                        // 해수면 높이

  var AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, SAND = 4, SNOW = 5,
      LOG = 6, LEAVES = 7, WATER = 8, GLOW = 9, PLANK = 10;

  /* 텍스처 배열의 레이어 번호 */
  var T_GRASS_TOP = 0, T_GRASS_SIDE = 1, T_DIRT = 2, T_STONE = 3, T_SAND = 4,
      T_SNOW_TOP = 5, T_SNOW_SIDE = 6, T_LOG_SIDE = 7, T_LOG_TOP = 8,
      T_LEAVES = 9, T_WATER = 10, T_GLOW = 11, T_PLANK = 12;
  var TEX_LAYERS = 13;

  /* faces 순서: +X, -X, +Y, -Y, +Z, -Z */
  var BLOCKS = [
    { name: '공기', solid: false, opaque: false },
    { name: '잔디', solid: true, opaque: true,
      faces: [T_GRASS_SIDE, T_GRASS_SIDE, T_GRASS_TOP, T_DIRT, T_GRASS_SIDE, T_GRASS_SIDE] },
    { name: '흙', solid: true, opaque: true, faces: [T_DIRT, T_DIRT, T_DIRT, T_DIRT, T_DIRT, T_DIRT] },
    { name: '돌', solid: true, opaque: true, faces: [T_STONE, T_STONE, T_STONE, T_STONE, T_STONE, T_STONE] },
    { name: '모래', solid: true, opaque: true, faces: [T_SAND, T_SAND, T_SAND, T_SAND, T_SAND, T_SAND] },
    { name: '눈', solid: true, opaque: true,
      faces: [T_SNOW_SIDE, T_SNOW_SIDE, T_SNOW_TOP, T_DIRT, T_SNOW_SIDE, T_SNOW_SIDE] },
    { name: '통나무', solid: true, opaque: true,
      faces: [T_LOG_SIDE, T_LOG_SIDE, T_LOG_TOP, T_LOG_TOP, T_LOG_SIDE, T_LOG_SIDE] },
    { name: '나뭇잎', solid: true, opaque: true,
      faces: [T_LEAVES, T_LEAVES, T_LEAVES, T_LEAVES, T_LEAVES, T_LEAVES] },
    { name: '물', solid: false, opaque: false, liquid: true,
      faces: [T_WATER, T_WATER, T_WATER, T_WATER, T_WATER, T_WATER] },
    { name: '발광 블록', solid: true, opaque: true, emissive: true,
      faces: [T_GLOW, T_GLOW, T_GLOW, T_GLOW, T_GLOW, T_GLOW] },
    { name: '판자', solid: true, opaque: true,
      faces: [T_PLANK, T_PLANK, T_PLANK, T_PLANK, T_PLANK, T_PLANK] }
  ];

  var HOTBAR = [GRASS, DIRT, STONE, SAND, SNOW, LOG, LEAVES, PLANK, GLOW];

  /* ══════════════════════════════════════════════════════════
     절차 텍스처 — 외부 이미지를 쓸 수 없으니 전부 그려서 만듭니다
     ══════════════════════════════════════════════════════════ */

  /* 이음매 없는 값 노이즈. 타일 네 귀퉁이를 섞습니다. */
  function tileNoise(x, y, size, freq, oct) {
    var f = freq, o = oct || 3;
    var a = AX.noise.fbm2(x * f, y * f, o);
    var b = AX.noise.fbm2((x - size) * f, y * f, o);
    var c = AX.noise.fbm2(x * f, (y - size) * f, o);
    var d = AX.noise.fbm2((x - size) * f, (y - size) * f, o);
    var u = x / size, v = y / size;
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }

  function paint(ctx, size, fn) {
    var img = ctx.createImageData(size, size), d = img.data;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var c = fn(x, y, size);
        var i = (y * size + x) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
        d[i + 3] = c.length > 3 ? c[3] : 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function mixc(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

  /* 레이어별 그리기 함수 */
  var TEX_DRAW = [];

  TEX_DRAW[T_GRASS_TOP] = function (ctx, size) {
    AX.noise.setSeed(11);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.09, 3);
      var f = tileNoise(x + 40, y + 90, size, 0.34, 2);
      var c = mixc([70, 132, 56], [128, 196, 88], n * 0.85 + f * 0.15);
      var speck = tileNoise(x + 300, y + 120, size, 0.8, 1);
      if (speck > 0.72) c = mixc(c, [156, 214, 108], 0.6);
      if (speck < 0.24) c = mixc(c, [52, 104, 44], 0.5);
      return c;
    });
  };

  TEX_DRAW[T_GRASS_SIDE] = function (ctx, size) {
    AX.noise.setSeed(12);
    paint(ctx, size, function (x, y) {
      var edge = size * 0.26 + tileNoise(x, y, size, 0.22, 2) * size * 0.16;
      var dirt = mixc([102, 74, 48], [138, 104, 70], tileNoise(x + 10, y + 60, size, 0.16, 3));
      var sp = tileNoise(x + 500, y + 5, size, 0.7, 1);
      if (sp > 0.76) dirt = mixc(dirt, [86, 62, 40], 0.6);
      if (y > edge) return dirt;
      var grass = mixc([64, 124, 52], [122, 188, 84], tileNoise(x, y, size, 0.12, 3));
      /* 잔디와 흙 경계에 살짝 그늘을 넣습니다. */
      if (y > edge - 3) grass = mixc(grass, [44, 88, 38], (y - (edge - 3)) / 3 * 0.55);
      return grass;
    });
  };

  TEX_DRAW[T_DIRT] = function (ctx, size) {
    AX.noise.setSeed(13);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.13, 3);
      var c = mixc([98, 70, 45], [142, 106, 71], n);
      var sp = tileNoise(x + 220, y + 77, size, 0.75, 1);
      if (sp > 0.78) c = mixc(c, [78, 56, 36], 0.55);
      if (sp < 0.2) c = mixc(c, [160, 124, 86], 0.35);
      return c;
    });
  };

  TEX_DRAW[T_STONE] = function (ctx, size) {
    AX.noise.setSeed(14);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.1, 4);
      var c = mixc([118, 122, 132], [166, 171, 182], n);
      /* 균열 — 노이즈 등고선을 어둡게 */
      var crack = Math.abs(tileNoise(x + 60, y + 30, size, 0.07, 2) - 0.5);
      if (crack < 0.03) c = mixc(c, [76, 80, 90], 1 - crack / 0.03);
      var sp = tileNoise(x + 900, y + 400, size, 0.9, 1);
      if (sp > 0.8) c = mixc(c, [188, 192, 200], 0.4);
      return c;
    });
  };

  TEX_DRAW[T_SAND] = function (ctx, size) {
    AX.noise.setSeed(15);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.2, 3);
      var g = tileNoise(x + 33, y + 71, size, 1.1, 1);
      return mixc([206, 184, 130], [235, 218, 166], n * 0.7 + g * 0.3);
    });
  };

  TEX_DRAW[T_SNOW_TOP] = function (ctx, size) {
    AX.noise.setSeed(16);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.15, 3);
      var g = tileNoise(x + 12, y + 88, size, 0.95, 1);
      var c = mixc([222, 232, 244], [252, 254, 255], n * 0.6 + g * 0.4);
      if (g > 0.85) c = mixc(c, [255, 255, 255], 0.8);
      return c;
    });
  };

  TEX_DRAW[T_SNOW_SIDE] = function (ctx, size) {
    AX.noise.setSeed(17);
    paint(ctx, size, function (x, y) {
      var edge = size * 0.3 + tileNoise(x, y, size, 0.2, 2) * size * 0.13;
      if (y > edge) {
        var d = mixc([98, 70, 45], [140, 104, 70], tileNoise(x + 10, y, size, 0.16, 3));
        return d;
      }
      var s = mixc([220, 231, 244], [253, 254, 255], tileNoise(x, y, size, 0.14, 3));
      if (y > edge - 2) s = mixc(s, [180, 196, 214], (y - (edge - 2)) / 2 * 0.6);
      return s;
    });
  };

  TEX_DRAW[T_LOG_SIDE] = function (ctx, size) {
    AX.noise.setSeed(18);
    paint(ctx, size, function (x, y) {
      /* 세로 결 — x 방향으로만 변하게 하면 나뭇결처럼 보입니다. */
      var bark = AX.noise.fbm2(x * 0.34, y * 0.045, 3);
      var c = mixc([86, 60, 36], [132, 96, 58], bark);
      var groove = Math.abs(AX.noise.fbm2(x * 0.5, y * 0.02, 2) - 0.5);
      if (groove < 0.06) c = mixc(c, [58, 40, 24], 1 - groove / 0.06);
      return c;
    });
  };

  TEX_DRAW[T_LOG_TOP] = function (ctx, size) {
    AX.noise.setSeed(19);
    paint(ctx, size, function (x, y) {
      var cx = size / 2, cy = size / 2;
      var r = Math.hypot(x - cx, y - cy) / (size / 2);
      var rings = Math.sin(r * 26 + tileNoise(x, y, size, 0.1, 2) * 4) * 0.5 + 0.5;
      var c = mixc([150, 116, 74], [196, 160, 108], rings * 0.7 + 0.15);
      if (r > 0.92) c = mixc(c, [88, 62, 38], (r - 0.92) / 0.08);
      return c;
    });
  };

  TEX_DRAW[T_LEAVES] = function (ctx, size) {
    AX.noise.setSeed(20);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.28, 3);
      var c = mixc([38, 84, 40], [96, 158, 62], n);
      var hole = tileNoise(x + 400, y + 150, size, 0.42, 2);
      if (hole < 0.28) c = mixc(c, [22, 48, 26], 0.75);      // 그늘진 틈
      if (n > 0.78) c = mixc(c, [132, 196, 86], 0.5);        // 햇빛 받는 잎
      return c;
    });
  };

  TEX_DRAW[T_WATER] = function (ctx, size) {
    AX.noise.setSeed(21);
    paint(ctx, size, function (x, y) {
      var n = tileNoise(x, y, size, 0.12, 3);
      return mixc([26, 78, 132], [54, 132, 190], n);
    });
  };

  TEX_DRAW[T_GLOW] = function (ctx, size) {
    AX.noise.setSeed(22);
    paint(ctx, size, function (x, y) {
      var base = [12, 18, 34];
      var gx = Math.min(x, size - 1 - x), gy = Math.min(y, size - 1 - y);
      var border = Math.min(gx, gy);
      /* 테두리 네온 링 */
      if (border < 3) return [90, 226, 255];
      if (border < 5) return mixc(base, [90, 226, 255], 0.45);
      /* 안쪽 격자 */
      var g = (x % 16 < 1.5 || y % 16 < 1.5) ? 0.55 : 0;
      var pulse = tileNoise(x, y, size, 0.2, 2) * 0.3;
      return mixc(base, [60, 200, 240], g + pulse * 0.5);
    });
  };

  TEX_DRAW[T_PLANK] = function (ctx, size) {
    AX.noise.setSeed(23);
    paint(ctx, size, function (x, y) {
      var row = Math.floor(y / (size / 4));
      var grain = AX.noise.fbm2(x * 0.09 + row * 13.7, y * 0.5, 3);
      var c = mixc([150, 110, 66], [196, 154, 100], grain);
      var edge = y % (size / 4);
      if (edge < 1.5) c = mixc(c, [96, 68, 40], 0.8);
      /* 판자마다 못 자국 */
      if ((x % (size / 2) < 3) && (edge > size / 8 - 2 && edge < size / 8 + 1)) {
        c = mixc(c, [80, 66, 52], 0.7);
      }
      return c;
    });
  };

  /* ══════════════════════════════════════════════════════════
     지형 생성
     ══════════════════════════════════════════════════════════ */

  var TERRAIN_SEED = 20260810;

  /* 지형 높이 — 대륙 노이즈 + 산악 + 잔디테일 */
  var heightCache = new Map();
  function terrainHeight(x, z) {
    var k = x + ',' + z;
    var v = heightCache.get(k);
    if (v !== undefined) return v;

    AX.noise.setSeed(TERRAIN_SEED);
    /* 도메인 워핑으로 능선을 구부립니다. */
    var wx = AX.noise.fbm2(x * 0.011 + 17.3, z * 0.011, 2) * 14 - 7;
    var wz = AX.noise.fbm2(x * 0.011, z * 0.011 + 41.7, 2) * 14 - 7;

    var cont = AX.noise.fbm2((x + wx) * 0.0056, (z + wz) * 0.0056, 4);
    var mountain = Math.max(0, cont - 0.52) * 2.1;
    mountain = mountain * mountain * 34;
    var detail = AX.noise.fbm2(x * 0.045, z * 0.045, 3);

    var h = Math.floor(21 + cont * 20 + mountain + detail * 4.5);
    h = Math.max(1, Math.min(CY - 8, h));
    if (heightCache.size > 400000) heightCache.clear();
    heightCache.set(k, h);
    return h;
  }

  /* 0 한대 · 1 온대 · 2 사막 */
  function biomeAt(x, z) {
    AX.noise.setSeed(TERRAIN_SEED + 7);
    var t = AX.noise.fbm2(x * 0.0032 + 91.2, z * 0.0032 + 43.1, 3);
    if (t < 0.39) return 0;
    if (t > 0.63) return 2;
    return 1;
  }

  function caveAt(x, y, z) {
    AX.noise.setSeed(TERRAIN_SEED + 31);
    var n = AX.noise.fbm3(x * 0.055, y * 0.085, z * 0.055, 3);
    return n > 0.615;
  }

  function Chunk(cx, cz) {
    this.cx = cx; this.cz = cz;
    this.blocks = new Uint8Array(CX * CY * CZ);
    this.generated = false;
    this.dirty = true;
    this.maxY = 0;
    this.mesh = null;
    this.waterMesh = null;
    this.origin = new Float32Array([cx * CX, 0, cz * CZ]);
  }

  Chunk.prototype.idx = function (x, y, z) { return x + CX * (z + CZ * y); };
  Chunk.prototype.get = function (x, y, z) { return this.blocks[x + CX * (z + CZ * y)]; };
  Chunk.prototype.set = function (x, y, z, v) { this.blocks[x + CX * (z + CZ * y)] = v; };

  Chunk.prototype.generate = function () {
    var ox = this.cx * CX, oz = this.cz * CZ;
    var b = this.blocks, maxY = 0;

    for (var z = 0; z < CZ; z++) {
      for (var x = 0; x < CX; x++) {
        var wx = ox + x, wz = oz + z;
        var h = terrainHeight(wx, wz);
        var biome = biomeAt(wx, wz);
        var beach = h <= SEA + 1 && h >= SEA - 2;

        var surface = GRASS, sub = DIRT;
        if (biome === 0) { surface = SNOW; sub = DIRT; }
        else if (biome === 2 || beach) { surface = SAND; sub = SAND; }
        if (h > 44) surface = SNOW;             // 고산대는 만년설

        for (var y = 0; y <= h; y++) {
          var t;
          if (y === h) t = surface;
          else if (y > h - 4) t = sub;
          else t = STONE;
          if (y > 1 && y < h - 1 && caveAt(wx, y, wz)) t = AIR;
          if (t !== AIR) b[x + CX * (z + CZ * y)] = t;
        }
        /* 해수면 아래는 물로 채웁니다. */
        for (var wy = h + 1; wy <= SEA; wy++) b[x + CX * (z + CZ * wy)] = WATER;
        if (Math.max(h, SEA) > maxY) maxY = Math.max(h, SEA);
      }
    }

    /* 나무 — 청크 경계를 넘는 나무도 제대로 나오도록 주변까지 훑습니다. */
    for (var tz = -3; tz < CZ + 3; tz++) {
      for (var tx = -3; tx < CX + 3; tx++) {
        var twx = ox + tx, twz = oz + tz;
        AX.noise.setSeed(TERRAIN_SEED + 99);
        if (AX.noise.hash2(twx, twz) > 0.0135) continue;
        if (biomeAt(twx, twz) === 2) continue;              // 사막에는 안 심습니다
        var th = terrainHeight(twx, twz);
        if (th <= SEA + 1 || th > 44) continue;
        this.placeTree(tx, th + 1, tz, AX.noise.hash2(twx + 7, twz - 3));
        if (th + 8 > maxY) maxY = th + 8;
      }
    }

    this.maxY = Math.min(CY - 1, maxY + 1);
    this.generated = true;
    this.dirty = true;
  };

  /* 나무 한 그루. 청크 밖 좌표는 자동으로 잘립니다. */
  Chunk.prototype.placeTree = function (lx, ly, lz, r) {
    var trunk = 4 + Math.floor(r * 3);
    var self = this;
    function put(x, y, z, t, overwrite) {
      if (x < 0 || x >= CX || z < 0 || z >= CZ || y < 0 || y >= CY) return;
      var cur = self.get(x, y, z);
      if (!overwrite && cur !== AIR && cur !== WATER && cur !== LEAVES) return;
      self.set(x, y, z, t);
    }
    for (var i = 0; i < trunk; i++) put(lx, ly + i, lz, LOG, true);

    var top = ly + trunk;
    for (var dy = -2; dy <= 2; dy++) {
      var rad = dy <= 0 ? 2 : (dy === 1 ? 2 : 1);
      for (var dx = -rad; dx <= rad; dx++) {
        for (var dz = -rad; dz <= rad; dz++) {
          if (Math.abs(dx) === rad && Math.abs(dz) === rad && dy > 0) continue;
          if (dx === 0 && dz === 0 && dy < 1) continue;     // 줄기 자리
          if (Math.hypot(dx, dz, dy * 1.3) > rad + 0.7) continue;
          put(lx + dx, top + dy, lz + dz, LEAVES, false);
        }
      }
    }
  };

  /* ══════════════════════════════════════════════════════════
     월드 — 청크 관리
     ══════════════════════════════════════════════════════════ */

  var world = {
    chunks: new Map(),
    genQueue: [],
    meshQueue: [],

    key: function (cx, cz) { return cx + ',' + cz; },

    get: function (cx, cz) { return world.chunks.get(world.key(cx, cz)); },

    ensure: function (cx, cz) {
      var k = world.key(cx, cz);
      var c = world.chunks.get(k);
      if (!c) {
        c = new Chunk(cx, cz);
        world.chunks.set(k, c);
        world.genQueue.push(c);
      }
      return c;
    },

    /* 월드 좌표 → 블록. 없는 청크는 공기로 봅니다. */
    getBlock: function (x, y, z) {
      if (y < 0 || y >= CY) return AIR;
      var cx = Math.floor(x / CX), cz = Math.floor(z / CZ);
      var c = world.chunks.get(cx + ',' + cz);
      if (!c || !c.generated) return AIR;
      return c.blocks[(x - cx * CX) + CX * ((z - cz * CZ) + CZ * y)];
    },

    setBlock: function (x, y, z, v) {
      if (y < 0 || y >= CY) return false;
      var cx = Math.floor(x / CX), cz = Math.floor(z / CZ);
      var c = world.chunks.get(cx + ',' + cz);
      if (!c || !c.generated) return false;
      var lx = x - cx * CX, lz = z - cz * CZ;
      c.blocks[lx + CX * (lz + CZ * y)] = v;
      if (y > c.maxY) c.maxY = Math.min(CY - 1, y + 1);
      world.markDirty(c);
      /* 경계 블록이면 이웃 청크의 면도 다시 계산해야 합니다. */
      if (lx === 0) world.markDirtyAt(cx - 1, cz);
      if (lx === CX - 1) world.markDirtyAt(cx + 1, cz);
      if (lz === 0) world.markDirtyAt(cx, cz - 1);
      if (lz === CZ - 1) world.markDirtyAt(cx, cz + 1);
      return true;
    },

    markDirty: function (c) {
      if (!c || c.dirty) return;
      c.dirty = true;
      world.meshQueue.unshift(c);
    },
    markDirtyAt: function (cx, cz) { world.markDirty(world.get(cx, cz)); },

    isSolid: function (x, y, z) {
      var b = world.getBlock(x, y, z);
      return BLOCKS[b].solid;
    },
    isOpaque: function (x, y, z) {
      if (y < 0) return true;             // 바닥 아래는 막힌 것으로 — AO가 자연스러워집니다
      var b = world.getBlock(x, y, z);
      return BLOCKS[b].opaque;
    },

    neighborsReady: function (c) {
      var n = [world.get(c.cx - 1, c.cz), world.get(c.cx + 1, c.cz),
               world.get(c.cx, c.cz - 1), world.get(c.cx, c.cz + 1)];
      for (var i = 0; i < 4; i++) if (!n[i] || !n[i].generated) return false;
      return true;
    }
  };

  /* ══════════════════════════════════════════════════════════
     청크 메시 — 정점을 32비트 두 개로 압축합니다
       u0: x(5) y(7) z(5) face(3) ao(2) u(1) v(1)
       u1: layer(8) emissive(1)
     ══════════════════════════════════════════════════════════ */

  /* n = 면 방향, u·v = 면 평면의 두 축 (u×v = n), o = 시작 모서리 오프셋 */
  var FACES = [
    { n: [1, 0, 0],  u: [0, 0, -1], v: [0, 1, 0], o: [1, 0, 1] },
    { n: [-1, 0, 0], u: [0, 0, 1],  v: [0, 1, 0], o: [0, 0, 0] },
    { n: [0, 1, 0],  u: [1, 0, 0],  v: [0, 0, -1], o: [0, 1, 1] },
    { n: [0, -1, 0], u: [1, 0, 0],  v: [0, 0, 1], o: [0, 0, 0] },
    { n: [0, 0, 1],  u: [1, 0, 0],  v: [0, 1, 0], o: [0, 0, 1] },
    { n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0], o: [1, 0, 0] }
  ];
  var CORNERS = [[0, 0], [1, 0], [1, 1], [0, 1]];

  /* 재사용 스크래치 버퍼 — 청크마다 새로 할당하지 않습니다. */
  var scratchOpaque = new Uint32Array(420000);
  var scratchWater = new Uint32Array(60000);

  function vertexAO(s1, s2, c) {
    if (s1 && s2) return 0;
    return 3 - (s1 + s2 + c);
  }

  function buildMesh(gl, c) {
    var ox = c.cx * CX, oz = c.cz * CZ;
    var op = 0, wp = 0;
    var blocks = c.blocks;

    for (var y = 0; y <= c.maxY; y++) {
      for (var z = 0; z < CZ; z++) {
        for (var x = 0; x < CX; x++) {
          var b = blocks[x + CX * (z + CZ * y)];
          if (b === AIR) continue;
          var def = BLOCKS[b];
          var isWater = !!def.liquid;
          var wx = ox + x, wz = oz + z;

          for (var f = 0; f < 6; f++) {
            var F = FACES[f];
            var nx = wx + F.n[0], ny = y + F.n[1], nz = wz + F.n[2];
            var nb = world.getBlock(nx, ny, nz);

            if (isWater) {
              /* 물은 공기와 맞닿은 면만 그립니다(위쪽 위주). */
              if (nb !== AIR) continue;
            } else {
              if (BLOCKS[nb].opaque) continue;
              /* 물속에 잠긴 면은 그려도 거의 안 보이지만 물 밖에서 보이므로 남깁니다. */
            }

            var layer = def.faces[f];
            var emissive = def.emissive ? 1 : 0;

            /* 네 모서리의 AO */
            var ao = [0, 0, 0, 0];
            for (var ci = 0; ci < 4; ci++) {
              var du = CORNERS[ci][0] * 2 - 1, dv = CORNERS[ci][1] * 2 - 1;
              var s1 = world.isOpaque(nx + F.u[0] * du, ny + F.u[1] * du, nz + F.u[2] * du) ? 1 : 0;
              var s2 = world.isOpaque(nx + F.v[0] * dv, ny + F.v[1] * dv, nz + F.v[2] * dv) ? 1 : 0;
              var cr = world.isOpaque(nx + F.u[0] * du + F.v[0] * dv,
                                      ny + F.u[1] * du + F.v[1] * dv,
                                      nz + F.u[2] * du + F.v[2] * dv) ? 1 : 0;
              ao[ci] = isWater ? 3 : vertexAO(s1, s2, cr);
            }

            /* AO가 비대칭이면 사각형을 반대 대각선으로 나눕니다 (계단 현상 완화). */
            var flip = (ao[0] + ao[2]) > (ao[1] + ao[3]);
            var order = flip ? [1, 2, 3, 1, 3, 0] : [0, 1, 2, 0, 2, 3];

            var target = isWater ? scratchWater : scratchOpaque;
            var ptr = isWater ? wp : op;
            if (ptr + 12 > target.length) continue;   // 넘칠 일은 거의 없지만 방어합니다

            for (var vi = 0; vi < 6; vi++) {
              var ci2 = order[vi];
              var du2 = CORNERS[ci2][0], dv2 = CORNERS[ci2][1];
              var px = x + F.o[0] + F.u[0] * du2 + F.v[0] * dv2;
              var py = y + F.o[1] + F.u[1] * du2 + F.v[1] * dv2;
              var pz = z + F.o[2] + F.u[2] * du2 + F.v[2] * dv2;
              target[ptr] = (px & 31) | ((py & 127) << 5) | ((pz & 31) << 12) |
                            (f << 17) | (ao[ci2] << 20) | (du2 << 22) | (dv2 << 23);
              target[ptr + 1] = layer | (emissive << 8);
              ptr += 2;
            }
            if (isWater) wp = ptr; else op = ptr;
          }
        }
      }
    }

    if (c.mesh) { c.mesh.dispose(); c.mesh = null; }
    if (c.waterMesh) { c.waterMesh.dispose(); c.waterMesh = null; }

    if (op > 0) {
      c.mesh = new AX.Mesh(gl, {
        buffers: [{ data: scratchOpaque.subarray(0, op), stride: 8,
                    attrs: [{ loc: 0, size: 2, offset: 0, integer: true,
                              type: gl.UNSIGNED_INT }] }],
        count: op / 2
      });
    }
    if (wp > 0) {
      c.waterMesh = new AX.Mesh(gl, {
        buffers: [{ data: scratchWater.subarray(0, wp), stride: 8,
                    attrs: [{ loc: 0, size: 2, offset: 0, integer: true,
                              type: gl.UNSIGNED_INT }] }],
        count: wp / 2
      });
    }
    c.dirty = false;
  }

  /* ══════════════════════════════════════════════════════════
     셰이더
     ══════════════════════════════════════════════════════════ */

  var VOXEL_VS = [
    '#version 300 es',
    'layout(location=0) in uvec2 aData;',
    'uniform mat4 uViewProj;',
    'uniform mat4 uLightViewProj;',
    'uniform vec3 uChunkOrigin;',
    'out vec3 vNormal;',
    'out vec3 vWorld;',
    'out vec3 vUVW;',
    'out float vAO;',
    'out float vEmissive;',
    'out vec4 vLightPos;',
    'const vec3 NRM[6] = vec3[6](vec3(1,0,0), vec3(-1,0,0), vec3(0,1,0),',
    '                            vec3(0,-1,0), vec3(0,0,1), vec3(0,0,-1));',
    'void main() {',
    '  uint d = aData.x;',
    '  vec3 p = vec3(float(d & 31u), float((d >> 5) & 127u), float((d >> 12) & 31u));',
    '  uint f = (d >> 17) & 7u;',
    '  vAO = float((d >> 20) & 3u) / 3.0;',
    '  float u = float((d >> 22) & 1u);',
    '  float v = float((d >> 23) & 1u);',
    '  uint meta = aData.y;',
    '  vEmissive = float((meta >> 8) & 1u);',
    '  vNormal = NRM[f];',
    '  vWorld = uChunkOrigin + p;',
    '  vUVW = vec3(u, 1.0 - v, float(meta & 255u));',
    '  vLightPos = uLightViewProj * vec4(vWorld, 1.0);',
    '  gl_Position = uViewProj * vec4(vWorld, 1.0);',
    '}'
  ].join('\n');

  var VOXEL_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DArray;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'in vec3 vUVW;',
    'in float vAO;',
    'in float vEmissive;',
    'in vec4 vLightPos;',
    'uniform sampler2DArray uAtlas;',
    'uniform sampler2D uShadow;',
    'uniform vec3 uSunDir, uSunColor, uSkyTop, uSkyHorizon, uGroundCol, uCamPos, uFogColor;',
    'uniform float uShadowTexel, uFogStart, uFogEnd, uShadowOn;',
    'out vec4 fragColor;',
    AX.chunk.shadow,
    'void main() {',
    '  vec4 t = texture(uAtlas, vUVW);',
    '  vec3 albedo = t.rgb;',
    '  vec3 N = normalize(vNormal);',
    '  float NdotL = max(dot(N, uSunDir), 0.0);',
    '  float sh = uShadowOn > 0.5 ? shadowFactor(uShadow, vLightPos, NdotL, uShadowTexel) : 1.0;',
    '  /* 하늘·지면을 위아래로 섞은 값을 환경광으로 씁니다. */',
    '  float up = N.y * 0.5 + 0.5;',
    '  vec3 ambient = mix(uGroundCol, mix(uSkyHorizon, uSkyTop, up), up) * 0.62;',
    '  /* 측면에 살짝 방향성을 줘서 평평해 보이지 않게 합니다. */',
    '  ambient *= 0.82 + 0.18 * abs(dot(N, vec3(0.5, 0.0, 0.86)));',
    '  float ao = 0.32 + 0.68 * vAO;',
    '  vec3 color = albedo * (ambient + uSunColor * NdotL * sh) * ao;',
    '  color += albedo * vEmissive * 2.6;',
    '  float dist = length(vWorld - uCamPos);',
    '  float fog = smoothstep(uFogStart, uFogEnd, dist);',
    '  color = mix(color, uFogColor, fog);',
    '  fragColor = vec4(color, 1.0);',
    '}'
  ].join('\n');

  var DEPTH_VS = [
    '#version 300 es',
    'layout(location=0) in uvec2 aData;',
    'uniform mat4 uViewProj;',
    'uniform vec3 uChunkOrigin;',
    'void main() {',
    '  uint d = aData.x;',
    '  vec3 p = vec3(float(d & 31u), float((d >> 5) & 127u), float((d >> 12) & 31u));',
    '  gl_Position = uViewProj * vec4(uChunkOrigin + p, 1.0);',
    '}'
  ].join('\n');

  var DEPTH_FS = [
    '#version 300 es',
    'precision mediump float;',
    'void main() {}'
  ].join('\n');

  var WATER_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DArray;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'in vec3 vUVW;',
    'in float vAO;',
    'in float vEmissive;',
    'in vec4 vLightPos;',
    'uniform sampler2DArray uAtlas;',
    'uniform vec3 uSunDir, uSunColor, uSkyTop, uSkyHorizon, uCamPos, uFogColor;',
    'uniform float uTime, uFogStart, uFogEnd;',
    'out vec4 fragColor;',
    'void main() {',
    '  /* 물결 — 파장이 다른 사인파 두 개를 겹쳐 법선을 흔듭니다. */',
    '  float w1 = sin(vWorld.x * 0.9 + uTime * 1.6) * 0.5 + sin(vWorld.z * 1.3 - uTime * 1.1) * 0.5;',
    '  float w2 = sin((vWorld.x + vWorld.z) * 0.45 + uTime * 0.7);',
    '  vec3 N = normalize(vec3(w1 * 0.11, 1.0, w2 * 0.11));',
    '  if (vNormal.y < 0.5) N = normalize(vNormal + vec3(w1 * 0.05, 0.0, w2 * 0.05));',
    '  vec3 V = normalize(uCamPos - vWorld);',
    '  vec3 base = texture(uAtlas, vUVW).rgb;',
    '  float fres = pow(1.0 - max(dot(N, V), 0.0), 3.2);',
    '  vec3 sky = mix(uSkyHorizon, uSkyTop, 0.6);',
    '  vec3 color = mix(base * 0.85, sky, fres * 0.75);',
    '  vec3 H = normalize(uSunDir + V);',
    '  float spec = pow(max(dot(N, H), 0.0), 128.0);',
    '  color += uSunColor * spec * 1.6;',
    '  color += uSunColor * max(dot(N, uSunDir), 0.0) * 0.12;',
    '  float dist = length(vWorld - uCamPos);',
    '  float fog = smoothstep(uFogStart, uFogEnd, dist);',
    '  color = mix(color, uFogColor, fog);',
    '  fragColor = vec4(color, mix(0.74, 0.94, fres));',
    '}'
  ].join('\n');

  var SKY_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'uniform mat4 uInvViewProj;',
    'uniform vec3 uCamPos, uSunDir, uSunColor, uSkyTop, uSkyHorizon, uGroundCol;',
    'uniform float uTime, uNight;',
    'out vec4 fragColor;',
    AX.chunk.hash,
    'float vnoise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash12(i), b = hash12(i + vec2(1, 0));',
    '  float c = hash12(i + vec2(0, 1)), d = hash12(i + vec2(1, 1));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    'float clouds(vec2 p) {',
    '  float s = 0.0, amp = 0.5, freq = 1.0;',
    '  for (int i = 0; i < 4; i++) { s += vnoise(p * freq) * amp; amp *= 0.5; freq *= 2.07; }',
    '  return s;',
    '}',
    'void main() {',
    '  vec4 far = uInvViewProj * vec4(vUV * 2.0 - 1.0, 1.0, 1.0);',
    '  vec3 dir = normalize(far.xyz / far.w - uCamPos);',
    '  float h = max(dir.y, 0.0);',
    '  vec3 col = mix(uSkyHorizon, uSkyTop, pow(h, 0.58));',
    '  /* 별 — 밤에만, 격자 셀마다 하나씩 */',
    '  if (uNight > 0.01) {',
    '    vec2 sc = dir.xz / max(abs(dir.y), 0.08) * 3.0;',
    '    vec2 cell = floor(sc * 8.0);',
    '    vec2 rnd = hash22(cell);',
    '    float d = length(fract(sc * 8.0) - rnd);',
    '    float star = smoothstep(0.09, 0.0, d) * step(0.82, hash12(cell + 3.7));',
    '    float tw = 0.65 + 0.35 * sin(uTime * 2.3 + hash12(cell) * 40.0);',
    '    col += vec3(0.85, 0.9, 1.0) * star * tw * uNight * smoothstep(0.0, 0.25, dir.y);',
    '  }',
    '  /* 태양(또는 달) */',
    '  float sd = max(dot(dir, uSunDir), 0.0);',
    '  col += uSunColor * pow(sd, 1400.0) * 26.0;',
    '  col += uSunColor * pow(sd, 14.0) * 0.34;',
    '  col += uSunColor * pow(sd, 2.6) * 0.09;',
    '  /* 구름 — 시선을 하늘 평면에 투영해서 흐르게 합니다. */',
    '  if (dir.y > 0.005) {',

    '    float c = clouds(cp);',
    '    float cover = smoothstep(0.52, 0.78, c) * smoothstep(0.0, 0.22, dir.y);',
    '    vec3 lit = mix(uSkyHorizon * 1.1, uSunColor * 0.55 + vec3(0.7), 0.55);',

    '  col = mix(uGroundCol * 0.5, col, smoothstep(-0.16, 0.015, dir.y));',
    '  fragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* 조준한 블록 테두리 */
  var LINE_VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'uniform mat4 uViewProj;',
    'uniform vec3 uOffset;',
    'void main() { gl_Position = uViewProj * vec4(aPos + uOffset, 1.0); }'

  var LINE_FS = [
    '#version 300 es',
    'precision mediump float;',
    'uniform vec3 uColor;',
    'out vec4 fragColor;',
    'void main() { fragColor = vec4(uColor, 1.0); }'
  ].join('\n');

  /* 손에 든 블록 */
  var ITEM_VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNormal;',
    'layout(location=2) in vec3 aUVW;',
    'uniform mat4 uMVP;',
    'out vec3 vNormal;',
    'out vec3 vUVW;',
    'void main() { vNormal = aNormal; vUVW = aUVW; gl_Position = uMVP * vec4(aPos, 1.0); }'

  var ITEM_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DArray;',
    'in vec3 vNormal;',
    'in vec3 vUVW;',
    'uniform sampler2DArray uAtlas;',
    'uniform vec3 uSunColor, uAmbient;',
    'uniform float uEmissive;',
    'out vec4 fragColor;',

    '  fragColor = vec4(c, 1.0);',
    '}'

  /* ══════════════════════════════════════════════════════════
     플레이어
     ══════════════════════════════════════════════════════════ */

  var player = {
    pos: AX.vec3.create(8, 60, 8),      // 발 위치
    vel: AX.vec3.create(0, 0, 0),
    onGround: false,
    fly: false,
    inWater: false,
    width: 0.62,
    height: 1.8,
    eye: 1.62,
    bob: 0,
    swing: 0
  };

  var WALK = 4.6, RUN = 7.4, FLY_SPEED = 13, JUMP = 8.9, GRAVITY = -26;

  function blockedAt(x, y, z) {
    var minX = Math.floor(x - player.width / 2), maxX = Math.floor(x + player.width / 2);
    var minY = Math.floor(y), maxY = Math.floor(y + player.height - 0.001);
    var minZ = Math.floor(z - player.width / 2), maxZ = Math.floor(z + player.width / 2);
    for (var by = minY; by <= maxY; by++) {
      for (var bz = minZ; bz <= maxZ; bz++) {
        for (var bx = minX; bx <= maxX; bx++) {
          if (world.isSolid(bx, by, bz)) return true;
        }
      }
    }
    return false;
  }

  /* 축마다 따로 밀어 넣고, 막히면 되돌립니다. 벽을 타고 미끄러지게 됩니다. */
  function moveAxis(axis, delta) {
    if (delta === 0) return false;
    var p = player.pos;
    var old = p[axis];
    p[axis] += delta;
    if (blockedAt(p[0], p[1], p[2])) {
      p[axis] = old;
      return true;
    }
    return false;
  }

  function updatePlayer(dt) {
    var cam = renderer.camera;
    var speed = player.fly ? FLY_SPEED
              : (AX.Input.down('ShiftLeft') || AX.Input.down('ShiftRight') ? RUN : WALK);

    /* 카메라의 수평 전방·우측 벡터 */
    var fx = Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    var rx = Math.cos(cam.yaw), rz = Math.sin(cam.yaw);

    var ix = 0, iz = 0;
    if (AX.Input.down('KeyW')) iz += 1;
    if (AX.Input.down('KeyS')) iz -= 1;
    if (AX.Input.down('KeyD')) ix += 1;
    if (AX.Input.down('KeyA')) ix -= 1;
    var len = Math.hypot(ix, iz);
    if (len > 0) { ix /= len; iz /= len; }

    var wishX = fx * iz + rx * ix;
    var wishZ = fz * iz + rz * ix;

    player.inWater = world.getBlock(Math.floor(player.pos[0]),
                                    Math.floor(player.pos[1] + 0.4),
                                    Math.floor(player.pos[2])) === WATER;

    if (player.fly) {
      player.vel[0] = wishX * speed;
      player.vel[2] = wishZ * speed;
      var vy = 0;
      if (AX.Input.down('Space')) vy += 1;
      if (AX.Input.down('ControlLeft') || AX.Input.down('KeyC')) vy -= 1;
      player.vel[1] = vy * speed * 0.8;
    } else {
      var accel = player.onGround ? 42 : 12;
      var mul = player.inWater ? 0.6 : 1;
      player.vel[0] += (wishX * speed * mul - player.vel[0]) * Math.min(1, accel * dt);
      player.vel[2] += (wishZ * speed * mul - player.vel[2]) * Math.min(1, accel * dt);

      if (player.inWater) {
        player.vel[1] += GRAVITY * 0.22 * dt;
        player.vel[1] = Math.max(player.vel[1], -3.2);
        if (AX.Input.down('Space')) player.vel[1] = 4.4;
      } else {
        player.vel[1] += GRAVITY * dt;
        if (AX.Input.down('Space') && player.onGround) {
          player.vel[1] = JUMP;
          player.onGround = false;
        }
      }
      player.vel[1] = Math.max(player.vel[1], -48);
    }

    /* Y → X → Z 순서로 밀어 봅니다. */
    var hitY = moveAxis(1, player.vel[1] * dt);
    if (hitY) {
      if (player.vel[1] < 0) player.onGround = true;
      player.vel[1] = 0;
    } else if (!player.fly) {
      player.onGround = false;
    }

    var beforeX = player.pos[0];
    var hitX = moveAxis(0, player.vel[0] * dt);
    if (hitX && player.onGround && !player.fly) {
      /* 한 칸 턱은 자동으로 올라갑니다. */
      player.pos[1] += 1.02;
      if (!blockedAt(player.pos[0] + player.vel[0] * dt, player.pos[1], player.pos[2])) {
        player.pos[0] += player.vel[0] * dt;
      } else {
        player.pos[1] -= 1.02;
        player.vel[0] = 0;
      }
      if (player.pos[0] === beforeX) player.vel[0] = 0;
    }

    var beforeZ = player.pos[2];
    var hitZ = moveAxis(2, player.vel[2] * dt);
    if (hitZ && player.onGround && !player.fly) {
      player.pos[1] += 1.02;
      if (!blockedAt(player.pos[0], player.pos[1], player.pos[2] + player.vel[2] * dt)) {
        player.pos[2] += player.vel[2] * dt;
      } else {
        player.pos[1] -= 1.02;
        player.vel[2] = 0;
      }
      if (player.pos[2] === beforeZ) player.vel[2] = 0;
    }

    /* 세계 밖으로 떨어지면 다시 올려 둡니다. */
    if (player.pos[1] < -12) {
      player.pos[1] = CY + 4;
      player.vel[1] = 0;
    }

    /* 걸을 때 카메라가 살짝 위아래로 흔들립니다. */
    var hspeed = Math.hypot(player.vel[0], player.vel[2]);
    if (player.onGround && hspeed > 0.5 && !AX.reduceMotion) {
      player.bob += dt * hspeed * 1.7;
    } else {
      player.bob += (0 - (player.bob % (Math.PI * 2))) * Math.min(1, dt * 6);
    }
    if (player.swing > 0) player.swing = Math.max(0, player.swing - dt * 3.6);
  }

  /* ══════════════════════════════════════════════════════════
     레이캐스트 (Amanatides & Woo)
     ══════════════════════════════════════════════════════════ */

  function raycast(origin, dir, maxDist) {
    var x = Math.floor(origin[0]), y = Math.floor(origin[1]), z = Math.floor(origin[2]);
    var stepX = dir[0] > 0 ? 1 : -1, stepY = dir[1] > 0 ? 1 : -1, stepZ = dir[2] > 0 ? 1 : -1;
    var tDeltaX = Math.abs(1 / (dir[0] || 1e-9));
    var tDeltaY = Math.abs(1 / (dir[1] || 1e-9));
    var tDeltaZ = Math.abs(1 / (dir[2] || 1e-9));
    var tMaxX = ((dir[0] > 0 ? x + 1 - origin[0] : origin[0] - x) || 1e-9) * tDeltaX;
    var tMaxY = ((dir[1] > 0 ? y + 1 - origin[1] : origin[1] - y) || 1e-9) * tDeltaY;
    var tMaxZ = ((dir[2] > 0 ? z + 1 - origin[2] : origin[2] - z) || 1e-9) * tDeltaZ;
    var nx = 0, ny = 0, nz = 0;
    var t = 0;

    while (t <= maxDist) {
      var b = world.getBlock(x, y, z);
      if (b !== AIR && BLOCKS[b].solid) {
        return { x: x, y: y, z: z, nx: nx, ny: ny, nz: nz, block: b };
      }
      if (tMaxX < tMaxY && tMaxX < tMaxZ) {
        x += stepX; t = tMaxX; tMaxX += tDeltaX; nx = -stepX; ny = 0; nz = 0;
      } else if (tMaxY < tMaxZ) {
        y += stepY; t = tMaxY; tMaxY += tDeltaY; nx = 0; ny = -stepY; nz = 0;
      } else {
        z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; nx = 0; ny = 0; nz = -stepZ;
      }
    }
    return null;
  }

  /* ══════════════════════════════════════════════════════════
     시간대 — 하루 4분
     ══════════════════════════════════════════════════════════ */

  var sky = {
    dayLength: 240,
    time: 0.17 * 240,          // 아침에서 시작합니다
    sunDir: AX.vec3.create(0, 1, 0),
    sunColor: AX.vec3.create(1, 1, 1),
    skyTop: AX.vec3.create(0, 0, 0),
    skyHorizon: AX.vec3.create(0, 0, 0),
    ground: AX.vec3.create(0, 0, 0),
    fog: AX.vec3.create(0, 0, 0),
    night: 0,
    label: ''
  };

  var PAL = {
    day:   { top: [0.09, 0.26, 0.72], hor: [0.52, 0.68, 0.92], sun: [1.5, 1.38, 1.15], gnd: [0.22, 0.24, 0.22] },
    gold:  { top: [0.14, 0.20, 0.52], hor: [1.05, 0.52, 0.24], sun: [1.55, 0.82, 0.42], gnd: [0.20, 0.15, 0.13] },
    night: { top: [0.011, 0.02, 0.06], hor: [0.05, 0.08, 0.18], sun: [0.16, 0.20, 0.34], gnd: [0.03, 0.04, 0.07] }
  };

  function lerp3(out, a, b, t) {
    out[0] = a[0] + (b[0] - a[0]) * t;
    out[1] = a[1] + (b[1] - a[1]) * t;
    out[2] = a[2] + (b[2] - a[2]) * t;
    return out;
  }

  function updateSky(dt) {
    sky.time = (sky.time + dt) % sky.dayLength;
    var t = sky.time / sky.dayLength;
    var a = t * Math.PI * 2;
    AX.vec3.normalize(sky.sunDir, AX.vec3.set(sky.sunDir,
      Math.cos(a) * 0.34, Math.sin(a), Math.cos(a) * 0.86));

    var elev = sky.sunDir[1];
    var goldMix = 1 - AX.smoothstep(0.06, 0.34, elev);      // 낮 ↔ 노을
    var nightMix = 1 - AX.smoothstep(-0.16, 0.045, elev);   // 노을 ↔ 밤

    var top = lerp3([0, 0, 0], PAL.day.top, PAL.gold.top, goldMix);
    var hor = lerp3([0, 0, 0], PAL.day.hor, PAL.gold.hor, goldMix);
    var sun = lerp3([0, 0, 0], PAL.day.sun, PAL.gold.sun, goldMix);
    var gnd = lerp3([0, 0, 0], PAL.day.gnd, PAL.gold.gnd, goldMix);

    lerp3(sky.skyTop, top, PAL.night.top, nightMix);
    lerp3(sky.skyHorizon, hor, PAL.night.hor, nightMix);
    lerp3(sky.sunColor, sun, PAL.night.sun, nightMix);
    lerp3(sky.ground, gnd, PAL.night.gnd, nightMix);
    lerp3(sky.fog, sky.skyHorizon, sky.skyTop, 0.22);
    sky.night = nightMix;

    /* 밤에는 달을 반대편에 띄웁니다. */
    if (elev < -0.02) {
      AX.vec3.set(sky.sunDir, -sky.sunDir[0], -sky.sunDir[1], -sky.sunDir[2]);
    }

    var hour = ((t * 24) + 6) % 24;
    sky.label = String(Math.floor(hour)).padStart(2, '0') + ':' +
                String(Math.floor((hour % 1) * 60)).padStart(2, '0');
  }

  /* ══════════════════════════════════════════════════════════
     렌더러
     ══════════════════════════════════════════════════════════ */

  var renderer = {
    gl: null,
    camera: new AX.Camera(),
    frustum: new AX.Frustum(),
    shaders: {},
    atlas: null,
    shadow: null,
    post: null,
    particles: null,
    lineMesh: null,
    itemMesh: null,
    itemBlock: -1,
    fullscreen: null,
    tmpMat: AX.mat4.create(),
    tmpMat2: AX.mat4.create(),
    tmpVec: AX.vec3.create(),
    shadowCenter: AX.vec3.create()
  };

  function initRenderer(canvas) {
    var gl = renderer.gl = AX.GL.create(canvas);

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.clearColor(0.02, 0.03, 0.06, 1);

    renderer.shaders.voxel = new AX.Shader(gl, VOXEL_VS, VOXEL_FS, 'voxel');
    renderer.shaders.water = new AX.Shader(gl, VOXEL_VS, WATER_FS, 'water');
    renderer.shaders.depth = new AX.Shader(gl, DEPTH_VS, DEPTH_FS, 'depth');
    renderer.shaders.sky = new AX.Shader(gl, AX.chunk.fullscreenVS, SKY_FS, 'sky');
    renderer.shaders.line = new AX.Shader(gl, LINE_VS, LINE_FS, 'line');
    renderer.shaders.item = new AX.Shader(gl, ITEM_VS, ITEM_FS, 'item');

    renderer.atlas = AX.tex.array(gl, 64, TEX_LAYERS, function (ctx, i, size) {
      if (TEX_DRAW[i]) TEX_DRAW[i](ctx, size);
      else { ctx.fillStyle = '#f0f'; ctx.fillRect(0, 0, size, size); }
    });

    renderer.shadow = new AX.ShadowMap(gl, AX.Quality.get().shadow);
    /* sampler2D와 sampler2DArray가 같은 유닛을 가리키면 안 되므로,
       그림자가 꺼져 있어도 유닛 1에 묶을 더미 텍스처를 둡니다. */
    renderer.dummyShadow = AX.tex.solid(gl, 255, 255, 255);
    renderer.post = new AX.Post(gl);
    renderer.post.effects.exposure = 1.06;
    renderer.post.effects.bloomStrength = 0.42;
    renderer.post.effects.bloomThreshold = 1.05;
    renderer.post.effects.vignette = 0.34;
    renderer.post.effects.grain = 0.022;
    renderer.post.effects.chroma = 0.0011;
    renderer.particles = new AX.Particles(gl, 400);
    renderer.fullscreen = AX.geom.fullscreen(gl);

    /* 조준 블록 테두리 — 살짝 부풀린 큐브의 12개 모서리 */
    var e = 0.502, c = 0.5;
    var pts = [];
    var corners = [
      [-e, -e, -e], [e, -e, -e], [e, e, -e], [-e, e, -e],
      [-e, -e, e], [e, -e, e], [e, e, e], [-e, e, e]
    ];
    var edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4],
                 [0, 4], [1, 5], [2, 6], [3, 7]];
    edges.forEach(function (ed) {
      pts.push(corners[ed[0]][0] + c, corners[ed[0]][1] + c, corners[ed[0]][2] + c);
      pts.push(corners[ed[1]][0] + c, corners[ed[1]][1] + c, corners[ed[1]][2] + c);
    });
    renderer.lineMesh = new AX.Mesh(gl, {
      mode: gl.LINES,
      buffers: [{ data: new Float32Array(pts), stride: 12, attrs: [{ loc: 0, size: 3, offset: 0 }] }],
      count: pts.length / 3
    });

    AX.Quality.onChange(function (q) {
      renderer.shadow.resize(q.shadow);
      renderer.post.dispose();
      renderer.post.width = renderer.post.height = 0;
      resize(true);
    });
  }

  /* 손에 든 블록 메시 — 면마다 다른 텍스처 레이어를 씁니다. */
  function buildItemMesh(blockId) {
    var gl = renderer.gl;
    if (renderer.itemMesh) renderer.itemMesh.dispose();
    var def = BLOCKS[blockId];
    var pos = [], nrm = [], uvw = [];
    for (var f = 0; f < 6; f++) {
      var F = FACES[f], layer = def.faces[f];
      for (var vi = 0; vi < 6; vi++) {
        var ci = [0, 1, 2, 0, 2, 3][vi];
        var du = CORNERS[ci][0], dv = CORNERS[ci][1];
        pos.push(F.o[0] + F.u[0] * du + F.v[0] * dv - 0.5,
                 F.o[1] + F.u[1] * du + F.v[1] * dv - 0.5,
                 F.o[2] + F.u[2] * du + F.v[2] * dv - 0.5);
        nrm.push(F.n[0], F.n[1], F.n[2]);
        uvw.push(du, 1 - dv, layer);
      }
    }
    var n = pos.length / 3;
    var data = new Float32Array(n * 9);
    for (var i = 0; i < n; i++) {
      data[i * 9] = pos[i * 3]; data[i * 9 + 1] = pos[i * 3 + 1]; data[i * 9 + 2] = pos[i * 3 + 2];
      data[i * 9 + 3] = nrm[i * 3]; data[i * 9 + 4] = nrm[i * 3 + 1]; data[i * 9 + 5] = nrm[i * 3 + 2];
      data[i * 9 + 6] = uvw[i * 3]; data[i * 9 + 7] = uvw[i * 3 + 1]; data[i * 9 + 8] = uvw[i * 3 + 2];
    }
    renderer.itemMesh = new AX.Mesh(gl, {
      buffers: [{ data: data, stride: 36,
                  attrs: [{ loc: 0, size: 3, offset: 0 },
                          { loc: 1, size: 3, offset: 12 },
                          { loc: 2, size: 3, offset: 24 }] }],
      count: n
    });
    renderer.itemBlock = blockId;
  }

  function resize(force) {
    var gl = renderer.gl;
    var changed = AX.GL.resize(gl);
    if (changed || force) {
      renderer.post.resize(gl.axCanvas.width, gl.axCanvas.height);
    }
    return changed;
  }

  /* ── 청크 스트리밍 ─────────────────────────── */

  var streamState = { cx: 999999, cz: 999999 };

  function updateStreaming(force) {
    var pcx = Math.floor(player.pos[0] / CX), pcz = Math.floor(player.pos[2] / CZ);
    if (!force && pcx === streamState.cx && pcz === streamState.cz) return;
    streamState.cx = pcx; streamState.cz = pcz;

    var r = AX.Quality.get().viewDist;
    var need = [];
    for (var dz = -r - 1; dz <= r + 1; dz++) {
      for (var dx = -r - 1; dx <= r + 1; dx++) {
        var d = Math.hypot(dx, dz);
        if (d > r + 1.2) continue;
        need.push([pcx + dx, pcz + dz, d]);
      }
    }
    need.sort(function (a, b) { return a[2] - b[2]; });
    need.forEach(function (n) { world.ensure(n[0], n[1]); });

    /* 멀어진 청크는 정리합니다. */
    var drop = [];
    world.chunks.forEach(function (c, k) {
      if (Math.hypot(c.cx - pcx, c.cz - pcz) > r + 3.5) drop.push(k);
    });
    drop.forEach(function (k) {
      var c = world.chunks.get(k);
      if (c.mesh) c.mesh.dispose();
      if (c.waterMesh) c.waterMesh.dispose();
      world.chunks.delete(k);
    });
    world.genQueue = world.genQueue.filter(function (c) { return world.chunks.has(world.key(c.cx, c.cz)); });
    world.meshQueue = world.meshQueue.filter(function (c) { return world.chunks.has(world.key(c.cx, c.cz)); });
  }

  /* 생성·메싱 큐를 주어진 시간 예산 안에서만 처리합니다. */
  function pump(budgetMs) {
    var t0 = performance.now();
    var gl = renderer.gl;
    var did = 0;

    while (world.genQueue.length && performance.now() - t0 < budgetMs) {
      var c = world.genQueue.shift();
      if (!c.generated) {
        c.generate();
        world.meshQueue.push(c);
        did++;
      }
    }

    /* 이웃이 전부 생성된 청크만 메시를 만듭니다 — 경계에 구멍이 생기지 않게. */
    var tries = 0;
    while (performance.now() - t0 < budgetMs && tries < world.meshQueue.length) {
      var m = world.meshQueue.shift();
      if (!m || !world.chunks.has(world.key(m.cx, m.cz))) { tries++; continue; }
      if (!m.generated || !world.neighborsReady(m)) {
        world.meshQueue.push(m);
        tries++;
        continue;
      }
      buildMesh(gl, m);
      did++;
      tries = 0;
    }
    return did;
  }

  function enqueueDirty() {
    world.chunks.forEach(function (c) {
      if (c.generated && c.dirty && world.meshQueue.indexOf(c) < 0) world.meshQueue.push(c);
    });
  }

  /* ── 렌더 패스 ─────────────────────────────── */

  var visibleChunks = [];

  function collectVisible() {
    visibleChunks.length = 0;
    var pcx = player.pos[0], pcz = player.pos[2];
    world.chunks.forEach(function (c) {
      if (!c.mesh && !c.waterMesh) return;
      var x0 = c.cx * CX, z0 = c.cz * CZ;
      if (!renderer.frustum.boxVisible(x0, 0, z0, x0 + CX, c.maxY + 1, z0 + CZ)) return;
      c._dist = (x0 + CX / 2 - pcx) * (x0 + CX / 2 - pcx) + (z0 + CZ / 2 - pcz) * (z0 + CZ / 2 - pcz);
      visibleChunks.push(c);
    });
    visibleChunks.sort(function (a, b) { return a._dist - b._dist; });
  }

  function renderShadowPass() {
    var sm = renderer.shadow;
    if (!sm.enabled) return null;
    var gl = renderer.gl;
    var cam = renderer.camera;

    /* 그림자 상자는 카메라 앞쪽을 덮게 살짝 밀어 둡니다. */
    AX.vec3.scaleAndAdd(renderer.shadowCenter, player.pos, cam.forward, 22);
    renderer.shadowCenter[1] = player.pos[1] + 6;

    var vp = sm.begin(sky.sunDir, renderer.shadowCenter, 46);
    var sh = renderer.shaders.depth.use();
    sh.set('uViewProj', vp);
    for (var i = 0; i < visibleChunks.length; i++) {
      var c = visibleChunks[i];
      if (!c.mesh || c._dist > 90 * 90) continue;
      sh.set('uChunkOrigin', c.origin);
      c.mesh.draw();
    }
    sm.end();
    return vp;
  }

  function renderScene(dt) {
    var gl = renderer.gl;
    var cam = renderer.camera;
    var q = AX.Quality.get();
    var fogEnd = q.viewDist * CX - 10;
    var fogStart = fogEnd * 0.5;

    /* 1) 하늘 — 깊이 기록 없이 배경으로 깝니다. */
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    AX.mat4.invert(renderer.tmpMat, cam.viewProj);
    renderer.shaders.sky.use()
      .set('uInvViewProj', renderer.tmpMat)
      .set('uCamPos', cam.position)
      .set('uSunDir', sky.sunDir)
      .set('uSunColor', sky.sunColor)
      .set('uSkyTop', sky.skyTop)
      .set('uSkyHorizon', sky.skyHorizon)
      .set('uGroundCol', sky.ground)
      .set('uTime', sky.time)
      .set('uNight', sky.night);
    renderer.fullscreen.draw();
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);

    /* 2) 불투명 지형 */
    var voxel = renderer.shaders.voxel.use();
    voxel.set('uViewProj', cam.viewProj)
      .set('uLightViewProj', renderer.shadow.lightViewProj)
      .set('uSunDir', sky.sunDir)
      .set('uSunColor', sky.sunColor)
      .set('uSkyTop', sky.skyTop)
      .set('uSkyHorizon', sky.skyHorizon)
      .set('uGroundCol', sky.ground)
      .set('uFogColor', sky.fog)
      .set('uCamPos', cam.position)
      .set('uFogStart', fogStart)
      .set('uFogEnd', fogEnd)
      .set('uShadowOn', renderer.shadow.enabled ? 1 : 0)
      .set('uShadowTexel', 1 / (renderer.shadow.size || 1));
    voxel.tex('uAtlas', renderer.atlas, 0, gl.TEXTURE_2D_ARRAY);
    voxel.tex('uShadow', renderer.shadow.enabled ? renderer.shadow.rt.depth : renderer.dummyShadow, 1);

    for (var i = 0; i < visibleChunks.length; i++) {
      var c = visibleChunks[i];
      if (!c.mesh) continue;
      voxel.set('uChunkOrigin', c.origin);
      c.mesh.draw();
    }

    /* 3) 조준 중인 블록 테두리 */
    if (aimed) {
      var line = renderer.shaders.line.use();
      line.set('uViewProj', cam.viewProj)
        .set('uOffset', AX.vec3.set(renderer.tmpVec, aimed.x, aimed.y, aimed.z))
        .set('uColor', [0.06, 0.06, 0.08]);
      renderer.lineMesh.draw();
    }

    /* 4) 파티클 */
    renderer.particles.draw(cam.viewProj, cam.right, cam.up);

    /* 5) 물 — 뒤에서 앞으로 그립니다. */
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    var water = renderer.shaders.water.use();
    water.set('uViewProj', cam.viewProj)
      .set('uSunDir', sky.sunDir)
      .set('uSunColor', sky.sunColor)
      .set('uSkyTop', sky.skyTop)
      .set('uSkyHorizon', sky.skyHorizon)
      .set('uFogColor', sky.fog)
      .set('uCamPos', cam.position)
      .set('uFogStart', fogStart)
      .set('uFogEnd', fogEnd)
      .set('uTime', sky.time);
    water.tex('uAtlas', renderer.atlas, 0, gl.TEXTURE_2D_ARRAY);
    for (var j = visibleChunks.length - 1; j >= 0; j--) {
      var wc = visibleChunks[j];
      if (!wc.waterMesh) continue;
      water.set('uChunkOrigin', wc.origin);
      wc.waterMesh.draw();
    }
    gl.enable(gl.CULL_FACE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    /* 6) 손에 든 블록 — 깊이를 비우고 앞쪽에 따로 그립니다. */
    renderHeldBlock();
  }

  function renderHeldBlock() {
    var gl = renderer.gl;
    var blockId = HOTBAR[hotbarIndex];
    if (renderer.itemBlock !== blockId) buildItemMesh(blockId);

    gl.clear(gl.DEPTH_BUFFER_BIT);

    var aspect = gl.axCanvas.width / gl.axCanvas.height;
    var proj = AX.mat4.perspective(renderer.tmpMat, 62 * Math.PI / 180, aspect, 0.02, 6);
    var model = AX.mat4.identity(renderer.tmpMat2);

    var bobX = Math.sin(player.bob) * 0.022;
    var bobY = Math.abs(Math.cos(player.bob)) * 0.018;
    var swing = player.swing;

    AX.mat4.translate(model, model, [0.62 + bobX - swing * 0.1,
                                     -0.52 + bobY - swing * 0.18,
                                     -1.05 + swing * 0.12]);
    AX.mat4.rotateY(model, model, -0.62 + swing * 0.5);
    AX.mat4.rotateX(model, model, 0.16 - swing * 0.8);
    AX.mat4.rotateZ(model, model, 0.12);
    AX.mat4.scale(model, model, [0.42, 0.42, 0.42]);

    var mvp = AX.mat4.multiply(AX.mat4.create(), proj, model);
    var item = renderer.shaders.item.use();
    item.set('uMVP', mvp);
    item.tex('uAtlas', renderer.atlas, 0, gl.TEXTURE_2D_ARRAY);
    item.set('uSunColor', sky.sunColor);
    item.set('uAmbient', [sky.skyHorizon[0] * 0.6 + 0.16,
                          sky.skyHorizon[1] * 0.6 + 0.16,
                          sky.skyHorizon[2] * 0.6 + 0.18]);
    item.set('uEmissive', BLOCKS[blockId].emissive ? 1 : 0);
    renderer.itemMesh.draw();
  }

  /* ══════════════════════════════════════════════════════════
     상호작용
     ══════════════════════════════════════════════════════════ */

  var aimed = null;
  var hotbarIndex = 0;
  var breakCooldown = 0, placeCooldown = 0;
  var stats = { broken: 0, placed: 0 };

  function blockParticles(x, y, z, blockId) {
    var def = BLOCKS[blockId];
    var col = BLOCK_COLORS[blockId] || [0.6, 0.6, 0.6];
    for (var i = 0; i < 14; i++) {
      renderer.particles.spawn({
        x: x + 0.15 + Math.random() * 0.7,
        y: y + 0.15 + Math.random() * 0.7,
        z: z + 0.15 + Math.random() * 0.7,
        vx: (Math.random() - 0.5) * 4.5,
        vy: 1.5 + Math.random() * 4,
        vz: (Math.random() - 0.5) * 4.5,
        size: 0.07 + Math.random() * 0.07,
        life: 0.6 + Math.random() * 0.5,
        r: col[0] * (0.8 + Math.random() * 0.4),
        g: col[1] * (0.8 + Math.random() * 0.4),
        b: col[2] * (0.8 + Math.random() * 0.4),
        gravity: -22,
        shrink: 1
      });
    }
    if (def.emissive) {
      for (var j = 0; j < 8; j++) {
        renderer.particles.spawn({
          x: x + 0.5, y: y + 0.5, z: z + 0.5,
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, vz: (Math.random() - 0.5) * 6,
          size: 0.12, life: 0.5, r: 0.3, g: 0.85, b: 1.0, gravity: -2, shrink: 1
        });
      }
    }
  }

  /* 파티클 색 — 텍스처 평균값을 미리 뽑아 둡니다. */
  var BLOCK_COLORS = {};
  function computeBlockColors() {
    var size = 32;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    for (var b = 1; b < BLOCKS.length; b++) {
      var def = BLOCKS[b];
      if (!def.faces) continue;
      ctx.clearRect(0, 0, size, size);
      TEX_DRAW[def.faces[4]](ctx, size);
      var d = ctx.getImageData(0, 0, size, size).data;
      var r = 0, g = 0, bl = 0;
      for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; bl += d[i + 2]; }
      var n = d.length / 4;
      /* 파티클 색도 선형 공간으로 맞춥니다. */
      BLOCK_COLORS[b] = [Math.pow(r / n / 255, 2.2), Math.pow(g / n / 255, 2.2), Math.pow(bl / n / 255, 2.2)];
    }
  }

  function interact(dt) {
    var cam = renderer.camera;
    breakCooldown -= dt;
    placeCooldown -= dt;

    var eye = AX.vec3.set(renderer.tmpVec, player.pos[0], player.pos[1] + player.eye, player.pos[2]);
    aimed = raycast(eye, cam.forward, 6.5);

    if (!AX.Input.locked) return;

    if (AX.Input.mouseDown(0) && aimed && breakCooldown <= 0) {
      var b = world.getBlock(aimed.x, aimed.y, aimed.z);
      if (world.setBlock(aimed.x, aimed.y, aimed.z, AIR)) {
        blockParticles(aimed.x, aimed.y, aimed.z, b);
        breakCooldown = 0.19;
        player.swing = 1;
        stats.broken++;
      }
    }

    if (AX.Input.mouseDown(2) && aimed && placeCooldown <= 0) {
      var px = aimed.x + aimed.nx, py = aimed.y + aimed.ny, pz = aimed.z + aimed.nz;
      var target = world.getBlock(px, py, pz);
      if (target === AIR || target === WATER) {
        /* 플레이어와 겹치는 자리에는 놓지 않습니다. */
        var minX = player.pos[0] - player.width / 2, maxX = player.pos[0] + player.width / 2;
        var minZ = player.pos[2] - player.width / 2, maxZ = player.pos[2] + player.width / 2;
        var overlap = (px + 1 > minX && px < maxX) &&
                      (pz + 1 > minZ && pz < maxZ) &&
                      (py + 1 > player.pos[1] && py < player.pos[1] + player.height);
        if (!overlap) {
          world.setBlock(px, py, pz, HOTBAR[hotbarIndex]);
          placeCooldown = 0.19;
          player.swing = 1;
          stats.placed++;
        }
      }
    }

    /* 핫바 */
    for (var i = 0; i < HOTBAR.length; i++) {
      if (AX.Input.justPressed('Digit' + (i + 1))) selectSlot(i);
    }
    if (AX.Input.mouse.wheel !== 0) {
      selectSlot((hotbarIndex + (AX.Input.mouse.wheel > 0 ? 1 : -1) + HOTBAR.length) % HOTBAR.length);
    }

    if (AX.Input.justPressed('KeyF')) {
      player.fly = !player.fly;
      player.vel[1] = 0;
      AX.UI.toast(player.fly ? '비행 켜짐' : '비행 꺼짐');
    }
    if (AX.Input.justPressed('KeyT')) {
      sky.time = (sky.time + 30) % sky.dayLength;
      AX.UI.toast('시간 이동 → ' + sky.label);
    }
  }

  /* ══════════════════════════════════════════════════════════
     HUD
     ══════════════════════════════════════════════════════════ */

  var hud = {};

  function buildHUD() {
    var root = AX.UI.hud;

    var edge = document.createElement('div');
    edge.className = 'edge';
    root.appendChild(edge);

    var cross = document.createElement('div');
    cross.className = 'cross';
    root.appendChild(cross);

    hud.readout = document.createElement('div');
    hud.readout.className = 'readout';
    hud.readout.innerHTML = '<span id="ro-pos"></span><span id="ro-biome"></span><span id="ro-chunks"></span>';
    root.appendChild(hud.readout);
    hud.pos = hud.readout.querySelector('#ro-pos');
    hud.biome = hud.readout.querySelector('#ro-biome');
    hud.chunks = hud.readout.querySelector('#ro-chunks');

    hud.slotName = document.createElement('div');
    hud.slotName.className = 'slot-name';
    root.appendChild(hud.slotName);

    hud.bar = document.createElement('div');
    hud.bar.className = 'hotbar';
    hud.slots = [];

    /* 슬롯 아이콘도 같은 절차 텍스처로 만듭니다. */
    var iconCanvas = document.createElement('canvas');
    iconCanvas.width = iconCanvas.height = 64;
    var ictx = iconCanvas.getContext('2d');

    HOTBAR.forEach(function (blockId, i) {
      var s = document.createElement('div');
      s.className = 'slot';
      s.dataset.key = String(i + 1);
      ictx.clearRect(0, 0, 64, 64);
      TEX_DRAW[BLOCKS[blockId].faces[4]](ictx, 64);
      s.style.backgroundImage = 'url(' + iconCanvas.toDataURL('image/png') + ')';
      hud.bar.appendChild(s);
      hud.slots.push(s);
    });
    root.appendChild(hud.bar);

    hud.time = document.createElement('div');
    hud.time.className = 'timebadge';
    hud.time.innerHTML = '<span class="sun-dot"></span><span id="ro-time">06:00</span>';
    root.appendChild(hud.time);
    hud.timeText = hud.time.querySelector('#ro-time');

    selectSlot(0);
  }

  var slotNameTimer = 0;
  function selectSlot(i) {
    hotbarIndex = i;
    hud.slots.forEach(function (s, j) {
      if (j === i) s.dataset.on = '1'; else delete s.dataset.on;
    });
    hud.slotName.textContent = BLOCKS[HOTBAR[i]].name;
    hud.slotName.dataset.show = '1';
    clearTimeout(slotNameTimer);
    slotNameTimer = setTimeout(function () { delete hud.slotName.dataset.show; }, 1300);
  }

  var hudTick = 0;
  function updateHUD(dt) {
    hudTick += dt;
    if (hudTick < 0.12) return;
    hudTick = 0;
    var p = player.pos;
    hud.pos.innerHTML = 'XYZ <b>' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + p[2].toFixed(1) + '</b>';
    var biome = ['한대', '온대', '사막'][biomeAt(Math.floor(p[0]), Math.floor(p[2]))];
    hud.biome.innerHTML = '바이옴 <b>' + biome + '</b>' + (player.fly ? ' · 비행' : '');
    hud.chunks.innerHTML = '청크 <b>' + world.chunks.size + '</b> · 대기 ' +
                           (world.genQueue.length + world.meshQueue.length);
    hud.timeText.textContent = sky.label;
    AX.UI.fps(loop.frameMs);
  }

  /* ══════════════════════════════════════════════════════════
     부팅
     ══════════════════════════════════════════════════════════ */

  var loop = null;
  var started = false;

  /* 지형 생성과 같은 시드 규칙으로 근처에 나무가 심길지 미리 확인합니다. */
  function treeNear(x, z, r) {
    for (var dz = -r; dz <= r; dz++) {
      for (var dx = -r; dx <= r; dx++) {
        AX.noise.setSeed(TERRAIN_SEED + 99);
        if (AX.noise.hash2(x + dx, z + dz) <= 0.0135) return true;
      }
    }
    return false;
  }

  function findSpawn() {
    /* 온대 저지대 — 잔디가 보이는 곳에서 시작합니다. */
    for (var r = 0; r < 60; r++) {
      for (var a = 0; a < 10; a++) {
        var x = Math.round(Math.cos(a * 0.63) * r * 4) + 8;
        var z = Math.round(Math.sin(a * 0.63) * r * 4) + 8;
        var h = terrainHeight(x, z);
        if (h > SEA + 2 && h < 40 && biomeAt(x, z) === 1 && !treeNear(x, z, 4)) {
          return [x + 0.5, h + 1.2, z + 0.5];
        }
      }
    }
    return [8.5, terrainHeight(8, 8) + 1.2, 8.5];
  }

  function boot() {
    var canvas = document.getElementById('gl');

    AX.UI.init({
      title: '블록 월드',
      en: 'Voxel World',
      tint: '#7bd45a',
      lede: '블록을 캐고 쌓아 지형을 바꾸는 오픈 월드입니다. 지형은 시드값으로 무한히 생성되고, 하루가 4분마다 한 바퀴 돕니다.',
      controls: [
        ['W A S D', '이동'],
        ['마우스', '시점 · 좌클릭 파괴 · 우클릭 설치'],
        ['Space', '점프 (수영 중에는 상승)'],
        ['Shift', '달리기'],
        ['1 ~ 9', '블록 선택 (휠로도 바꿉니다)'],
        ['F', '비행 모드'],
        ['T', '시간 30초 넘기기'],
        ['Esc', '일시정지']
      ],
      startLabel: '월드 들어가기',
      onStart: function () {
        AX.Input.lock();
        loop.setPaused(false);
        started = true;
      },
      onPause: function () {
        AX.Input.unlock();
        loop.setPaused(true);
      },
      onResume: function () {
        AX.Input.lock();
        loop.setPaused(false);
      }
    });

    try {
      initRenderer(canvas);
    } catch (err) {
      AX.UI.error(err);
      return;
    }

    AX.Input.init(canvas, { pointerLock: true });
    AX.Input.onLockChange(function (locked) {
      AX.UI.setLocked(locked);
      /* 포인터 락이 풀리면(대개 Esc) 일시정지 화면을 띄웁니다. */
      if (!locked && started && AX.UI.current === null) AX.UI.showPause();
    });

    computeBlockColors();
    buildHUD();

    var spawn = findSpawn();
    AX.vec3.set(player.pos, spawn[0], spawn[1], spawn[2]);
    renderer.camera.yaw = 0.6;
    renderer.camera.pitch = -0.12;

    resize(true);
    updateStreaming(true);

    /* 시작 반경 안쪽을 먼저 만들어 두고 들어갑니다. */
    var startTotal = world.genQueue.length;
    (function preload() {
      pump(14);
      enqueueDirty();
      var left = world.genQueue.length + world.meshQueue.length;
      var done = Math.max(0, startTotal * 2 - left);
      AX.UI.loading(Math.min(0.98, done / Math.max(1, startTotal * 2)),
                    '지형 생성 · 청크 ' + world.chunks.size);
      /* 플레이어 주변이 준비되면 시작 화면으로 넘어갑니다. */
      var here = world.get(Math.floor(player.pos[0] / CX), Math.floor(player.pos[2] / CZ));
      if (here && here.mesh !== null && !here.dirty && world.genQueue.length === 0) {
        /* 지면 위로 안전하게 올려 둡니다. */
        while (blockedAt(player.pos[0], player.pos[1], player.pos[2]) && player.pos[1] < CY) {
          player.pos[1] += 1;
        }
        AX.UI.loading(1, '준비 완료');
        /* ?autostart — 렌더 검증용. 시작 화면을 건너뜁니다. */
        if (/autostart/.test(location.search)) {
          setTimeout(function () { AX.UI.start(); }, 120);
        } else {
          setTimeout(function () { AX.UI.showStart(); }, 120);
        }
        return;
      }
      setTimeout(preload, 0);
    })();

    loop = new AX.Loop({
      step: 1 / 120,
      update: function (dt) {
        if (!started) return;
        updatePlayer(dt);
        renderer.particles.update(dt, function (x, y, z) {
          return world.isSolid(Math.floor(x), Math.floor(y), Math.floor(z));
        });
      },
      render: function (dt) {
        resize(false);
        var gl = renderer.gl;
        var cam = renderer.camera;

        if (started && AX.Input.locked) {
          cam.look(AX.Input.mouse.dx, AX.Input.mouse.dy);
        }

        updateSky(started ? dt : dt * 0.4);
        if (started) {
          interact(dt);
          updateStreaming(false);
        }
        pump(started ? 5 : 10);

        /* 카메라를 눈높이에 두고 걷기 흔들림을 더합니다. */
        var bobY = Math.sin(player.bob * 2) * 0.045;
        var bobX = Math.cos(player.bob) * 0.03;
        AX.vec3.set(cam.position,
          player.pos[0] + bobX * 0.35,
          player.pos[1] + player.eye + bobY,
          player.pos[2]);
        cam.far = Math.max(180, AX.Quality.get().viewDist * CX + 60);
        cam.update(gl.axCanvas.width / gl.axCanvas.height);
        renderer.frustum.fromMatrix(cam.viewProj);

        collectVisible();
        renderShadowPass();

        renderer.post.begin();
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        renderScene(dt);
        renderer.post.end(dt);

        updateHUD(dt);
      }
    });
    loop.setPaused(false);
    loop.start();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>

</body>
</html>
