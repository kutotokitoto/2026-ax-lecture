<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제로 프론트 — 요즘 오락실</title>
<meta name="description" content="궤도 정거장 1인칭 슈팅 — 요즘 오락실">
<link rel="stylesheet" href="../../lib/ax-ui.css">
<style>
  /* ── 제로 프론트 전용 HUD ───────────────── */

  /* 조준점 — 탄퍼짐에 따라 벌어집니다 */
  .cross {
    position: absolute;
    left: 50%; top: 50%;
    width: 4px; height: 4px;
    margin: -2px 0 0 -2px;
    opacity: .95;
    --gap: 6px;
  }
  .cross i {
    position: absolute;
    background: #d9faff;
    box-shadow: 0 0 4px rgba(0, 208, 255, .8);
    transition: none;
  }
  .cross i:nth-child(1) { left: 1px; top: calc(-6px - var(--gap)); width: 2px; height: 7px; }
  .cross i:nth-child(2) { left: 1px; bottom: calc(-6px - var(--gap)); width: 2px; height: 7px; }
  .cross i:nth-child(3) { top: 1px; left: calc(-6px - var(--gap)); height: 2px; width: 7px; }
  .cross i:nth-child(4) { top: 1px; right: calc(-6px - var(--gap)); height: 2px; width: 7px; }
  .cross .dot {
    position: absolute; left: 1px; top: 1px;
    width: 2px; height: 2px; border-radius: 50%;
  }
  body[data-ads="1"] .cross i { opacity: 0; }

  /* 히트마커 */
  .hitmark {
    position: absolute;
    left: 50%; top: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    opacity: 0;
    transform: rotate(45deg) scale(1.3);
  }
  .hitmark i {
    position: absolute;
    background: #fff;
    box-shadow: 0 0 5px rgba(255, 255, 255, .9);
  }
  .hitmark i:nth-child(1) { left: 12px; top: 0; width: 2px; height: 8px; }
  .hitmark i:nth-child(2) { left: 12px; bottom: 0; width: 2px; height: 8px; }
  .hitmark i:nth-child(3) { top: 12px; left: 0; height: 2px; width: 8px; }
  .hitmark i:nth-child(4) { top: 12px; right: 0; height: 2px; width: 8px; }
  .hitmark[data-hit="1"] { animation: hitpop .22s ease-out; }
  .hitmark[data-kill="1"] i { background: #ff4d6b; box-shadow: 0 0 6px rgba(255, 77, 107, .9); }
  @keyframes hitpop {
    0% { opacity: 1; transform: rotate(45deg) scale(1.45); }
    100% { opacity: 0; transform: rotate(45deg) scale(1.0); }
  }

  /* 좌하단 — 체력·실드 */
  .vitals {
    position: absolute;
    left: 22px; bottom: 24px;
    width: min(240px, 34vw);
    display: grid;
    gap: 7px;
  }
  .vbar {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .09);
    overflow: hidden;
  }
  .vbar span {
    display: block; height: 100%;
    border-radius: 999px;
    transition: width .18s ease;
  }
  .vbar.hp span { background: linear-gradient(90deg, #3ce8b0, #9ff5d6); box-shadow: 0 0 10px rgba(60, 232, 176, .5); }
  .vbar.hp[data-low="1"] span { background: linear-gradient(90deg, #ff4d6b, #ff9db0); box-shadow: 0 0 10px rgba(255, 77, 107, .6); }
  .vbar.sh span { background: linear-gradient(90deg, #00d0ff, #9fefff); box-shadow: 0 0 10px rgba(0, 208, 255, .5); }
  .vlabel {
    display: flex; justify-content: space-between;
    font-family: var(--ax-mono);
    font-size: 10px; letter-spacing: .12em;
    color: var(--ax-text-faint);
  }
  .vlabel b { color: var(--ax-text-soft); font-variant-numeric: tabular-nums; }

  /* 우하단 — 탄약 */
  .ammo {
    position: absolute;
    right: 22px; bottom: 20px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ammo .mag {
    font-family: var(--ax-mono);
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    color: #d9faff;
    text-shadow: 0 0 14px rgba(0, 208, 255, .45);
  }
  .ammo .mag[data-low="1"] { color: #ff9db0; text-shadow: 0 0 14px rgba(255, 77, 107, .5); }
  .ammo .reserve {
    font-family: var(--ax-mono);
    font-size: 12px;
    color: var(--ax-text-faint);
    letter-spacing: .1em;
  }
  .ammo .state {
    font-family: var(--ax-mono);
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--ax-amber);
    height: 14px;
  }

  /* 레이더 */
  .radar {
    position: absolute;
    right: 20px; top: 58px;
    width: 128px; height: 128px;
    border-radius: 50%;
    border: 1px solid var(--ax-stroke);
    background: rgba(5, 8, 16, .55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .radar canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }

  /* 웨이브 배너 */
  .wave-banner {
    position: absolute;
    left: 50%; top: 18%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  .wave-banner[data-show="1"] { animation: wave-in 2.6s ease forwards; }
  @keyframes wave-in {
    0% { opacity: 0; transform: translateX(-50%) translateY(14px); }
    12% { opacity: 1; transform: translateX(-50%) translateY(0); }
    82% { opacity: 1; }
    100% { opacity: 0; }
  }
  .wave-banner .big {
    font-size: clamp(30px, 5.5vw, 52px);
    font-weight: 800;
    letter-spacing: .06em;
    color: #d9faff;
    text-shadow: 0 0 26px rgba(0, 208, 255, .55);
  }
  .wave-banner .sub {
    font-family: var(--ax-mono);
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--ax-cyan);
  }

  /* 좌상단 — 웨이브·스코어 */
  .scorebox {
    position: absolute;
    left: 22px; top: 58px;
    display: grid;
    gap: 2px;
    font-family: var(--ax-mono);
    font-size: 11px;
    letter-spacing: .06em;
    color: rgba(255, 255, 255, .5);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
    font-variant-numeric: tabular-nums;
  }
  .scorebox b { color: rgba(255, 255, 255, .85); font-weight: 600; }
  .combo {
    color: var(--ax-amber);
    font-weight: 700;
    height: 15px;
  }

  /* 피격 비네트 */
  .dmg {
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 75% at 50% 50%, transparent 52%, rgba(255, 30, 60, .5));
    opacity: 0;
  }
  .edge {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 85% at 50% 50%, transparent 58%, rgba(0, 0, 0, .42));
  }

  @media (max-width: 640px) {
    .radar { width: 96px; height: 96px; }
    .ammo .mag { font-size: 32px; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<script src="../../lib/ax3d.js"></script>
<script src="../../lib/ax-audio.js"></script>
<script src="../../lib/ax-ui.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     맵 데이터 — 96 × 16 × 96 복셀 정거장
     ══════════════════════════════════════════════════════════ */

  var MW = 96, MH = 16, MD = 96;
  var SEC = 16;                     // 메시 섹션 한 변
  var map = new Uint8Array(MW * MH * MD);

  var AIR = 0, PANEL = 1, DECK = 2, CEIL = 3, GLASS = 4, LIGHT = 5,
      TRIM = 6, CRATE = 7, GRATE = 8, DARK = 9, WLIGHT = 10;

  var T_PANEL = 0, T_PANEL2 = 1, T_DECK = 2, T_CEIL = 3, T_GLASS = 4,
      T_LIGHT = 5, T_TRIM = 6, T_CRATE = 7, T_CRATE_TOP = 8, T_GRATE = 9,
      T_DARK = 10, T_WLIGHT = 11;
  var TEX_LAYERS = 12;

  var BLOCKS = [
    { solid: false, opaque: false },                                                          // AIR
    { solid: true, opaque: true, faces: [T_PANEL, T_PANEL, T_PANEL, T_PANEL, T_PANEL, T_PANEL] },
    { solid: true, opaque: true, faces: [T_DECK, T_DECK, T_DECK, T_DECK, T_DECK, T_DECK] },
    { solid: true, opaque: true, faces: [T_CEIL, T_CEIL, T_CEIL, T_CEIL, T_CEIL, T_CEIL] },
    { solid: true, opaque: false, glass: true, faces: [T_GLASS, T_GLASS, T_GLASS, T_GLASS, T_GLASS, T_GLASS] },
    { solid: true, opaque: true, emissive: 1, faces: [T_LIGHT, T_LIGHT, T_LIGHT, T_LIGHT, T_LIGHT, T_LIGHT] },
    { solid: true, opaque: true, faces: [T_TRIM, T_TRIM, T_TRIM, T_TRIM, T_TRIM, T_TRIM] },
    { solid: true, opaque: true, faces: [T_CRATE, T_CRATE, T_CRATE_TOP, T_CRATE_TOP, T_CRATE, T_CRATE] },
    { solid: true, opaque: true, faces: [T_GRATE, T_GRATE, T_GRATE, T_GRATE, T_GRATE, T_GRATE] },
    { solid: true, opaque: true, faces: [T_DARK, T_DARK, T_DARK, T_DARK, T_DARK, T_DARK] },
    { solid: true, opaque: true, emissive: 1, faces: [T_WLIGHT, T_WLIGHT, T_WLIGHT, T_WLIGHT, T_WLIGHT, T_WLIGHT] }
  ];

  function inMap(x, y, z) { return x >= 0 && x < MW && y >= 0 && y < MH && z >= 0 && z < MD; }
  function getBlock(x, y, z) {
    if (!inMap(x, y, z)) return AIR;
    return map[x + MW * (z + MD * y)];
  }
  function setBlockRaw(x, y, z, v) {
    if (!inMap(x, y, z)) return;
    map[x + MW * (z + MD * y)] = v;
  }
  function isSolid(x, y, z) { return BLOCKS[getBlock(x, y, z)].solid; }
  function isOpaque(x, y, z) {
    if (y < 0) return true;
    return BLOCKS[getBlock(x, y, z)].opaque;
  }

  /* ── 정거장 생성 ──────────────────────────── */

  var rooms = [
    { x0: 36, z0: 36, x1: 60, z1: 60, name: 'core' },     // 중앙
    { x0: 38, z0: 8,  x1: 58, z1: 26, name: 'north' },
    { x0: 38, z0: 70, x1: 58, z1: 88, name: 'south' },
    { x0: 8,  z0: 38, x1: 26, z1: 58, name: 'west' },
    { x0: 70, z0: 38, x1: 88, z1: 58, name: 'east' }
  ];
  var corridors = [
    { x0: 45, z0: 26, x1: 51, z1: 36 },     // 북
    { x0: 45, z0: 60, x1: 51, z1: 70 },     // 남
    { x0: 26, z0: 45, x1: 36, z1: 51 },     // 서
    { x0: 60, z0: 45, x1: 70, z1: 51 }      // 동
  ];
  var FLOOR_Y = 2;       // 바닥 표면 (이 위에 섭니다)
  var CEIL_Y = 11;       // 천장

  var pointLights = [];  // { pos: [x,y,z], color: [r,g,b] (강도 포함), room: i }
  var spawnPoints = [];  // 드론 등장 위치
  var navNodes = [];     // 경로 그래프
  var navEdges = [];

  function carveInterior(r) {
    for (var z = r.z0 + 1; z < r.z1; z++) {
      for (var x = r.x0 + 1; x < r.x1; x++) {
        for (var y = FLOOR_Y + 1; y < CEIL_Y; y++) setBlockRaw(x, y, z, AIR);
        setBlockRaw(x, FLOOR_Y, z, DECK);
        setBlockRaw(x, CEIL_Y, z, CEIL);
      }
    }
  }

  function generateStation() {
    var rng = AX.noise.rng(20260810);
    var all = rooms.concat(corridors);

    /* 1) 외곽 포함 통짜 덩어리를 깝니다 — 방·복도 영역만. */
    all.forEach(function (r) {
      for (var z = r.z0; z <= r.z1; z++) {
        for (var x = r.x0; x <= r.x1; x++) {
          for (var y = 0; y <= CEIL_Y + 1; y++) setBlockRaw(x, y, z, PANEL);
        }
      }
    });

    /* 2) 내부를 파냅니다. */
    all.forEach(carveInterior);

    /* 3) 방 치장 */
    rooms.forEach(function (r, ri) {
      var cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;

      /* 천장 조명 — 3×3 격자 위치에 2×2 패널 */
      for (var gz = r.z0 + 5; gz < r.z1 - 3; gz += 7) {
        for (var gx = r.x0 + 5; gx < r.x1 - 3; gx += 7) {
          setBlockRaw(gx, CEIL_Y, gz, LIGHT);
          setBlockRaw(gx + 1, CEIL_Y, gz, LIGHT);
          setBlockRaw(gx, CEIL_Y, gz + 1, LIGHT);
          setBlockRaw(gx + 1, CEIL_Y, gz + 1, LIGHT);
          pointLights.push({ pos: [gx + 1, CEIL_Y - 0.6, gz + 1],
                             color: [0.75, 0.92, 1.05], intensity: 30, room: ri });
        }
      }

      /* 외벽 창 — 바깥쪽 벽에만 유리 밴드를 냅니다. */
      var isOuter = { north: 'z0', south: 'z1', west: 'x0', east: 'x1' }[r.name];
      if (isOuter) {
        var axis = isOuter[0];                            // 'x' 또는 'z'
        var wall = r[isOuter];                            // 벽 좌표
        var lo = (axis === 'x' ? r.z0 : r.x0) + 3;
        var hi = (axis === 'x' ? r.z1 : r.x1) - 3;
        for (var w = lo; w <= hi; w++) {
          if ((w - lo) % 7 >= 5) continue;                // 창틀 기둥
          for (var wy = 5; wy <= 8; wy++) {
            if (axis === 'x') setBlockRaw(wall, wy, w, GLASS);
            else setBlockRaw(w, wy, wall, GLASS);
          }
        }
      }

      /* 화물 상자 */
      var crateN = 5 + Math.floor(rng() * 4);
      for (var ci = 0; ci < crateN; ci++) {
        var px = r.x0 + 3 + Math.floor(rng() * (r.x1 - r.x0 - 5));
        var pz = r.z0 + 3 + Math.floor(rng() * (r.z1 - r.z0 - 5));
        /* 중앙 스폰 근처는 비웁니다. */
        if (ri === 0 && Math.hypot(px - cx, pz - cz) < 5) continue;
        var stack = rng() < 0.4 ? 2 : 1;
        for (var s = 0; s < stack; s++) setBlockRaw(px, FLOOR_Y + 1 + s, pz, CRATE);
        if (rng() < 0.5) setBlockRaw(px + 1, FLOOR_Y + 1, pz, CRATE);
      }

      /* 기둥 — 큰 방 모서리 안쪽 */
      if (r.x1 - r.x0 > 18) {
        [[r.x0 + 5, r.z0 + 5], [r.x1 - 5, r.z0 + 5], [r.x0 + 5, r.z1 - 5], [r.x1 - 5, r.z1 - 5]]
          .forEach(function (p) {
            for (var py = FLOOR_Y + 1; py < CEIL_Y; py++) {
              setBlockRaw(p[0], py, p[1], py === 8 ? WLIGHT : DARK);
            }
          });
      }

      /* 스폰 벤트 — 방 네 구석 천장 */
      [[r.x0 + 3, r.z0 + 3], [r.x1 - 3, r.z0 + 3], [r.x0 + 3, r.z1 - 3], [r.x1 - 3, r.z1 - 3]]
        .forEach(function (p) {
          setBlockRaw(p[0], CEIL_Y, p[1], GRATE);
          spawnPoints.push({ x: p[0] + 0.5, y: CEIL_Y - 1.2, z: p[1] + 0.5, room: ri });
        });

      navNodes.push({ x: cx, z: cz, room: ri });
    });

    /* 4) 복도 치장 */
    corridors.forEach(function (c, ci) {
      var cx = (c.x0 + c.x1) / 2, cz = (c.z0 + c.z1) / 2;
      var horizontal = (c.x1 - c.x0) > (c.z1 - c.z0);

      /* 중앙 바닥 그레이트 + 벽 스트립 라이트 */
      for (var z = c.z0 + 1; z < c.z1; z++) {
        for (var x = c.x0 + 1; x < c.x1; x++) {
          var mid = horizontal ? (z === Math.floor(cz)) : (x === Math.floor(cx));
          if (mid) setBlockRaw(x, FLOOR_Y, z, GRATE);
        }
      }
      var step = 3;
      if (horizontal) {
        for (var lx = c.x0 + 2; lx < c.x1 - 1; lx += step) {
          setBlockRaw(lx, 8, c.z0, WLIGHT);
          setBlockRaw(lx, 8, c.z1, WLIGHT);
        }
      } else {
        for (var lz = c.z0 + 2; lz < c.z1 - 1; lz += step) {
          setBlockRaw(c.x0, 8, lz, WLIGHT);
          setBlockRaw(c.x1, 8, lz, WLIGHT);
        }
      }
      pointLights.push({ pos: [cx, 8.4, cz], color: [0.45, 0.85, 1.0], intensity: 16, room: -1 });

      /* 문틀 하자드 트림 */
      var doors = horizontal
        ? [[c.x0, cz], [c.x1, cz]]
        : [[cx, c.z0], [cx, c.z1]];
      doors.forEach(function (d) {
        for (var dy = FLOOR_Y + 1; dy <= FLOOR_Y + 1; dy++) {
          if (horizontal) {
            setBlockRaw(d[0], dy, c.z0 + 1, TRIM);
            setBlockRaw(d[0], dy, c.z1 - 1, TRIM);
          } else {
            setBlockRaw(c.x0 + 1, dy, d[1], TRIM);
            setBlockRaw(c.x1 - 1, dy, d[1], TRIM);
          }
        }
      });

      navNodes.push({ x: cx, z: cz, room: 5 + ci });
    });

    /* 5) 경로 그래프 — 중앙(0) ↔ 복도(5..8) ↔ 방(1..4) */
    navEdges = [[0, 5], [5, 1], [0, 6], [6, 2], [0, 7], [7, 3], [0, 8], [8, 4]];
  }

  function nearestNode(x, z) {
    var best = 0, bd = 1e9;
    for (var i = 0; i < navNodes.length; i++) {
      var d = (navNodes[i].x - x) * (navNodes[i].x - x) + (navNodes[i].z - z) * (navNodes[i].z - z);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  /* BFS — from에서 to로 가는 다음 노드를 돌려줍니다. */
  function nextNode(from, to) {
    if (from === to) return to;
    var prev = {}, queue = [from], seen = {};
    seen[from] = true;
    while (queue.length) {
      var n = queue.shift();
      for (var i = 0; i < navEdges.length; i++) {
        var e = navEdges[i];
        var other = e[0] === n ? e[1] : (e[1] === n ? e[0] : -1);
        if (other < 0 || seen[other]) continue;
        seen[other] = true;
        prev[other] = n;
        if (other === to) {
          var cur = to;
          while (prev[cur] !== undefined && prev[cur] !== from) cur = prev[cur];
          return cur;
        }
        queue.push(other);
      }
    }
    return to;
  }

  /* ══════════════════════════════════════════════════════════
     절차 텍스처
     ══════════════════════════════════════════════════════════ */

  function paint(ctx, size, fn) {
    var img = ctx.createImageData(size, size), d = img.data;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var c = fn(x, y, size);
        var i = (y * size + x) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
        d[i + 3] = c.length > 3 ? c[3] : 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  function mixc(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

  var TEX_DRAW = [];

  /* 벽 패널 — 브러시드 메탈 + 패널 이음매 */
  TEX_DRAW[T_PANEL] = function (ctx, size) {
    AX.noise.setSeed(41);
    paint(ctx, size, function (x, y) {
      var brush = AX.noise.fbm2(x * 0.7, y * 0.04, 2);
      var c = mixc([64, 72, 88], [86, 96, 114], brush);
      var seam = (x % 32 < 1.6) || (y % 32 < 1.6);
      if (seam) c = mixc(c, [30, 34, 46], 0.75);
      var edge = (x % 32 > 29.5) || (y % 32 > 29.5);
      if (edge) c = mixc(c, [104, 116, 136], 0.4);
      /* 리벳 */
      var rx = x % 32, ry = y % 32;
      if ((rx - 4) * (rx - 4) + (ry - 4) * (ry - 4) < 2.4) c = mixc(c, [120, 132, 152], 0.7);
      if ((rx - 28) * (rx - 28) + (ry - 28) * (ry - 28) < 2.4) c = mixc(c, [120, 132, 152], 0.7);
      return c;
    });
  };

  TEX_DRAW[T_PANEL2] = TEX_DRAW[T_PANEL];

  /* 바닥 데크 — 다이아 플레이트 */
  TEX_DRAW[T_DECK] = function (ctx, size) {
    AX.noise.setSeed(42);
    paint(ctx, size, function (x, y) {
      var n = AX.noise.fbm2(x * 0.12, y * 0.12, 3);
      var c = mixc([46, 52, 64], [62, 70, 84], n);
      /* 대각 돌기 */
      var dx = (x + y) % 16, dy = (x - y + 256) % 16;
      if (dx < 5 && dy < 2.2) c = mixc(c, [92, 102, 120], 0.6);
      if ((x % 64 < 1.4) || (y % 64 < 1.4)) c = mixc(c, [26, 30, 40], 0.8);
      return c;
    });
  };

  TEX_DRAW[T_CEIL] = function (ctx, size) {
    AX.noise.setSeed(43);
    paint(ctx, size, function (x, y) {
      var n = AX.noise.fbm2(x * 0.09, y * 0.09, 2);
      var c = mixc([22, 26, 36], [34, 39, 50], n);
      if ((x % 16 < 1.2) || (y % 16 < 1.2)) c = mixc(c, [12, 14, 20], 0.7);
      return c;
    });
  };

  /* 유리 — 프레임과 흐릿한 사선 반사 */
  TEX_DRAW[T_GLASS] = function (ctx, size) {
    paint(ctx, size, function (x, y) {
      var b = Math.min(Math.min(x, size - 1 - x), Math.min(y, size - 1 - y));
      if (b < 2.5) return [150, 175, 200, 235];
      var streak = ((x + y * 0.5) % 40 < 5) ? 26 : 0;
      return [140 + streak, 180 + streak, 220 + streak, 26 + streak];
    });
  };

  TEX_DRAW[T_LIGHT] = function (ctx, size) {
    paint(ctx, size, function (x, y) {
      var b = Math.min(Math.min(x, size - 1 - x), Math.min(y, size - 1 - y));
      if (b < 3) return [70, 84, 104];
      if (b < 5) return [140, 160, 190];
      return [235, 248, 255];
    });
  };

  TEX_DRAW[T_WLIGHT] = function (ctx, size) {
    paint(ctx, size, function (x, y) {
      var band = Math.abs(y - size / 2);
      if (band < size * 0.16) return [190, 240, 255];
      if (band < size * 0.24) return [90, 130, 168];
      var n = AX.noise.fbm2(x * 0.4, y * 0.2, 2);
      return mixc([52, 60, 76], [70, 80, 98], n);
    });
  };

  /* 하자드 트림 */
  TEX_DRAW[T_TRIM] = function (ctx, size) {
    paint(ctx, size, function (x, y) {
      var d = ((x + y) % 24) < 12;
      var edge = Math.min(Math.min(x, size - 1 - x), Math.min(y, size - 1 - y)) < 2;
      if (edge) return [30, 32, 40];
      return d ? [226, 178, 42] : [34, 36, 44];
    });
  };

  TEX_DRAW[T_CRATE] = function (ctx, size) {
    AX.noise.setSeed(44);
    paint(ctx, size, function (x, y) {
      var n = AX.noise.fbm2(x * 0.1, y * 0.1, 3);
      var c = mixc([58, 74, 86], [78, 96, 108], n);
      var b = Math.min(Math.min(x, size - 1 - x), Math.min(y, size - 1 - y));
      if (b < 4) c = mixc(c, [36, 46, 56], 0.85);
      else if (b < 6) c = mixc(c, [96, 116, 128], 0.5);
      /* 중앙 마킹 */
      var cx = Math.abs(x - size / 2), cy = Math.abs(y - size / 2);
      if (cx < size * 0.2 && cy < size * 0.13 &&
          (cx > size * 0.16 || cy > size * 0.09)) c = mixc(c, [226, 178, 42], 0.8);
      return c;
    });
  };

  TEX_DRAW[T_CRATE_TOP] = function (ctx, size) {
    AX.noise.setSeed(45);
    paint(ctx, size, function (x, y) {
      var n = AX.noise.fbm2(x * 0.1, y * 0.1, 3);
      var c = mixc([52, 68, 80], [72, 88, 100], n);
      var b = Math.min(Math.min(x, size - 1 - x), Math.min(y, size - 1 - y));
      if (b < 4) c = mixc(c, [32, 42, 52], 0.85);
      if (Math.abs(x - y) < 2.2 || Math.abs((size - x) - y) < 2.2) c = mixc(c, [96, 112, 124], 0.5);
      return c;
    });
  };

  TEX_DRAW[T_GRATE] = function (ctx, size) {
    paint(ctx, size, function (x, y) {
      var sx = x % 12, sy = y % 12;
      if (sx > 2 && sx < 10 && sy > 2 && sy < 10) return [8, 10, 15];
      return [56, 64, 78];
    });
  };

  TEX_DRAW[T_DARK] = function (ctx, size) {
    AX.noise.setSeed(46);
    paint(ctx, size, function (x, y) {
      var n = AX.noise.fbm2(x * 0.2, y * 0.05, 2);
      var c = mixc([30, 34, 44], [42, 47, 58], n);
      if (y % 21 < 1.4) c = mixc(c, [18, 20, 28], 0.8);
      return c;
    });
  };

  /* ══════════════════════════════════════════════════════════
     섹션 메시 — 복셀 게임과 같은 방식의 AO 메싱
     ══════════════════════════════════════════════════════════ */

  var FACES = [
    { n: [1, 0, 0],  u: [0, 0, -1], v: [0, 1, 0], o: [1, 0, 1] },
    { n: [-1, 0, 0], u: [0, 0, 1],  v: [0, 1, 0], o: [0, 0, 0] },
    { n: [0, 1, 0],  u: [1, 0, 0],  v: [0, 0, -1], o: [0, 1, 1] },
    { n: [0, -1, 0], u: [1, 0, 0],  v: [0, 0, 1], o: [0, 0, 0] },
    { n: [0, 0, 1],  u: [1, 0, 0],  v: [0, 1, 0], o: [0, 0, 1] },
    { n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0], o: [1, 0, 0] }
  ];
  var CORNERS = [[0, 0], [1, 0], [1, 1], [0, 1]];

  var sections = [];
  var SX = MW / SEC, SZ = MD / SEC;

  function sectionAt(x, z) {
    var sx = Math.floor(x / SEC), sz = Math.floor(z / SEC);
    if (sx < 0 || sx >= SX || sz < 0 || sz >= SZ) return null;
    return sections[sx + SX * sz];
  }

  function initSections() {
    for (var sz = 0; sz < SZ; sz++) {
      for (var sx = 0; sx < SX; sx++) {
        sections.push({
          sx: sx, sz: sz,
          origin: new Float32Array([sx * SEC, 0, sz * SEC]),
          mesh: null, glassMesh: null, dirty: true
        });
      }
    }
  }

  var scratch = new Uint32Array(360000);
  var scratchG = new Uint32Array(40000);

  function vertexAO(s1, s2, c) {
    if (s1 && s2) return 0;
    return 3 - (s1 + s2 + c);
  }

  function buildSection(gl, s) {
    var ox = s.sx * SEC, oz = s.sz * SEC;
    var op = 0, gp = 0;

    for (var y = 0; y < MH; y++) {
      for (var z = 0; z < SEC; z++) {
        for (var x = 0; x < SEC; x++) {
          var wx = ox + x, wz = oz + z;
          var b = getBlock(wx, y, wz);
          if (b === AIR) continue;
          var def = BLOCKS[b];
          var isGlass = !!def.glass;

          for (var f = 0; f < 6; f++) {
            var F = FACES[f];
            var nx = wx + F.n[0], ny = y + F.n[1], nz = wz + F.n[2];
            var nb = getBlock(nx, ny, nz);

            if (isGlass) {
              if (nb === GLASS || BLOCKS[nb].opaque) continue;
            } else {
              if (BLOCKS[nb].opaque) continue;
            }

            var layer = def.faces[f];
            var emissive = def.emissive ? 1 : 0;

            var ao = [3, 3, 3, 3];
            if (!isGlass) {
              for (var ci = 0; ci < 4; ci++) {
                var du = CORNERS[ci][0] * 2 - 1, dv = CORNERS[ci][1] * 2 - 1;
                var s1 = isOpaque(nx + F.u[0] * du, ny + F.u[1] * du, nz + F.u[2] * du) ? 1 : 0;
                var s2 = isOpaque(nx + F.v[0] * dv, ny + F.v[1] * dv, nz + F.v[2] * dv) ? 1 : 0;
                var cr = isOpaque(nx + F.u[0] * du + F.v[0] * dv,
                                  ny + F.u[1] * du + F.v[1] * dv,
                                  nz + F.u[2] * du + F.v[2] * dv) ? 1 : 0;
                ao[ci] = vertexAO(s1, s2, cr);
              }
            }

            var flip = (ao[0] + ao[2]) > (ao[1] + ao[3]);
            var order = flip ? [1, 2, 3, 1, 3, 0] : [0, 1, 2, 0, 2, 3];
            var target = isGlass ? scratchG : scratch;
            var ptr = isGlass ? gp : op;
            if (ptr + 12 > target.length) continue;

            for (var vi = 0; vi < 6; vi++) {
              var ci2 = order[vi];
              var du2 = CORNERS[ci2][0], dv2 = CORNERS[ci2][1];
              var px = x + F.o[0] + F.u[0] * du2 + F.v[0] * dv2;
              var py = y + F.o[1] + F.u[1] * du2 + F.v[1] * dv2;
              var pz = z + F.o[2] + F.u[2] * du2 + F.v[2] * dv2;
              target[ptr] = (px & 31) | ((py & 127) << 5) | ((pz & 31) << 12) |
                            (f << 17) | (ao[ci2] << 20) | (du2 << 22) | (dv2 << 23);
              target[ptr + 1] = layer | (emissive << 8);
              ptr += 2;
            }
            if (isGlass) gp = ptr; else op = ptr;
          }
        }
      }
    }

    if (s.mesh) { s.mesh.dispose(); s.mesh = null; }
    if (s.glassMesh) { s.glassMesh.dispose(); s.glassMesh = null; }
    if (op > 0) {
      s.mesh = new AX.Mesh(gl, {
        buffers: [{ data: scratch.subarray(0, op), stride: 8,
                    attrs: [{ loc: 0, size: 2, offset: 0, integer: true, type: gl.UNSIGNED_INT }] }],
        count: op / 2
      });
    }
    if (gp > 0) {
      s.glassMesh = new AX.Mesh(gl, {
        buffers: [{ data: scratchG.subarray(0, gp), stride: 8,
                    attrs: [{ loc: 0, size: 2, offset: 0, integer: true, type: gl.UNSIGNED_INT }] }],
        count: gp / 2
      });
    }
    s.dirty = false;
  }

  /* 블록을 부수면 해당 섹션(경계면 이웃 포함)을 다시 만듭니다. */
  function breakBlock(x, y, z) {
    setBlockRaw(x, y, z, AIR);
    var s0 = sectionAt(x, z);
    if (s0) s0.dirty = true;
    var lx = x % SEC, lz = z % SEC;
    if (lx === 0) { var a = sectionAt(x - 1, z); if (a) a.dirty = true; }
    if (lx === SEC - 1) { var b2 = sectionAt(x + 1, z); if (b2) b2.dirty = true; }
    if (lz === 0) { var c = sectionAt(x, z - 1); if (c) c.dirty = true; }
    if (lz === SEC - 1) { var d = sectionAt(x, z + 1); if (d) d.dirty = true; }
  }

  /* ══════════════════════════════════════════════════════════
     셰이더
     ══════════════════════════════════════════════════════════ */

  var MAX_LIGHTS = 10;

  var LIGHT_GLSL = [
    'uniform int uLightCount;',
    'uniform vec3 uLightPos[' + MAX_LIGHTS + '];',
    'uniform vec3 uLightColor[' + MAX_LIGHTS + '];',
    /* 확산 + 블린 스펙큘러를 합쳐 돌려줍니다. */
    'vec3 shadePoints(vec3 P, vec3 N, vec3 V, vec3 albedo, float specPow, float specK) {',
    '  vec3 sum = vec3(0.0);',
    '  for (int i = 0; i < ' + MAX_LIGHTS + '; i++) {',
    '    if (i >= uLightCount) break;',
    '    vec3 Ld = uLightPos[i] - P;',
    '    float d2 = dot(Ld, Ld);',
    '    vec3 L = Ld * inversesqrt(max(d2, 1e-4));',
    '    float atten = 1.0 / (1.0 + d2 * 0.055);',
    '    float ndl = max(dot(N, L), 0.0);',
    '    vec3 H = normalize(L + V);',
    '    float spec = pow(max(dot(N, H), 0.0), specPow) * specK;',
    '    sum += uLightColor[i] * atten * (albedo * ndl + vec3(spec) * ndl);',
    '  }',
    '  return sum;',
    '}'
  ].join('\n');

  var VOX_VS = [
    '#version 300 es',
    'layout(location=0) in uvec2 aData;',
    'uniform mat4 uViewProj;',
    'uniform vec3 uOrigin;',
    'out vec3 vNormal;',
    'out vec3 vWorld;',
    'out vec3 vUVW;',
    'out float vAO;',
    'out float vEmissive;',
    'const vec3 NRM[6] = vec3[6](vec3(1,0,0), vec3(-1,0,0), vec3(0,1,0),',
    '                            vec3(0,-1,0), vec3(0,0,1), vec3(0,0,-1));',
    'void main() {',
    '  uint d = aData.x;',
    '  vec3 p = vec3(float(d & 31u), float((d >> 5) & 127u), float((d >> 12) & 31u));',
    '  uint f = (d >> 17) & 7u;',
    '  vAO = float((d >> 20) & 3u) / 3.0;',
    '  float u = float((d >> 22) & 1u);',
    '  float v = float((d >> 23) & 1u);',
    '  uint meta = aData.y;',
    '  vEmissive = float((meta >> 8) & 1u);',
    '  vNormal = NRM[f];',
    '  vWorld = uOrigin + p;',
    '  vUVW = vec3(u, 1.0 - v, float(meta & 255u));',
    '  gl_Position = uViewProj * vec4(vWorld, 1.0);',
    '}'
  ].join('\n');

  var VOX_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DArray;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'in vec3 vUVW;',
    'in float vAO;',
    'in float vEmissive;',
    'uniform sampler2DArray uAtlas;',
    'uniform vec3 uCamPos, uAmbient, uFogColor;',
    'uniform float uFogDensity;',
    'out vec4 fragColor;',
    LIGHT_GLSL,
    'void main() {',
    '  vec3 albedo = texture(uAtlas, vUVW).rgb;',
    '  vec3 N = normalize(vNormal);',
    '  vec3 V = normalize(uCamPos - vWorld);',
    '  float ao = 0.3 + 0.7 * vAO;',
    '  vec3 color = albedo * uAmbient * ao;',
    '  color += shadePoints(vWorld, N, V, albedo, 42.0, 0.28) * ao;',
    '  color += albedo * vEmissive * 3.4;',
    '  float dist = length(vWorld - uCamPos);',
    '  float fog = 1.0 - exp(-dist * dist * uFogDensity);',
    '  color = mix(color, uFogColor, fog);',
    '  fragColor = vec4(color, 1.0);',
    '}'
  ].join('\n');

  var GLASS_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DArray;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'in vec3 vUVW;',
    'in float vAO;',
    'in float vEmissive;',
    'uniform sampler2DArray uAtlas;',
    'uniform vec3 uCamPos;',
    'out vec4 fragColor;',
    'void main() {',
    '  vec4 t = texture(uAtlas, vUVW);',
    '  vec3 N = normalize(vNormal);',
    '  vec3 V = normalize(uCamPos - vWorld);',
    '  float fres = pow(1.0 - abs(dot(N, V)), 2.6);',
    '  vec3 tint = t.rgb * 0.55 + vec3(0.32, 0.5, 0.68) * fres;',
    '  float a = clamp(t.a / 255.0 * 255.0 * 0.0039 + fres * 0.4, 0.05, 0.85);',
    '  fragColor = vec4(tint, a);',
    '}'
  ].join('\n');

  /* 우주 배경 */
  var SKY_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'uniform mat4 uInvViewProj;',
    'uniform vec3 uCamPos;',
    'uniform float uTime;',
    'out vec4 fragColor;',
    AX.chunk.hash,
    'float vnoise(vec2 p) {',
    '  vec2 i = floor(p), f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash12(i), b = hash12(i + vec2(1, 0));',
    '  float c = hash12(i + vec2(0, 1)), d = hash12(i + vec2(1, 1));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    'float fbm(vec2 p) {',
    '  float s = 0.0, amp = 0.5;',
    '  for (int i = 0; i < 4; i++) { s += vnoise(p) * amp; p *= 2.13; amp *= 0.5; }',
    '  return s;',
    '}',
    'void main() {',
    '  vec4 far = uInvViewProj * vec4(vUV * 2.0 - 1.0, 1.0, 1.0);',
    '  vec3 dir = normalize(far.xyz / far.w - uCamPos);',
    '  /* 별이 아주 느리게 돌게 합니다. */',
    '  float rot = uTime * 0.004;',
    '  vec3 d2 = vec3(dir.x * cos(rot) - dir.z * sin(rot), dir.y, dir.x * sin(rot) + dir.z * cos(rot));',
    '  vec3 col = mix(vec3(0.004, 0.006, 0.016), vec3(0.012, 0.02, 0.05), dir.y * 0.5 + 0.5);',
    '  /* 성운 */',
    '  float neb = fbm(d2.xy * 2.2 + d2.z * 1.4 + 7.0);',
    '  float neb2 = fbm(d2.zy * 2.8 - 3.0);',
    '  col += vec3(0.10, 0.03, 0.18) * pow(neb, 2.6) * 1.6;',
    '  col += vec3(0.0, 0.09, 0.14) * pow(neb2, 3.0) * 1.4;',
    '  /* 별 두 층 */',
    '  for (int layer = 0; layer < 2; layer++) {',
    '    float scale = layer == 0 ? 60.0 : 130.0;',
    '    vec2 sp = (abs(d2.y) > 0.62 ? d2.xz : (abs(d2.x) > abs(d2.z) ? d2.zy : d2.xy)) * scale;',
    '    vec2 cell = floor(sp);',
    '    vec2 rnd = hash22(cell);',
    '    float dd = length(fract(sp) - rnd);',
    '    float mag = hash12(cell + 17.0);',
    '    float star = smoothstep(0.06, 0.0, dd) * step(0.75, mag);',
    '    float tw = 0.7 + 0.3 * sin(uTime * 2.0 + mag * 50.0);',
    '    col += vec3(0.8, 0.87, 1.0) * star * tw * (layer == 0 ? 1.0 : 0.5);',
    '  }',
    '  /* 지구 비슷한 행성 */',
    '  vec3 pd = normalize(vec3(0.55, 0.18, -0.72));',
    '  float pdot = dot(dir, pd);',
    '  float disc = smoothstep(0.940, 0.945, pdot);',
    '  if (disc > 0.0) {',
    '    vec3 rel = normalize(dir - pd * pdot);',
    '    float lat = rel.y;',
    '    float bands = fbm(vec2(lat * 6.0, pdot * 40.0) + 3.0);',
    '    vec3 planet = mix(vec3(0.05, 0.15, 0.3), vec3(0.18, 0.4, 0.55), bands);',
    '    planet = mix(planet, vec3(0.9, 0.95, 1.0), smoothstep(0.6, 0.9, bands) * 0.5);',
    '    float limb = smoothstep(0.955, 0.9995, pdot);',
    '    col = mix(col, planet * (0.4 + 0.6 * limb), disc);',
    '  }',
    '  float rim = smoothstep(0.930, 0.943, pdot) * (1.0 - smoothstep(0.943, 0.958, pdot));',
    '  col += vec3(0.25, 0.55, 0.9) * rim * 1.4;',
    '  fragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* 일반 메시 (드론·총) */
  var PRIM_VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNormal;',
    'layout(location=2) in vec2 aUV;',
    'uniform mat4 uViewProj, uModel;',
    'uniform mat3 uNormalMat;',
    'out vec3 vNormal;',
    'out vec3 vWorld;',
    'void main() {',
    '  vec4 w = uModel * vec4(aPos, 1.0);',
    '  vWorld = w.xyz;',
    '  vNormal = uNormalMat * aNormal;',
    '  gl_Position = uViewProj * w;',
    '}'
  ].join('\n');

  var PRIM_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'uniform vec3 uCamPos, uAlbedo, uEmissive, uAmbient, uFogColor;',
    'uniform float uSpecPow, uSpecK, uFogDensity, uRim;',
    'out vec4 fragColor;',
    LIGHT_GLSL,
    'void main() {',
    '  vec3 N = normalize(vNormal);',
    '  vec3 V = normalize(uCamPos - vWorld);',
    '  vec3 color = uAlbedo * uAmbient;',
    '  color += shadePoints(vWorld, N, V, uAlbedo, uSpecPow, uSpecK);',
    '  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);',
    '  color += vec3(0.3, 0.7, 1.0) * rim * uRim;',
    '  color += uEmissive;',
    '  float dist = length(vWorld - uCamPos);',
    '  float fog = 1.0 - exp(-dist * dist * uFogDensity);',
    '  color = mix(color, uFogColor, fog);',
    '  fragColor = vec4(color, 1.0);',
    '}'
  ].join('\n');

  /* 실드 — 프레넬 + 균열 */
  var SHIELD_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec3 vNormal;',
    'in vec3 vWorld;',
    'uniform vec3 uCamPos, uColor;',
    'uniform float uCrack, uFlash, uTime;',
    'out vec4 fragColor;',
    AX.chunk.hash,
    'void main() {',
    '  vec3 N = normalize(vNormal);',
    '  vec3 V = normalize(uCamPos - vWorld);',
    '  float fres = pow(1.0 - abs(dot(N, V)), 2.2);',
    '  /* 육각 비스무리한 셀 패턴 */',
    '  vec2 p = vec2(atan(N.z, N.x) * 3.0, N.y * 4.0 + uTime * 0.12);',
    '  float cell = hash12(floor(p * 3.0));',
    '  float cracks = step(1.0 - uCrack * 0.85, cell);',
    '  float a = fres * 0.55 + cracks * 0.3 + uFlash * 0.5;',
    '  vec3 col = uColor * (0.7 + fres * 1.6) + vec3(1.0) * uFlash;',
    '  fragColor = vec4(col, clamp(a, 0.0, 0.9));',
    '}'
  ].join('\n');

  /* 빔 (트레이서) */
  var BEAM_VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'uniform mat4 uViewProj, uModel;',
    'out vec2 vUV;',
    'void main() {',
    '  vUV = vec2(aPos.x + aPos.z + 0.5, aPos.y);',
    '  gl_Position = uViewProj * (uModel * vec4(aPos, 1.0));',
    '}'
  ].join('\n');

  var BEAM_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV;',
    'uniform vec3 uColor;',
    'uniform float uAlpha;',
    'out vec4 fragColor;',
    'void main() {',
    '  float core = 1.0 - abs(vUV.x - 0.5) * 2.0;',
    '  core = pow(max(core, 0.0), 2.2);',
    '  float fade = 1.0 - vUV.y * 0.55;',
    '  fragColor = vec4(uColor * core * fade, core * uAlpha);',
    '}'
  ].join('\n');

  /* ══════════════════════════════════════════════════════════
     렌더러 상태
     ══════════════════════════════════════════════════════════ */

  var R = {
    gl: null,
    camera: new AX.Camera(),
    frustum: new AX.Frustum(),
    sh: {},
    atlas: null,
    post: null,
    particles: null,
    fullscreen: null,
    meshes: {},
    tmpM: AX.mat4.create(),
    tmpM2: AX.mat4.create(),
    tmpM3: AX.mat4.create(),
    tmpN: AX.mat3.create(),
    tmpV: AX.vec3.create(),
    lightPosArr: new Float32Array(MAX_LIGHTS * 3),
    lightColArr: new Float32Array(MAX_LIGHTS * 3),
    lightCount: 0,
    dynLights: []       // { pos, color, intensity, ttl, maxTtl }
  };

  var AMBIENT = [0.055, 0.07, 0.10];
  var FOG_COLOR = [0.008, 0.012, 0.024];
  var FOG_DENSITY = 0.00028;

  function initRenderer(canvas) {
    var gl = R.gl = AX.GL.create(canvas);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.clearColor(0.004, 0.006, 0.014, 1);

    R.sh.vox = new AX.Shader(gl, VOX_VS, VOX_FS, 'vox');
    R.sh.glass = new AX.Shader(gl, VOX_VS, GLASS_FS, 'glass');
    R.sh.sky = new AX.Shader(gl, AX.chunk.fullscreenVS, SKY_FS, 'sky');
    R.sh.prim = new AX.Shader(gl, PRIM_VS, PRIM_FS, 'prim');
    R.sh.shield = new AX.Shader(gl, PRIM_VS, SHIELD_FS, 'shield');
    R.sh.beam = new AX.Shader(gl, BEAM_VS, BEAM_FS, 'beam');

    R.atlas = AX.tex.array(gl, 64, TEX_LAYERS, function (ctx, i, size) {
      if (TEX_DRAW[i]) TEX_DRAW[i](ctx, size);
      else { ctx.fillStyle = '#f0f'; ctx.fillRect(0, 0, size, size); }
    });

    R.post = new AX.Post(gl);
    R.post.effects.exposure = 1.1;
    R.post.effects.bloomStrength = 0.7;
    R.post.effects.bloomThreshold = 0.9;
    R.post.effects.vignette = 0.4;
    R.post.effects.grain = 0.03;
    R.post.effects.chroma = 0.0018;
    R.post.effects.saturation = 1.05;

    R.particles = new AX.Particles(gl, 700);
    R.fullscreen = AX.geom.fullscreen(gl);

    /* 기본 지오메트리 */
    R.meshes.sphere = AX.Mesh.fromGeometry(gl, AX.geom.sphere(0.5, 26, 18));
    R.meshes.box = AX.Mesh.fromGeometry(gl, AX.geom.box(1, 1, 1));
    R.meshes.cyl = AX.Mesh.fromGeometry(gl, AX.geom.cylinder(0.5, 0.5, 1, 18));

    /* 빔 — 교차 쿼드 */
    var bp = new Float32Array([
      -0.5, 0, 0, 0.5, 0, 0, 0.5, 1, 0, -0.5, 0, 0, 0.5, 1, 0, -0.5, 1, 0,
      0, 0, -0.5, 0, 0, 0.5, 0, 1, 0.5, 0, 0, -0.5, 0, 1, 0.5, 0, 1, -0.5
    ]);
    R.meshes.beam = new AX.Mesh(gl, {
      buffers: [{ data: bp, stride: 12, attrs: [{ loc: 0, size: 3, offset: 0 }] }],
      count: 12
    });

    AX.Quality.onChange(function () {
      R.post.dispose();
      R.post.width = R.post.height = 0;
      resize(true);
    });
  }

  function resize(force) {
    var gl = R.gl;
    var changed = AX.GL.resize(gl);
    if (changed || force) R.post.resize(gl.axCanvas.width, gl.axCanvas.height);
    return changed;
  }

  /* 카메라에서 가까운 정적 라이트 + 동적 라이트를 골라 배열에 채웁니다. */
  function gatherLights(dt) {
    for (var i = R.dynLights.length - 1; i >= 0; i--) {
      var d = R.dynLights[i];
      d.ttl -= dt;
      if (d.ttl <= 0) R.dynLights.splice(i, 1);
    }

    var cam = R.camera.position;
    var scored = [];
    for (var j = 0; j < pointLights.length; j++) {
      var L = pointLights[j];
      var dx = L.pos[0] - cam[0], dy = L.pos[1] - cam[1], dz = L.pos[2] - cam[2];
      scored.push({ l: L, d: dx * dx + dy * dy + dz * dz, k: 1 });
    }
    scored.sort(function (a, b) { return a.d - b.d; });

    var n = 0;
    /* 동적 라이트 우선 */
    for (var k = 0; k < R.dynLights.length && n < MAX_LIGHTS; k++) {
      var dl = R.dynLights[k];
      var f = Math.min(1, dl.ttl / (dl.maxTtl * 0.55));
      R.lightPosArr[n * 3] = dl.pos[0];
      R.lightPosArr[n * 3 + 1] = dl.pos[1];
      R.lightPosArr[n * 3 + 2] = dl.pos[2];
      R.lightColArr[n * 3] = dl.color[0] * dl.intensity * f;
      R.lightColArr[n * 3 + 1] = dl.color[1] * dl.intensity * f;
      R.lightColArr[n * 3 + 2] = dl.color[2] * dl.intensity * f;
      n++;
    }
    for (var m = 0; m < scored.length && n < MAX_LIGHTS; m++) {
      var sl = scored[m].l;
      R.lightPosArr[n * 3] = sl.pos[0];
      R.lightPosArr[n * 3 + 1] = sl.pos[1];
      R.lightPosArr[n * 3 + 2] = sl.pos[2];
      R.lightColArr[n * 3] = sl.color[0] * sl.intensity * 0.055;
      R.lightColArr[n * 3 + 1] = sl.color[1] * sl.intensity * 0.055;
      R.lightColArr[n * 3 + 2] = sl.color[2] * sl.intensity * 0.055;
      n++;
    }
    R.lightCount = n;
  }

  function flash(pos, color, intensity, ttl) {
    R.dynLights.push({ pos: [pos[0], pos[1], pos[2]], color: color,
                       intensity: intensity, ttl: ttl, maxTtl: ttl });
    if (R.dynLights.length > 6) R.dynLights.shift();
  }

  function setLightUniforms(sh) {
    sh.set('uLightCount', R.lightCount);
    sh.set('uLightPos', R.lightPosArr);
    sh.set('uLightColor', R.lightColArr);
  }

  /* 프림 하나 그리기 */
  function drawPrim(mesh, model, mat) {
    var sh = R.sh.prim;
    AX.mat3.normalFromMat4(R.tmpN, model);
    sh.set('uModel', model);
    sh.set('uNormalMat', R.tmpN);
    sh.set('uAlbedo', mat.albedo);
    sh.set('uEmissive', mat.emissive || [0, 0, 0]);
    sh.set('uSpecPow', mat.specPow !== undefined ? mat.specPow : 40);
    sh.set('uSpecK', mat.specK !== undefined ? mat.specK : 0.5);
    sh.set('uRim', mat.rim !== undefined ? mat.rim : 0.12);
    mesh.draw();
  }

  /* ══════════════════════════════════════════════════════════
     플레이어
     ══════════════════════════════════════════════════════════ */

  var player = {
    pos: AX.vec3.create(48, FLOOR_Y + 1, 48),
    vel: AX.vec3.create(0, 0, 0),
    onGround: false,
    width: 0.6, height: 1.75, eye: 1.6,
    hp: 100, maxHp: 100,
    shield: 50, maxShield: 50,
    lastHurt: -99,
    dashCd: 0,
    bob: 0,
    dead: false
  };

  var WALK = 5.4, JUMP = 8.4, GRAVITY = -24;

  function blockedAt(x, y, z) {
    var minX = Math.floor(x - player.width / 2), maxX = Math.floor(x + player.width / 2);
    var minY = Math.floor(y), maxY = Math.floor(y + player.height - 0.001);
    var minZ = Math.floor(z - player.width / 2), maxZ = Math.floor(z + player.width / 2);
    for (var by = minY; by <= maxY; by++) {
      for (var bz = minZ; bz <= maxZ; bz++) {
        for (var bx = minX; bx <= maxX; bx++) {
          if (isSolid(bx, by, bz)) return true;
        }
      }
    }
    return false;
  }

  function moveAxis(axis, delta) {
    if (delta === 0) return false;
    var old = player.pos[axis];
    player.pos[axis] += delta;
    if (blockedAt(player.pos[0], player.pos[1], player.pos[2])) {
      player.pos[axis] = old;
      return true;
    }
    return false;
  }

  var stepTimer = 0;

  function updatePlayer(dt) {
    if (player.dead) return;
    var cam = R.camera;

    var fx = Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    var rx = Math.cos(cam.yaw), rz = Math.sin(cam.yaw);
    var ix = 0, iz = 0;
    if (AX.Input.down('KeyW')) iz += 1;
    if (AX.Input.down('KeyS')) iz -= 1;
    if (AX.Input.down('KeyD')) ix += 1;
    if (AX.Input.down('KeyA')) ix -= 1;
    var len = Math.hypot(ix, iz);
    if (len > 0) { ix /= len; iz /= len; }
    var wishX = fx * iz + rx * ix, wishZ = fz * iz + rz * ix;

    var speed = WALK * (weapon.ads ? 0.72 : 1);
    var accel = player.onGround ? 40 : 10;
    player.vel[0] += (wishX * speed - player.vel[0]) * Math.min(1, accel * dt);
    player.vel[2] += (wishZ * speed - player.vel[2]) * Math.min(1, accel * dt);

    /* 대시 */
    player.dashCd -= dt;
    if ((AX.Input.justPressed('ShiftLeft') || AX.Input.justPressed('ShiftRight')) &&
        player.dashCd <= 0 && (ix !== 0 || iz !== 0)) {
      player.vel[0] += wishX * 13;
      player.vel[2] += wishZ * 13;
      player.dashCd = 2.1;
      fovKick = 1;
      AX.Audio.sfx.dash();
    }

    player.vel[1] += GRAVITY * dt;
    if (AX.Input.down('Space') && player.onGround) {
      player.vel[1] = JUMP;
      player.onGround = false;
      AX.Audio.sfx.jump();
    }
    player.vel[1] = Math.max(player.vel[1], -40);

    var hitY = moveAxis(1, player.vel[1] * dt);
    if (hitY) {
      if (player.vel[1] < 0) player.onGround = true;
      player.vel[1] = 0;
    } else player.onGround = false;

    var hitX = moveAxis(0, player.vel[0] * dt);
    if (hitX && player.onGround) {
      player.pos[1] += 1.02;
      if (!blockedAt(player.pos[0] + player.vel[0] * dt, player.pos[1], player.pos[2])) {
        player.pos[0] += player.vel[0] * dt;
      } else { player.pos[1] -= 1.02; player.vel[0] = 0; }
    }
    var hitZ = moveAxis(2, player.vel[2] * dt);
    if (hitZ && player.onGround) {
      player.pos[1] += 1.02;
      if (!blockedAt(player.pos[0], player.pos[1], player.pos[2] + player.vel[2] * dt)) {
        player.pos[2] += player.vel[2] * dt;
      } else { player.pos[1] -= 1.02; player.vel[2] = 0; }
    }

    /* 실드 재생 */
    if (game.time - player.lastHurt > 3.6 && player.shield < player.maxShield) {
      player.shield = Math.min(player.maxShield, player.shield + 14 * dt);
    }

    /* 발소리·보빙 */
    var hs = Math.hypot(player.vel[0], player.vel[2]);
    if (player.onGround && hs > 1) {
      player.bob += dt * hs * 1.6;
      stepTimer -= dt;
      if (stepTimer <= 0) { AX.Audio.sfx.step(); stepTimer = 2.6 / hs; }
    } else {
      player.bob += (0 - (player.bob % (Math.PI * 2))) * Math.min(1, dt * 7);
    }
  }

  function damagePlayer(amount, fromPos) {
    if (player.dead || game.state !== 'combat') return;
    player.lastHurt = game.time;
    var toShield = Math.min(player.shield, amount);
    player.shield -= toShield;
    var rest = amount - toShield;
    player.hp -= rest;
    game.stats.taken += amount;
    AX.Audio.sfx.hurt();
    shake = Math.min(1, shake + 0.35);
    hud.dmg.style.opacity = '0.9';
    if (player.hp <= 0) {
      player.hp = 0;
      player.dead = true;
      endGame(false);
    }
  }

  /* ══════════════════════════════════════════════════════════
     레이캐스트
     ══════════════════════════════════════════════════════════ */

  /* 맵 복셀 대상. glassStops=false면 유리를 통과합니다. */
  function raycastMap(o, d, maxDist, glassStops) {
    var x = Math.floor(o[0]), y = Math.floor(o[1]), z = Math.floor(o[2]);
    var stepX = d[0] > 0 ? 1 : -1, stepY = d[1] > 0 ? 1 : -1, stepZ = d[2] > 0 ? 1 : -1;
    var tdx = Math.abs(1 / (d[0] || 1e-9)), tdy = Math.abs(1 / (d[1] || 1e-9)), tdz = Math.abs(1 / (d[2] || 1e-9));
    var tmx = ((d[0] > 0 ? x + 1 - o[0] : o[0] - x) || 1e-9) * tdx;
    var tmy = ((d[1] > 0 ? y + 1 - o[1] : o[1] - y) || 1e-9) * tdy;
    var tmz = ((d[2] > 0 ? z + 1 - o[2] : o[2] - z) || 1e-9) * tdz;
    var t = 0;
    while (t <= maxDist) {
      var b = getBlock(x, y, z);
      if (b !== AIR && BLOCKS[b].solid) {
        if (b !== GLASS || glassStops) {
          return { x: x, y: y, z: z, t: t, block: b };
        }
      }
      if (tmx < tmy && tmx < tmz) { x += stepX; t = tmx; tmx += tdx; }
      else if (tmy < tmz) { y += stepY; t = tmy; tmy += tdy; }
      else { z += stepZ; t = tmz; tmz += tdz; }
    }
    return null;
  }

  /* 광선 vs 구 */
  function raySphere(o, d, c, r) {
    var ox = o[0] - c[0], oy = o[1] - c[1], oz = o[2] - c[2];
    var b = ox * d[0] + oy * d[1] + oz * d[2];
    var cc = ox * ox + oy * oy + oz * oz - r * r;
    var disc = b * b - cc;
    if (disc < 0) return -1;
    var t = -b - Math.sqrt(disc);
    return t >= 0 ? t : -1;
  }

  /* 두 점 사이 시야 (유리는 투명 취급) */
  function hasLOS(a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    var dist = Math.hypot(dx, dy, dz);
    if (dist < 0.001) return true;
    var d = [dx / dist, dy / dist, dz / dist];
    var hit = raycastMap(a, d, dist, false);
    return !hit;
  }

  /* ══════════════════════════════════════════════════════════
     무기 — 펄스 라이플
     ══════════════════════════════════════════════════════════ */

  var weapon = {
    mag: 24, magSize: 24, reserve: 240,
    fireCd: 0, fireRate: 0.115,
    reloading: 0, reloadTime: 1.35,
    spread: 0,
    ads: false,
    kick: 0,        // 시각 반동
    muzzle: 0
  };

  var beams = [];   // { from, to, ttl, maxTtl, color }
  var shake = 0;
  var fovKick = 0;

  function fireWeapon() {
    if (weapon.mag <= 0) {
      AX.Audio.sfx.denied();
      startReload();
      return;
    }
    weapon.mag--;
    weapon.fireCd = weapon.fireRate;
    weapon.kick = 1;
    weapon.muzzle = 1;
    weapon.spread = Math.min(1, weapon.spread + 0.16);
    game.stats.shots++;
    AX.Audio.sfx.laser(0.95 + Math.random() * 0.1);

    var cam = R.camera;
    var spreadAmt = (weapon.ads ? 0.004 : 0.016) * (0.4 + weapon.spread);
    var dir = [
      cam.forward[0] + (Math.random() - 0.5) * spreadAmt * 2,
      cam.forward[1] + (Math.random() - 0.5) * spreadAmt * 2,
      cam.forward[2] + (Math.random() - 0.5) * spreadAmt * 2
    ];
    var dl = Math.hypot(dir[0], dir[1], dir[2]);
    dir[0] /= dl; dir[1] /= dl; dir[2] /= dl;

    var origin = [cam.position[0], cam.position[1], cam.position[2]];
    var maxDist = 80;

    /* 벽 히트 */
    var wallHit = raycastMap(origin, dir, maxDist, true);
    var wallT = wallHit ? wallHit.t : maxDist;

    /* 드론 히트 */
    var hitDrone = null, droneT = 1e9, hitShield = false;
    for (var i = 0; i < drones.length; i++) {
      var dr = drones[i];
      if (dr.dead) continue;
      var r = dr.shield > 0 ? 0.72 : 0.5;
      var t = raySphere(origin, dir, dr.pos, r);
      if (t >= 0 && t < droneT) { droneT = t; hitDrone = dr; hitShield = dr.shield > 0; }
    }

    var endT = Math.min(wallT, hitDrone ? droneT : 1e9);
    var end = [origin[0] + dir[0] * endT, origin[1] + dir[1] * endT, origin[2] + dir[2] * endT];

    /* 총구에서 살짝 아래·오른쪽에서 시작하는 트레이서 */
    var mStart = [
      origin[0] + cam.forward[0] * 0.4 + cam.right[0] * 0.16 - cam.up[0] * 0.12,
      origin[1] + cam.forward[1] * 0.4 + cam.right[1] * 0.16 - cam.up[1] * 0.12,
      origin[2] + cam.forward[2] * 0.4 + cam.right[2] * 0.16 - cam.up[2] * 0.12
    ];
    beams.push({ from: mStart, to: end, ttl: 0.09, maxTtl: 0.09, color: [0.4, 1.5, 2.2] });
    flash(mStart, [0.4, 0.85, 1], 5, 0.06);

    if (hitDrone && droneT < wallT) {
      game.stats.hits++;
      damageDrone(hitDrone, hitShield ? 12 : 22, end);
      markHit(false);
    } else if (wallHit) {
      /* 유리·상자는 부서집니다 */
      if (wallHit.block === GLASS || wallHit.block === CRATE) {
        breakBlock(wallHit.x, wallHit.y, wallHit.z);
        debris(wallHit.x + 0.5, wallHit.y + 0.5, wallHit.z + 0.5,
               wallHit.block === GLASS ? [0.6, 0.8, 1] : [0.35, 0.44, 0.5],
               wallHit.block === GLASS ? 16 : 12);
        AX.Audio.sfx.blockBreak();
      } else {
        /* 벽 스파크 */
        for (var s = 0; s < 5; s++) {
          R.particles.spawn({
            x: end[0], y: end[1], z: end[2],
            vx: (Math.random() - 0.5) * 5, vy: Math.random() * 4, vz: (Math.random() - 0.5) * 5,
            size: 0.05, life: 0.3, r: 1.4, g: 1.1, b: 0.5, gravity: -14
          });
        }
        flash(end, [0.5, 0.8, 1], 2, 0.08);
      }
    }
  }

  function startReload() {
    if (weapon.reloading > 0 || weapon.mag === weapon.magSize || weapon.reserve <= 0) return;
    weapon.reloading = weapon.reloadTime;
    AX.Audio.sfx.reload();
  }

  function updateWeapon(dt) {
    weapon.fireCd -= dt;
    weapon.spread = Math.max(0, weapon.spread - dt * 2.2);
    weapon.kick = Math.max(0, weapon.kick - dt * 6.5);
    weapon.muzzle = Math.max(0, weapon.muzzle - dt * 14);
    weapon.ads = AX.Input.mouseDown(2) && !player.dead;

    if (weapon.reloading > 0) {
      weapon.reloading -= dt;
      if (weapon.reloading <= 0) {
        var need = weapon.magSize - weapon.mag;
        var take = Math.min(need, weapon.reserve);
        weapon.mag += take;
        weapon.reserve -= take;
      }
    } else if (AX.Input.mouseDown(0) && weapon.fireCd <= 0 && AX.Input.locked && !player.dead) {
      fireWeapon();
    }

    if (AX.Input.justPressed('KeyR')) startReload();

    for (var i = beams.length - 1; i >= 0; i--) {
      beams[i].ttl -= dt;
      if (beams[i].ttl <= 0) beams.splice(i, 1);
    }
  }

  function debris(x, y, z, col, n) {
    for (var i = 0; i < n; i++) {
      R.particles.spawn({
        x: x + (Math.random() - 0.5) * 0.6,
        y: y + (Math.random() - 0.5) * 0.6,
        z: z + (Math.random() - 0.5) * 0.6,
        vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5, vz: (Math.random() - 0.5) * 6,
        size: 0.06 + Math.random() * 0.06,
        life: 0.5 + Math.random() * 0.5,
        r: col[0], g: col[1], b: col[2],
        gravity: -20
      });
    }
  }

  /* ══════════════════════════════════════════════════════════
     드론
     ══════════════════════════════════════════════════════════ */

  var drones = [];

  function spawnDrone(sp, hpScale) {
    drones.push({
      pos: [sp.x, sp.y, sp.z],
      vel: [0, 0, 0],
      yaw: Math.random() * Math.PI * 2,
      state: 'spawn',          // spawn → hunt → strafe
      stateT: 0,
      shield: 30 * hpScale, maxShield: 30 * hpScale,
      core: 40 * hpScale, maxCore: 40 * hpScale,
      shieldFlash: 0,
      hitFlash: 0,
      fireCd: 1.2 + Math.random() * 1.5,
      strafeDir: Math.random() < 0.5 ? 1 : -1,
      bobPhase: Math.random() * 10,
      scale: 0,
      dead: false
    });
    for (var i = 0; i < 10; i++) {
      R.particles.spawn({
        x: sp.x, y: sp.y, z: sp.z,
        vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, vz: (Math.random() - 0.5) * 4,
        size: 0.1, life: 0.5, r: 0.3, g: 0.9, b: 1.2, gravity: 0
      });
    }
    flash([sp.x, sp.y, sp.z], [0.3, 0.9, 1.2], 4, 0.4);
  }

  function damageDrone(dr, amount, at) {
    if (dr.dead) return;
    if (dr.shield > 0) {
      dr.shield -= amount;
      dr.shieldFlash = 1;
      AX.Audio.sfx.hitShield();
      if (dr.shield <= 0) {
        dr.shield = 0;
        /* 실드 붕괴 이펙트 */
        for (var i = 0; i < 12; i++) {
          R.particles.spawn({
            x: dr.pos[0], y: dr.pos[1], z: dr.pos[2],
            vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, vz: (Math.random() - 0.5) * 7,
            size: 0.08, life: 0.4, r: 0.3, g: 0.9, b: 1.3, gravity: 0
          });
        }
      }
    } else {
      dr.core -= amount;
      dr.hitFlash = 1;
      AX.Audio.sfx.hit();
      if (dr.core <= 0) killDrone(dr);
    }
  }

  function killDrone(dr) {
    dr.dead = true;
    game.stats.kills++;
    game.alive--;
    combo.count++;
    combo.timer = 3.6;
    if (combo.count > game.stats.bestCombo) game.stats.bestCombo = combo.count;
    game.score += 100 * combo.count;

    AX.Audio.sfx.boom(false);
    shake = Math.min(1, shake + 0.4);
    flash(dr.pos, [1.0, 0.6, 0.25], 9, 0.5);
    markHit(true);

    for (var i = 0; i < 26; i++) {
      var hot = Math.random() < 0.4;
      R.particles.spawn({
        x: dr.pos[0], y: dr.pos[1], z: dr.pos[2],
        vx: (Math.random() - 0.5) * 11, vy: Math.random() * 8 - 1, vz: (Math.random() - 0.5) * 11,
        size: 0.06 + Math.random() * 0.1,
        life: 0.5 + Math.random() * 0.7,
        r: hot ? 1.6 : 0.4, g: hot ? 0.9 : 0.45, b: hot ? 0.3 : 0.5,
        gravity: -16
      });
    }
  }

  var eyeTmp = [0, 0, 0];
  function playerEye() {
    eyeTmp[0] = player.pos[0];
    eyeTmp[1] = player.pos[1] + player.eye;
    eyeTmp[2] = player.pos[2];
    return eyeTmp;
  }

  function updateDrone(dr, dt) {
    if (dr.dead) return;
    dr.stateT += dt;
    dr.shieldFlash = Math.max(0, dr.shieldFlash - dt * 5);
    dr.hitFlash = Math.max(0, dr.hitFlash - dt * 6);
    dr.bobPhase += dt * 2.4;

    var eye = playerEye();
    var dx = eye[0] - dr.pos[0], dy = eye[1] + 0.1 - dr.pos[1], dz = eye[2] - dr.pos[2];
    var dist = Math.hypot(dx, dy, dz);
    var los = hasLOS(dr.pos, eye);

    if (dr.state === 'spawn') {
      dr.scale = Math.min(1, dr.scale + dt * 2.4);
      if (dr.scale >= 1) dr.state = 'hunt';
      return;
    }

    var desired = [0, 0, 0];

    if (los && dist < 34) {
      /* 교전 — 수평 8~13m를 유지하며 옆으로 돌고, 고도는 눈높이 +2m를 지킵니다. */
      var hdist = Math.hypot(dx, dz) || 0.001;
      var want = 10.5;
      var toward = (hdist - want) * 0.5;
      var nx = dx / hdist, nz = dz / hdist;
      var sx = -nz * dr.strafeDir, sz = nx * dr.strafeDir;
      desired[0] = nx * toward + sx * 2.4;
      desired[1] = (eye[1] + 1.2 + Math.sin(dr.bobPhase) * 0.6 - dr.pos[1]) * 1.4;
      desired[2] = nz * toward + sz * 2.4;
      if (dr.stateT > 2.4) { dr.strafeDir *= -1; dr.stateT = 0; }

      dr.yaw = Math.atan2(dx, -dz);

      /* 사격 */
      dr.fireCd -= dt;
      if (dr.fireCd <= 0 && dist > 3) {
        dr.fireCd = 1.1 + Math.random() * 1.3;
        fireBolt(dr, eye, dist);
      }
    } else {
      /* 경로 그래프를 따라 플레이어 쪽으로 이동 */
      var myNode = nearestNode(dr.pos[0], dr.pos[2]);
      var pNode = nearestNode(eye[0], eye[2]);
      var tgt = navNodes[nextNode(myNode, pNode)];
      var tx = tgt.x - dr.pos[0], tz = tgt.z - dr.pos[2];
      var td = Math.hypot(tx, tz) || 1;
      desired[0] = (tx / td) * 3.4;
      desired[1] = (6.5 + Math.sin(dr.bobPhase) * 0.6 - dr.pos[1]) * 0.8;
      desired[2] = (tz / td) * 3.4;
      dr.yaw = Math.atan2(desired[0], -desired[2]);
    }

    /* 벽 회피 — 진행 방향이 막히면 위로 뜹니다. */
    var vl = Math.hypot(dr.vel[0], dr.vel[2]);
    if (vl > 0.5) {
      var ahead = raycastMap(dr.pos, [dr.vel[0] / vl, 0, dr.vel[2] / vl], 1.4, true);
      if (ahead) { desired[1] += 2.4; desired[0] *= 0.3; desired[2] *= 0.3; }
    }

    /* 드론끼리 밀어내기 */
    for (var i = 0; i < drones.length; i++) {
      var o = drones[i];
      if (o === dr || o.dead) continue;
      var ox = dr.pos[0] - o.pos[0], oy = dr.pos[1] - o.pos[1], oz = dr.pos[2] - o.pos[2];
      var od = Math.hypot(ox, oy, oz);
      if (od < 1.8 && od > 0.001) {
        desired[0] += (ox / od) * (1.8 - od) * 3;
        desired[1] += (oy / od) * (1.8 - od) * 1.5;
        desired[2] += (oz / od) * (1.8 - od) * 3;
      }
    }

    dr.vel[0] += (desired[0] - dr.vel[0]) * Math.min(1, dt * 2.6);
    dr.vel[1] += (desired[1] - dr.vel[1]) * Math.min(1, dt * 2.6);
    dr.vel[2] += (desired[2] - dr.vel[2]) * Math.min(1, dt * 2.6);

    var nxp = dr.pos[0] + dr.vel[0] * dt;
    var nyp = dr.pos[1] + dr.vel[1] * dt;
    var nzp = dr.pos[2] + dr.vel[2] * dt;
    /* 축별 복셀 충돌 */
    if (!isSolid(Math.floor(nxp), Math.floor(dr.pos[1]), Math.floor(dr.pos[2]))) dr.pos[0] = nxp;
    else dr.vel[0] *= -0.3;
    if (!isSolid(Math.floor(dr.pos[0]), Math.floor(nyp), Math.floor(dr.pos[2]))) dr.pos[1] = nyp;
    else dr.vel[1] *= -0.3;
    if (!isSolid(Math.floor(dr.pos[0]), Math.floor(dr.pos[1]), Math.floor(nzp))) dr.pos[2] = nzp;
    else dr.vel[2] *= -0.3;

    dr.pos[1] = AX.clamp(dr.pos[1], FLOOR_Y + 2.2, CEIL_Y - 1.2);
  }

  /* ── 드론 탄환 ─────────────────────────────── */

  var bolts = [];

  function fireBolt(dr, target, dist) {
    var lead = 0.24 * dist / 14;
    var tx = target[0] + player.vel[0] * lead;
    var ty = target[1] + player.vel[1] * lead * 0.4;
    var tz = target[2] + player.vel[2] * lead;
    var dx = tx - dr.pos[0], dy = ty - dr.pos[1], dz = tz - dr.pos[2];
    var d = Math.hypot(dx, dy, dz) || 1;
    var spd = 17;
    /* 약간의 오차 */
    var err = 0.05;
    bolts.push({
      pos: [dr.pos[0], dr.pos[1] - 0.2, dr.pos[2]],
      vel: [dx / d * spd + (Math.random() - 0.5) * spd * err,
            dy / d * spd + (Math.random() - 0.5) * spd * err,
            dz / d * spd + (Math.random() - 0.5) * spd * err],
      ttl: 4
    });
    AX.Audio.sfx.enemyBolt();
  }

  function updateBolts(dt) {
    for (var i = bolts.length - 1; i >= 0; i--) {
      var b = bolts[i];
      b.ttl -= dt;
      if (b.ttl <= 0) { bolts.splice(i, 1); continue; }

      var nx = b.pos[0] + b.vel[0] * dt;
      var ny = b.pos[1] + b.vel[1] * dt;
      var nz = b.pos[2] + b.vel[2] * dt;

      /* 벽 충돌 */
      var bb = getBlock(Math.floor(nx), Math.floor(ny), Math.floor(nz));
      if (bb !== AIR && BLOCKS[bb].solid) {
        if (bb === GLASS) {
          breakBlock(Math.floor(nx), Math.floor(ny), Math.floor(nz));
          debris(nx, ny, nz, [0.6, 0.8, 1], 12);
          AX.Audio.sfx.blockBreak();
        } else {
          for (var s = 0; s < 4; s++) {
            R.particles.spawn({
              x: nx, y: ny, z: nz,
              vx: (Math.random() - 0.5) * 4, vy: Math.random() * 3, vz: (Math.random() - 0.5) * 4,
              size: 0.05, life: 0.25, r: 1.5, g: 0.5, b: 0.9, gravity: -10
            });
          }
        }
        bolts.splice(i, 1);
        continue;
      }

      /* 플레이어 피격 */
      var px = player.pos[0], py = player.pos[1] + player.height * 0.5, pz = player.pos[2];
      var ddx = nx - px, ddy = ny - py, ddz = nz - pz;
      if (ddx * ddx + ddy * ddy * 0.45 + ddz * ddz < 0.42) {
        damagePlayer(12, b.pos);
        bolts.splice(i, 1);
        continue;
      }

      b.pos[0] = nx; b.pos[1] = ny; b.pos[2] = nz;

      /* 트레일 파티클 */
      R.particles.spawn({
        x: nx, y: ny, z: nz,
        vx: 0, vy: 0, vz: 0,
        size: 0.16, life: 0.16, r: 1.7, g: 0.35, b: 1.1, gravity: 0, drag: 0
      });
    }
  }

  /* ══════════════════════════════════════════════════════════
     게임 흐름 — 웨이브
     ══════════════════════════════════════════════════════════ */

  var WAVES = [3, 4, 6, 8, 10];

  var game = {
    state: 'idle',       // idle → combat → intermission → done
    wave: 0,
    alive: 0,
    time: 0,
    interT: 0,
    score: 0,
    startTime: 0,
    stats: { shots: 0, hits: 0, kills: 0, taken: 0, bestCombo: 0 }
  };

  var combo = { count: 0, timer: 0 };

  function startWave(n) {
    game.wave = n;
    game.state = 'combat';
    var count = WAVES[n - 1];
    var hpScale = 1 + (n - 1) * 0.18;
    game.alive = count;

    /* 플레이어와 다른 방 위주로 뿌립니다. (?demo면 반대로 — 렌더 검증용) */
    var eye = playerEye();
    var demo = /demo/.test(location.search) ? -1 : 1;
    var pool = spawnPoints.slice().sort(function (a, b) {
      var da = (a.x - eye[0]) * (a.x - eye[0]) + (a.z - eye[2]) * (a.z - eye[2]);
      var db = (b.x - eye[0]) * (b.x - eye[0]) + (b.z - eye[2]) * (b.z - eye[2]);
      return (db - da) * demo;
    });
    for (var i = 0; i < count; i++) {
      (function (idx) {
        setTimeout(function () {
          if (game.state === 'combat') spawnDrone(pool[idx % pool.length], hpScale);
        }, idx * 700);
      })(i);
    }

    hud.waveBig.textContent = 'WAVE ' + n;
    hud.waveSub.textContent = '적기 ' + count + '대 접근 중';
    hud.banner.removeAttribute('data-show');
    void hud.banner.offsetWidth;          // 애니메이션 재시작
    hud.banner.setAttribute('data-show', '1');
    AX.Audio.sfx.waveStart();
  }

  function updateGame(dt) {
    game.time += dt;
    combo.timer -= dt;
    if (combo.timer <= 0) combo.count = 0;

    if (game.state === 'combat' && game.alive <= 0 && drones.every(function (d) { return d.dead; })) {
      if (game.wave >= WAVES.length) {
        endGame(true);
      } else {
        game.state = 'intermission';
        game.interT = 5;
        AX.Audio.sfx.waveClear();
        hud.waveBig.textContent = 'WAVE ' + game.wave + ' 클리어';
        hud.waveSub.textContent = '다음 웨이브 준비';
        hud.banner.removeAttribute('data-show');
        void hud.banner.offsetWidth;
        hud.banner.setAttribute('data-show', '1');
        /* 탄약 보급 */
        weapon.reserve = Math.min(360, weapon.reserve + 72);
      }
    }
    if (game.state === 'intermission') {
      game.interT -= dt;
      if (game.interT <= 0) startWave(game.wave + 1);
    }
  }

  function endGame(victory) {
    if (game.state === 'done') return;
    game.state = 'done';
    AX.Input.unlock();
    AX.Audio.ambient(false);
    if (victory) AX.Audio.sfx.waveClear(); else AX.Audio.sfx.boom(true);

    var acc = game.stats.shots > 0 ? Math.round(game.stats.hits / game.stats.shots * 100) : 0;
    var elapsed = Math.round(game.time - game.startTime);
    var mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    var ss = String(elapsed % 60).padStart(2, '0');

    setTimeout(function () {
      AX.UI.result({
        title: victory ? '정거장 방어 성공' : '전투 불능',
        lede: victory ? '다섯 웨이브를 모두 막아냈습니다.' : '드론에게 제압당했습니다. 다시 시도해 보십시오.',
        stats: [
          ['점수', game.score.toLocaleString('ko-KR')],
          ['처치', String(game.stats.kills)],
          ['명중률', acc + '%'],
          ['최고 연속', String(game.stats.bestCombo)],
          ['도달 웨이브', String(game.wave)],
          ['소요 시간', mm + ':' + ss]
        ],
        primary: { label: '다시 하기', onClick: function () { location.reload(); } }
      });
    }, victory ? 700 : 1100);
  }

  function markHit(kill) {
    hud.hitmark.removeAttribute('data-hit');
    void hud.hitmark.offsetWidth;
    if (kill) hud.hitmark.setAttribute('data-kill', '1');
    else hud.hitmark.removeAttribute('data-kill');
    hud.hitmark.setAttribute('data-hit', '1');
  }

  /* ══════════════════════════════════════════════════════════
     렌더 — 씬
     ══════════════════════════════════════════════════════════ */

  function renderScene(dt) {
    var gl = R.gl;
    var cam = R.camera;

    /* 하늘 */
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    AX.mat4.invert(R.tmpM, cam.viewProj);
    R.sh.sky.use()
      .set('uInvViewProj', R.tmpM)
      .set('uCamPos', cam.position)
      .set('uTime', game.time);
    R.fullscreen.draw();
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);

    /* 복셀 섹션 */
    var vox = R.sh.vox.use();
    vox.set('uViewProj', cam.viewProj)
      .set('uCamPos', cam.position)
      .set('uAmbient', AMBIENT)
      .set('uFogColor', FOG_COLOR)
      .set('uFogDensity', FOG_DENSITY);
    setLightUniforms(vox);
    vox.tex('uAtlas', R.atlas, 0, gl.TEXTURE_2D_ARRAY);

    var vis = [];
    for (var i = 0; i < sections.length; i++) {
      var s = sections[i];
      if (s.dirty) buildSection(gl, s);
      var x0 = s.sx * SEC, z0 = s.sz * SEC;
      if (!R.frustum.boxVisible(x0, 0, z0, x0 + SEC, MH, z0 + SEC)) continue;
      vis.push(s);
      if (s.mesh) {
        vox.set('uOrigin', s.origin);
        s.mesh.draw();
      }
    }

    /* 드론 */
    renderDrones();

    /* 파티클 */
    R.particles.draw(cam.viewProj, cam.right, cam.up);

    /* 빔 — 가산 블렌딩 */
    if (beams.length) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      var bs = R.sh.beam.use();
      bs.set('uViewProj', cam.viewProj);
      for (var bi = 0; bi < beams.length; bi++) {
        var b = beams[bi];
        beamMatrix(R.tmpM, b.from, b.to, 0.035);
        bs.set('uModel', R.tmpM);
        bs.set('uColor', b.color);
        bs.set('uAlpha', b.ttl / b.maxTtl);
        R.meshes.beam.draw();
      }
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    /* 유리 — 반투명, 마지막에 */
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    var gs = R.sh.glass.use();
    gs.set('uViewProj', cam.viewProj).set('uCamPos', cam.position);
    gs.tex('uAtlas', R.atlas, 0, gl.TEXTURE_2D_ARRAY);
    for (var gi = 0; gi < vis.length; gi++) {
      if (!vis[gi].glassMesh) continue;
      gs.set('uOrigin', vis[gi].origin);
      vis[gi].glassMesh.draw();
    }
    gl.enable(gl.CULL_FACE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    /* 뷰모델 */
    if (!player.dead) renderViewmodel();
  }

  /* from→to 빔의 모델 행렬 */
  function beamMatrix(out, from, to, width) {
    var dx = to[0] - from[0], dy = to[1] - from[1], dz = to[2] - from[2];
    var len = Math.hypot(dx, dy, dz) || 0.001;
    var d = [dx / len, dy / len, dz / len];
    var up = Math.abs(d[1]) > 0.94 ? [1, 0, 0] : [0, 1, 0];
    var a = [d[1] * up[2] - d[2] * up[1], d[2] * up[0] - d[0] * up[2], d[0] * up[1] - d[1] * up[0]];
    var al = Math.hypot(a[0], a[1], a[2]) || 1;
    a[0] /= al; a[1] /= al; a[2] /= al;
    var c = [d[1] * a[2] - d[2] * a[1], d[2] * a[0] - d[0] * a[2], d[0] * a[1] - d[1] * a[0]];
    out[0] = a[0] * width; out[1] = a[1] * width; out[2] = a[2] * width; out[3] = 0;
    out[4] = d[0] * len; out[5] = d[1] * len; out[6] = d[2] * len; out[7] = 0;
    out[8] = c[0] * width; out[9] = c[1] * width; out[10] = c[2] * width; out[11] = 0;
    out[12] = from[0]; out[13] = from[1]; out[14] = from[2]; out[15] = 1;
    return out;
  }

  function renderDrones() {
    var gl = R.gl;
    var prim = R.sh.prim.use();
    prim.set('uViewProj', R.camera.viewProj)
      .set('uCamPos', R.camera.position)
      .set('uAmbient', AMBIENT)
      .set('uFogColor', FOG_COLOR)
      .set('uFogDensity', FOG_DENSITY);
    setLightUniforms(prim);

    var m = R.tmpM, m2 = R.tmpM2;

    for (var i = 0; i < drones.length; i++) {
      var dr = drones[i];
      if (dr.dead) continue;
      var bob = Math.sin(dr.bobPhase) * 0.09;
      var sc = dr.scale;
      var pulse = 0.9 + Math.sin(game.time * 5 + dr.bobPhase) * 0.12;

      /* 본체 */
      AX.mat4.identity(m);
      AX.mat4.translate(m, m, [dr.pos[0], dr.pos[1] + bob, dr.pos[2]]);
      AX.mat4.rotateY(m, m, dr.yaw);
      AX.mat4.scale(m, m, [sc, sc * 0.78, sc]);
      var flashAmt = dr.hitFlash;
      drawPrim(R.meshes.sphere, m, {
        albedo: [0.16 + flashAmt, 0.19 + flashAmt, 0.24 + flashAmt],
        specPow: 60, specK: 0.8, rim: 0.2
      });

      /* 발광 링 */
      AX.mat4.identity(m2);
      AX.mat4.translate(m2, m2, [dr.pos[0], dr.pos[1] + bob, dr.pos[2]]);
      AX.mat4.rotateY(m2, m2, dr.yaw);
      AX.mat4.scale(m2, m2, [sc * 1.04, sc * 0.1, sc * 1.04]);
      drawPrim(R.meshes.cyl, m2, {
        albedo: [0.05, 0.05, 0.06],
        emissive: [0.15 * pulse, 0.7 * pulse, 1.1 * pulse],
        specPow: 20, specK: 0.2, rim: 0
      });

      /* 눈 */
      AX.mat4.identity(m2);
      AX.mat4.translate(m2, m2, [dr.pos[0], dr.pos[1] + bob + 0.05, dr.pos[2]]);
      AX.mat4.rotateY(m2, m2, dr.yaw);
      AX.mat4.translate(m2, m2, [0, 0, -0.42 * sc]);
      AX.mat4.scale(m2, m2, [0.16 * sc, 0.16 * sc, 0.1 * sc]);
      drawPrim(R.meshes.sphere, m2, {
        albedo: [0.05, 0.02, 0.02],
        emissive: [2.2, 0.35, 0.5],
        specPow: 10, specK: 0, rim: 0
      });

      /* 핀 3개 */
      for (var f = 0; f < 3; f++) {
        var ang = dr.yaw + f * (Math.PI * 2 / 3) + Math.PI / 3;
        AX.mat4.identity(m2);
        AX.mat4.translate(m2, m2, [dr.pos[0], dr.pos[1] + bob, dr.pos[2]]);
        AX.mat4.rotateY(m2, m2, ang);
        AX.mat4.translate(m2, m2, [0.5 * sc, 0.1 * sc, 0]);
        AX.mat4.rotateZ(m2, m2, -0.5);
        AX.mat4.scale(m2, m2, [0.34 * sc, 0.08 * sc, 0.1 * sc]);
        drawPrim(R.meshes.box, m2, {
          albedo: [0.14, 0.16, 0.2], specPow: 40, specK: 0.6, rim: 0.15
        });
      }
    }

    /* 실드 — 가산 블렌딩으로 마지막에 */
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.depthMask(false);
    var ss = R.sh.shield.use();
    ss.set('uViewProj', R.camera.viewProj).set('uCamPos', R.camera.position)
      .set('uTime', game.time);
    for (var si = 0; si < drones.length; si++) {
      var sd = drones[si];
      if (sd.dead || sd.shield <= 0) continue;
      var sb = Math.sin(sd.bobPhase) * 0.09;
      AX.mat4.identity(m);
      AX.mat4.translate(m, m, [sd.pos[0], sd.pos[1] + sb, sd.pos[2]]);
      AX.mat4.scale(m, m, [1.42 * sd.scale, 1.2 * sd.scale, 1.42 * sd.scale]);
      AX.mat3.normalFromMat4(R.tmpN, m);
      ss.set('uModel', m);
      ss.set('uNormalMat', R.tmpN);
      ss.set('uColor', [0.2, 0.75, 1.0]);
      ss.set('uCrack', 1 - sd.shield / sd.maxShield);
      ss.set('uFlash', sd.shieldFlash);
      R.meshes.sphere.draw();
    }
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  /* ── 뷰모델 — 펄스 라이플 ─────────────────── */

  function renderViewmodel() {
    var gl = R.gl;
    gl.clear(gl.DEPTH_BUFFER_BIT);

    var aspect = gl.axCanvas.width / gl.axCanvas.height;
    var proj = AX.mat4.perspective(R.tmpM3, 58 * Math.PI / 180, aspect, 0.01, 5);

    var kick = weapon.kick;
    var reload = weapon.reloading > 0
      ? Math.sin(Math.min(1, 1 - weapon.reloading / weapon.reloadTime) * Math.PI)
      : 0;
    var adsT = adsBlend;

    var bobX = Math.cos(player.bob) * 0.012 * (1 - adsT);
    var bobY = Math.abs(Math.sin(player.bob)) * 0.014 * (1 - adsT);

    var baseX = AX.lerp(0.24, 0.0, adsT);
    var baseY = AX.lerp(-0.22, -0.155, adsT);
    var baseZ = AX.lerp(-0.52, -0.4, adsT);

    var root = AX.mat4.identity(R.tmpM);
    AX.mat4.translate(root, root, [
      baseX + bobX,
      baseY + bobY - reload * 0.16,
      baseZ + kick * 0.07
    ]);
    AX.mat4.rotateX(root, root, kick * 0.06 - reload * 0.9);
    AX.mat4.rotateY(root, root, AX.lerp(-0.05, 0, adsT));
    AX.mat4.rotateZ(root, root, 0.05 + reload * 0.25);

    var prim = R.sh.prim.use();
    prim.set('uViewProj', proj)
      .set('uCamPos', [0, 0, 0])
      .set('uAmbient', [0.10, 0.12, 0.16])
      .set('uFogColor', FOG_COLOR)
      .set('uFogDensity', 0);
    setLightUniformsView(prim);

    var m = R.tmpM2;
    var heat = 0.6 + weapon.muzzle * 2.6;

    /* 몸통 — 어두운 건메탈 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, 0, -0.08]);
    AX.mat4.scale(m, m, [0.048, 0.07, 0.3]);
    drawPrim(R.meshes.box, m, { albedo: [0.045, 0.05, 0.065], specPow: 60, specK: 0.35, rim: 0.05 });

    /* 상단 레일 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, 0.048, -0.1]);
    AX.mat4.scale(m, m, [0.03, 0.022, 0.24]);
    drawPrim(R.meshes.box, m, { albedo: [0.022, 0.025, 0.032], specPow: 80, specK: 0.5, rim: 0.03 });

    /* 측면 발광 스트립 — 카메라 쪽 면 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [-0.026, 0.006, -0.1]);
    AX.mat4.scale(m, m, [0.004, 0.014, 0.2]);
    drawPrim(R.meshes.box, m, {
      albedo: [0.01, 0.01, 0.012],
      emissive: [0.08 * heat, 0.45 * heat, 0.8 * heat],
      specPow: 10, specK: 0, rim: 0
    });

    /* 총열 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, 0.014, -0.32]);
    AX.mat4.rotateX(m, m, Math.PI / 2);
    AX.mat4.scale(m, m, [0.026, 0.18, 0.026]);
    drawPrim(R.meshes.cyl, m, { albedo: [0.03, 0.034, 0.045], specPow: 90, specK: 0.8, rim: 0.04 });

    /* 총구 소염기 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, 0.014, -0.42]);
    AX.mat4.rotateX(m, m, Math.PI / 2);
    AX.mat4.scale(m, m, [0.036, 0.05, 0.036]);
    drawPrim(R.meshes.cyl, m, { albedo: [0.02, 0.022, 0.03], specPow: 60, specK: 0.5, rim: 0.03 });

    /* 발광 코일 — 총열 중간 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, 0.014, -0.26]);
    AX.mat4.rotateX(m, m, Math.PI / 2);
    AX.mat4.scale(m, m, [0.034, 0.045, 0.034]);
    drawPrim(R.meshes.cyl, m, {
      albedo: [0.02, 0.025, 0.035],
      emissive: [0.12 * heat, 0.55 * heat, 1.0 * heat],
      specPow: 10, specK: 0.1, rim: 0
    });

    /* 개머리·손잡이 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, -0.068, 0.015]);
    AX.mat4.rotateX(m, m, 0.34);
    AX.mat4.scale(m, m, [0.034, 0.1, 0.045]);
    drawPrim(R.meshes.box, m, { albedo: [0.035, 0.038, 0.05], specPow: 30, specK: 0.25, rim: 0.03 });

    /* 탄창 */
    AX.mat4.copy(m, root);
    AX.mat4.translate(m, m, [0, -0.062, -0.16]);
    AX.mat4.rotateX(m, m, -0.14);
    AX.mat4.scale(m, m, [0.03, 0.08, 0.05]);
    drawPrim(R.meshes.box, m, { albedo: [0.05, 0.055, 0.07], specPow: 40, specK: 0.3, rim: 0.03 });

    /* 총구 섬광 */
    if (weapon.muzzle > 0.05) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
      AX.mat4.copy(m, root);
      AX.mat4.translate(m, m, [0, 0.012, -0.46]);
      AX.mat4.scale(m, m, [0.09 * weapon.muzzle, 0.09 * weapon.muzzle, 0.09 * weapon.muzzle]);
      drawPrim(R.meshes.sphere, m, {
        albedo: [0, 0, 0],
        emissive: [1.2 * weapon.muzzle, 2.6 * weapon.muzzle, 3.4 * weapon.muzzle],
        specPow: 1, specK: 0, rim: 0
      });
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }
  }

  /* 뷰모델용 라이트 — 카메라 공간이라 고정 위치로 칩니다. */
  var vmLightPos = new Float32Array(MAX_LIGHTS * 3);
  var vmLightCol = new Float32Array(MAX_LIGHTS * 3);
  function setLightUniformsView(sh) {
    /* 키 라이트 — 위 약간 왼쪽에서 차갑게 */
    vmLightPos[0] = -0.25; vmLightPos[1] = 0.55; vmLightPos[2] = -0.15;
    vmLightCol[0] = 0.55; vmLightCol[1] = 0.65; vmLightCol[2] = 0.8;
    /* 필 라이트 — 오른쪽 아래에서 어둡게 */
    vmLightPos[3] = 0.5; vmLightPos[4] = -0.3; vmLightPos[5] = -0.3;
    vmLightCol[3] = 0.07; vmLightCol[4] = 0.09; vmLightCol[5] = 0.12;
    sh.set('uLightCount', 2);
    sh.set('uLightPos', vmLightPos);
    sh.set('uLightColor', vmLightCol);
  }
