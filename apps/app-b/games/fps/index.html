  var hudTick = 0;
  function updateHUD(dt) {
    /* 피격 비네트는 매 프레임 감쇠 */
    var op = parseFloat(hud.dmg.style.opacity || '0');
    if (op > 0.01) hud.dmg.style.opacity = String(op * Math.pow(0.03, dt));
    else if (op !== 0) hud.dmg.style.opacity = '0';

    hud.cross.style.setProperty('--gap',
      (5 + weapon.spread * 14 + (player.onGround ? 0 : 5)) + 'px');
    if (weapon.ads) document.body.setAttribute('data-ads', '1');
    else document.body.removeAttribute('data-ads');

    hudTick += dt;
    if (hudTick < 0.1) return;
    hudTick = 0;

    hud.shBar.style.width = (player.shield / player.maxShield * 100) + '%';
    hud.shNum.textContent = String(Math.ceil(player.shield));
    hud.hpBar.style.width = (player.hp / player.maxHp * 100) + '%';
    hud.hpNum.textContent = String(Math.ceil(player.hp));
    if (player.hp < 35) hud.hpWrap.setAttribute('data-low', '1');
    else hud.hpWrap.removeAttribute('data-low');

    hud.ammoMag.textContent = String(weapon.mag);
    if (weapon.mag <= 6) hud.ammoMag.setAttribute('data-low', '1');
    else hud.ammoMag.removeAttribute('data-low');
    hud.ammoRes.textContent = '/ ' + weapon.reserve;
    hud.ammoState.textContent = weapon.reloading > 0 ? 'RELOADING' : (weapon.ads ? 'AIMING' : '');

    hud.scWave.innerHTML = 'WAVE <b>' + game.wave + ' / ' + WAVES.length + '</b> · 남은 적 <b>' +
      drones.filter(function (d) { return !d.dead; }).length + '</b>';
    hud.scScore.innerHTML = 'SCORE <b>' + game.score.toLocaleString('ko-KR') + '</b>';
    hud.scCombo.textContent = combo.count >= 2 ? 'x' + combo.count + ' COMBO' : '';

    drawRadar();
    AX.UI.fps(loop.frameMs);

    /* ?demo — 헤드리스 검증에서 드론 상태를 밖에서 읽을 수 있게 합니다. */
    if (DEMO) {
      document.title = 't=' + game.time.toFixed(1) + ' st=' + game.state + ' n=' + drones.length +
        ' :: ' + (drones.map(function (d) {
          return (d.dead ? 'D' : d.state.charAt(0)) + ':' +
                 d.pos[0].toFixed(1) + ',' + d.pos[1].toFixed(1) + ',' + d.pos[2].toFixed(1);
        }).join(' | ') || 'none');
    }
  }

  function drawRadar() {
    var ctx = hud.radarCtx;
    var S = 256, C = S / 2, RANGE = 42;
    ctx.clearRect(0, 0, S, S);

    ctx.strokeStyle = 'rgba(0, 208, 255, 0.18)';
    ctx.lineWidth = 2;
    [0.33, 0.66, 0.98].forEach(function (r) {
      ctx.beginPath();
      ctx.arc(C, C, C * r, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.beginPath();
    ctx.moveTo(C, 10); ctx.lineTo(C, S - 10);
    ctx.moveTo(10, C); ctx.lineTo(S - 10, C);
    ctx.strokeStyle = 'rgba(0, 208, 255, 0.10)';
    ctx.stroke();

    /* 스윕 */
    var sweep = (game.time * 1.4) % (Math.PI * 2);
    var grd = ctx.createConicGradient ? null : null;
    ctx.save();
    ctx.translate(C, C);
    ctx.rotate(sweep);
    var lg = ctx.createLinearGradient(0, 0, C, 0);
    lg.addColorStop(0, 'rgba(0, 208, 255, 0.16)');
    lg.addColorStop(1, 'rgba(0, 208, 255, 0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, C - 4, -0.5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    var yaw = R.camera.yaw;
    var cy = Math.cos(-yaw), sy = Math.sin(-yaw);

    for (var i = 0; i < drones.length; i++) {
      var d = drones[i];
      if (d.dead) continue;
      var dx = d.pos[0] - player.pos[0], dz = d.pos[2] - player.pos[2];
      /* 카메라 헤딩 기준 회전 */
      var rx = dx * cy - dz * sy;
      var rz = dx * sy + dz * cy;
      var px = C + (rx / RANGE) * C;
      var pz = C + (rz / RANGE) * C;
      if (Math.hypot(px - C, pz - C) > C - 8) continue;
      ctx.fillStyle = '#ff4d6b';
      ctx.shadowColor = '#ff4d6b';
      ctx.shadowBlur = 7;
      ctx.beginPath();
      ctx.arc(px, pz, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    /* 플레이어 */
    ctx.fillStyle = '#d9faff';
    ctx.beginPath();
    ctx.moveTo(C, C - 7);
    ctx.lineTo(C + 5, C + 6);
    ctx.lineTo(C - 5, C + 6);
    ctx.closePath();
    ctx.fill();
  }

  /* ══════════════════════════════════════════════════════════
     부팅
     ══════════════════════════════════════════════════════════ */

  var loop = null;
  var started = false;
  var adsBlend = 0;
  var DEMO = /demo/.test(location.search);

  function boot() {
    var canvas = document.getElementById('gl');

    AX.UI.init({
      title: '제로 프론트',
      en: 'Zero Front · FPS',
      tint: '#00d0ff',
      lede: '버려진 궤도 정거장에 방어 드론이 깨어났습니다. 다섯 웨이브를 버텨내십시오. 유리창과 화물 상자는 실제로 부서집니다.',
      controls: [
        ['W A S D', '이동'],
        ['마우스', '시점 · 좌클릭 사격 · 우클릭 조준'],
        ['Shift', '대시 (재사용 2초)'],
        ['Space', '점프'],
        ['R', '재장전'],
        ['Esc', '일시정지']
      ],
      startLabel: '전투 시작',
      onStart: function () {
        AX.Audio.resume();
        AX.Audio.ambient(true, 44);
        AX.Input.lock();
        loop.setPaused(false);
        if (!started) {
          started = true;
          game.startTime = game.time;
          startWave(1);
        }
      },
      onPause: function () {
        AX.Input.unlock();
        loop.setPaused(true);
      },
      onResume: function () {
        AX.Audio.resume();
        AX.Input.lock();
        loop.setPaused(false);
      }
    });

    try {
      initRenderer(canvas);
    } catch (err) {
      AX.UI.error(err);
      return;
    }

    AX.Input.init(canvas, { pointerLock: true });
    AX.Input.onLockChange(function (locked) {
      AX.UI.setLocked(locked);
      if (!locked && started && game.state !== 'done' && AX.UI.current === null) {
        AX.UI.showPause();
      }
    });

    generateStation();
    initSections();
    buildHUD();

    /* 초기 섹션 빌드 — 로딩 화면 동안 처리 */
    AX.UI.loading(0.2, '정거장 구조 생성');
    var buildIdx = 0;
    (function preBuild() {
      var t0 = performance.now();
      while (buildIdx < sections.length && performance.now() - t0 < 14) {
        buildSection(R.gl, sections[buildIdx]);
        buildIdx++;
      }
      AX.UI.loading(0.2 + 0.78 * (buildIdx / sections.length),
                    '섹션 메시 ' + buildIdx + ' / ' + sections.length);
      if (buildIdx < sections.length) { setTimeout(preBuild, 0); return; }
      AX.UI.loading(1, '준비 완료');
      if (/autostart/.test(location.search)) {
        setTimeout(function () { AX.UI.start(); }, 100);
      } else {
        setTimeout(function () { AX.UI.showStart(); }, 120);
      }
    })();

    if (/demo/.test(location.search)) {
      /* 렌더 검증용 — 스폰 코너를 바라봅니다. */
      R.camera.yaw = -Math.PI * 0.25;
      R.camera.pitch = 0.3;
    } else {
      R.camera.yaw = Math.PI * 0.25;
      R.camera.pitch = -0.06;
    }

    resize(true);

    var simStep = function (dt) {
      if (!started || game.state === 'done') return;
      updatePlayer(dt);
      for (var i = 0; i < drones.length; i++) updateDrone(drones[i], dt);
      updateBolts(dt);
      R.particles.update(dt, function (x, y, z) {
        return isSolid(Math.floor(x), Math.floor(y), Math.floor(z));
      });
    };

    loop = new AX.Loop({
      step: 1 / 120,
      update: simStep,
      render: function (dt) {
        /* ?demo — 헤드리스는 rAF가 드물어 시뮬레이션이 멈춰 보입니다.
           교전 장면 검증을 위해 초반을 빨리 감습니다. */
        if (DEMO && started && game.time < 5 && game.state !== 'done') {
          for (var ff = 0; ff < 90; ff++) { simStep(1 / 120); game.time += 1 / 120; }
        }
        resize(false);
        var gl = R.gl;
        var cam = R.camera;

        if (started && AX.Input.locked && !player.dead) {
          var sens = weapon.ads ? AX.Input.sensitivity * 0.55 : AX.Input.sensitivity;
          cam.look(AX.Input.mouse.dx, AX.Input.mouse.dy, sens);
        }

        if (started && game.state !== 'done') {
          updateWeapon(dt);
          updateGame(dt);
        }

        /* 카메라 배치 + 흔들림 */
        shake = Math.max(0, shake - dt * 2.2);
        adsBlend += ((weapon.ads ? 1 : 0) - adsBlend) * Math.min(1, dt * 11);
        fovKick = Math.max(0, fovKick - dt * 3);

        var shakeAmt = AX.reduceMotion ? 0 : shake * 0.05;
        var bobY = Math.sin(player.bob * 2) * 0.035 * (1 - adsBlend);
        AX.vec3.set(cam.position,
          player.pos[0] + (Math.random() - 0.5) * shakeAmt,
          player.pos[1] + player.eye + bobY + (Math.random() - 0.5) * shakeAmt,
          player.pos[2] + (Math.random() - 0.5) * shakeAmt);
        cam.fov = (70 - adsBlend * 16 + fovKick * 5) * Math.PI / 180;
        cam.far = 260;
        cam.update(gl.axCanvas.width / gl.axCanvas.height);
        R.frustum.fromMatrix(cam.viewProj);

        gatherLights(dt);

        R.post.begin();
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        renderScene(dt);
        R.post.end(dt);

        updateHUD(dt);
      }
    });
    loop.setPaused(false);
    loop.start();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>
