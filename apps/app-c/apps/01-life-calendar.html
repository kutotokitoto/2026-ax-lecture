<!doctype html>
<!--
  01 · 인생 달력 — app-c "인터랙티브 아트" 데모 1/5
  다크 단일 룩 고정: 저장소 규칙 4의 의도적 예외(프로젝터 대비). prefers-color-scheme 분기 없음.
  단일 파일 완결(외부 요청 0건), file:// 더블클릭이 기준 환경입니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>01 · 인생 달력 — 인터랙티브 아트</title>
<style>
:root{
  --bg0:#05060d; --bg1:#0c0f1a; --line:rgba(255,255,255,.10);
  --text:#edf1ff; --text-soft:#9aa4c2;
  --c1:#ffc94d; /* 01 인생달력 시그니처 — 골드(시간) */
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 50% 38%, var(--bg1), var(--bg0) 75%) var(--bg0);
  color:var(--text); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
#app{display:flex;flex-direction:column;height:100vh}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;flex:0 0 auto}
.titlebox{display:flex;align-items:baseline;gap:12px;min-width:0}
.title{font-size:17px;font-weight:700;color:var(--c1);letter-spacing:.04em;white-space:nowrap;
  text-shadow:0 0 18px rgba(255,201,77,.35);transition:opacity .5s}
.sub{font-size:12.5px;color:var(--text-soft);white-space:nowrap;transition:opacity .5s}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;transition:opacity .5s}
button,input[type=date]{
  font:inherit;font-size:13px;color:var(--text);
  background:#10141f;border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;cursor:pointer;transition:border-color .15s,color .15s;
}
button:hover,input[type=date]:hover{border-color:rgba(255,201,77,.55)}
button:focus-visible,input[type=date]:focus-visible{outline:1px solid var(--c1);outline-offset:1px}
.preset.active{border-color:var(--c1);color:var(--c1)}
#btnToggle{min-width:88px}
input[type=date]{cursor:auto}

#stage{position:relative;flex:1 1 auto;min-height:0}
#grid{position:absolute;left:0;top:0;display:block}

footer{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;
  padding:0 20px 14px;min-height:112px}
.hub{justify-self:start;color:var(--text-soft);text-decoration:none;font-size:14px;padding:6px 4px;
  transition:color .15s,opacity .5s}
.hub:hover{color:var(--c1)}
.stats{display:flex;flex-direction:column;align-items:center;gap:7px}
.statrow{display:flex;gap:36px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .lbl{font-size:12px;color:var(--text-soft);letter-spacing:.06em}
.stat .num{font-size:24px;font-weight:700;color:var(--c1);font-variant-numeric:tabular-nums;
  text-shadow:0 0 16px rgba(255,201,77,.3)}
#phrase{min-height:21px;font-size:14px;color:var(--text-soft);opacity:0;transition:opacity .45s}
#phrase.vis{opacity:1}
.badge{justify-self:end;display:none;font-size:12px;color:var(--text-soft);background:#10141f;
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  font-variant-numeric:tabular-nums;transition:opacity .5s}
.badge.show{display:block}

/* 마우스 유휴 시 UI 페이드아웃(통계는 연출의 일부라 유지) */
body.idle .controls,body.idle .hub,body.idle .badge{opacity:0;pointer-events:none}
body.idle .title,body.idle .sub{opacity:.55}

#tip{position:fixed;z-index:30;pointer-events:none;white-space:nowrap;
  background:rgba(12,15,26,.94);border:1px solid rgba(255,201,77,.4);border-radius:8px;
  padding:7px 10px;font-size:12.5px;line-height:1.5;opacity:0;transition:opacity .12s}
#tip.vis{opacity:1}
#tip .t1{color:var(--text);font-weight:600}
#tip .t2{color:var(--text-soft)}

#toast,#hint{position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  background:rgba(16,20,31,.94);border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;font-size:13.5px;color:var(--text);opacity:0;pointer-events:none;transition:opacity .4s}
#toast{bottom:132px}
#hint{bottom:176px;border-color:rgba(255,201,77,.45)}
#toast.show,#hint.show{opacity:1}

#help{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(5,6,13,.74)}
#help.open{display:flex}
.helpcard{background:var(--bg1);border:1px solid var(--line);border-radius:14px;
  padding:26px 30px;min-width:320px;max-width:92vw}
.helpcard h2{font-size:16px;color:var(--c1);margin-bottom:14px}
.helpcard table{border-collapse:collapse;font-size:13.5px}
.helpcard td{padding:5px 8px;color:var(--text-soft)}
.helpcard td:first-child{color:var(--text);padding-right:16px}
kbd{display:inline-block;background:#1a2030;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:1px 8px;font:inherit;font-size:12.5px;color:var(--text)}
.helpcard .close{margin-top:16px;font-size:12px;color:var(--text-soft)}

@media (max-width:880px){
  .sub{display:none}
  .statrow{gap:20px}
  .stat .num{font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titlebox">
      <h1 class="title">01 · 인생 달력</h1>
      <span class="sub">한 칸 = 일주일 · 90년 = 4,680칸</span>
    </div>
    <div class="controls">
      <button type="button" class="preset" data-k="0">1975년생</button>
      <button type="button" class="preset" data-k="1">1990년생</button>
      <button type="button" class="preset" data-k="2">2005년생</button>
      <input type="date" id="birth" min="1936-01-01" aria-label="생일 입력">
      <button type="button" id="btnToggle">정지</button>
    </div>
  </header>

  <div id="stage"><canvas id="grid"></canvas></div>

  <footer>
    <a class="hub" href="../index.html">← 허브</a>
    <div class="stats">
      <div class="statrow">
        <div class="stat"><span class="lbl">살아온 주</span><span class="num" id="stLived">0</span></div>
        <div class="stat"><span class="lbl">남은 주</span><span class="num" id="stLeft">4,680</span></div>
        <div class="stat"><span class="lbl">진행률</span><span class="num" id="stPct">0.0%</span></div>
      </div>
      <div id="phrase"></div>
    </div>
    <div class="badge" id="badge">-- fps · 높음</div>
  </footer>
</div>

<div id="tip"></div>
<div id="hint"></div>
<div id="toast"></div>

<div id="help">
  <div class="helpcard">
    <h2>도움말 — 인생 달력</h2>
    <table>
      <tr><td><kbd>Space</kbd></td><td>재생 / 정지 (끝난 뒤에는 다시 재생)</td></tr>
      <tr><td><kbd>R</kbd></td><td>처음부터 다시 재생</td></tr>
      <tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>1975 / 1990 / 2005년생 프리셋</td></tr>
      <tr><td><kbd>F</kbd></td><td>전체화면</td></tr>
      <tr><td><kbd>H</kbd></td><td>도움말 열기 / 닫기</td></tr>
      <tr><td><kbd>P</kbd></td><td>FPS·품질 배지 표시</td></tr>
      <tr><td><kbd>Q</kbd></td><td>품질 단계 수동 변경</td></tr>
      <tr><td>마우스 올리기</td><td>그 주가 언제인지 툴팁으로 표시</td></tr>
    </table>
    <div class="close">바깥을 클릭하거나 H · ESC 키로 닫습니다</div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ===== 상수 ===== */
var COLS = 90, ROWS = 52, TOTAL = COLS * ROWS;            // 가로 90년 × 세로 52주 = 4,680칸
var PRESETS = ['1975-03-21', '1990-06-15', '2005-09-01']; // 프리셋 3세대(연도만 플랜 지정, 일자는 임의)
var TIER_NAMES = ['높음', '중간', '낮음'];
var LS_TIER = 'appc01.tier', LS_SEEN = 'appc01.seen';
var GLOW_LIFE = 650, POP_LIFE = 240, RIPPLE_LIFE = 900, PULSE_MS = 1600;
var FILL_SHADES = ['#ffd977', '#ffc94d', '#f3b93c', '#e7ab2c']; // 셀 질감용 골드 4단
var FONT_STACK = 'Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif';
var BANDS = [ // 인생 구간(세로 밴드, 나이 경계)
  { from: 0,  to: 13, name: '유년기',   tint: '#4da3ff' },
  { from: 13, to: 19, name: '청소년기', tint: '#3fd3ff' },
  { from: 19, to: 35, name: '청년기',   tint: '#7cff4f' },
  { from: 35, to: 60, name: '중년기',   tint: '#ffc94d' },
  { from: 60, to: 90, name: '노년기',   tint: '#ff8a3d' }
];

/* ===== DOM ===== */
var stage = document.getElementById('stage');
var cv = document.getElementById('grid');
var ctx = cv.getContext('2d');
var tipEl = document.getElementById('tip');
var toastEl = document.getElementById('toast');
var hintEl = document.getElementById('hint');
var helpEl = document.getElementById('help');
var badgeEl = document.getElementById('badge');
var phraseEl = document.getElementById('phrase');
var stLived = document.getElementById('stLived');
var stLeft = document.getElementById('stLeft');
var stPct = document.getElementById('stPct');
var birthInput = document.getElementById('birth');
var btnToggle = document.getElementById('btnToggle');
var presetBtns = Array.prototype.slice.call(document.querySelectorAll('.preset'));

/* ===== 상태 ===== */
var rm = false; // prefers-reduced-motion: 자동 연출(채움 애니·펄스·문구 순환)만 정지
try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e0) {}

var birthStr = '', bY = 1990, bM = 6, bD = 15;
var pastWeeks = 0, fillTotal = 0, curIdx = 0;
var filledCount = 0, animElapsed = 0, animDur = 0;
var playing = false, paused = false, landed = false, landT = 0;

var tier = 0, glowMax = 30;
var dpr = 1, W = 0, H = 0, unitPx = 14, cellS = 11, gx = 0, gy = 0, gridW = 0, gridH = 0;

/* 레이어: L0 빈 격자+밴드(베이크) / L1 채움 누적 / 글로우 스프라이트 */
var baseCv = document.createElement('canvas'), baseCtx = baseCv.getContext('2d');
var fillCv = document.createElement('canvas'), fillCtx = fillCv.getContext('2d');
var glowCv = null;

/* 최근 채움 링버퍼(64) — 셀 객체를 만들지 않는다 */
var recentCell = new Int32Array(64), recentTime = new Float64Array(64), recentPos = 0;
recentCell.fill(-1);

var phrases = [], phraseIdx = 0, phraseTimer = 0, phraseShowTimer = 0;
var toastTimer = 0, hintShown = false, idleTimer = 0;
var lastTs = 0, fpsFrames = 0, fpsTime = 0, fpsVal = 0;
var qSamples = [], qWarmUntil = 0, qActive = true;

/* ===== 범용 헬퍼 ===== */
function clampNum(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function easeCubic(p) { // easeInOutCubic
  p = clampNum(p, 0, 1);
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}
function fmtInt(n) { return n.toLocaleString('ko-KR'); }
function fmt2(n) { return n < 10 ? '0' + n : '' + n; }
function median(arr) {
  var s = arr.slice().sort(function (a, b) { return a - b; });
  return s[(s.length / 2) | 0];
}
function todayStr() {
  var n = new Date();
  return n.getFullYear() + '-' + fmt2(n.getMonth() + 1) + '-' + fmt2(n.getDate());
}
function readStore(k) { try { return window.localStorage.getItem(k); } catch (e1) { return null; } }
function writeStore(k, v) { try { window.localStorage.setItem(k, v); } catch (e2) {} }

/* ===== 날짜 계산 — 로컬 자정 기준 일수차 → floor(/7) 단일 경로 (UTC 파싱 금지) ===== */
function weeksSinceBirth(str) {
  var mres = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
  if (!mres) return null;
  var y = +mres[1], mo = +mres[2], d = +mres[3];
  var bdate = new Date(y, mo - 1, d); // 로컬 자정
  if (bdate.getFullYear() !== y || bdate.getMonth() !== mo - 1 || bdate.getDate() !== d) return null;
  var nowD = new Date();
  var t0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate()); // 오늘 로컬 자정
  var days = Math.round((t0.getTime() - bdate.getTime()) / 86400000); // DST 1시간 오차는 round로 흡수
  return Math.floor(days / 7); // 미래면 음수
}

/* ===== 메트릭·베이크 — 디바이스 픽셀 정수 정렬(dpr 상한 2) ===== */
function applyMetrics() {
  var rect = stage.getBoundingClientRect();
  dpr = tier >= 1 ? 1 : Math.min(window.devicePixelRatio || 1, 2); // 하향 1단계: dpr 1 고정
  W = Math.max(2, Math.round(rect.width * dpr));
  H = Math.max(2, Math.round(rect.height * dpr));
  cv.width = W; cv.height = H;
  cv.style.width = (W / dpr) + 'px';  // 버퍼:CSS 1:1 매핑 → 셀 번짐 차단
  cv.style.height = (H / dpr) + 'px';
  var padX = Math.round(20 * dpr);
  var padTop = Math.round(34 * dpr);  // 밴드 라벨 자리
  var padBot = Math.round(46 * dpr);  // 나이 눈금 + '지금' 라벨 자리
  var availW = Math.max(COLS, W - padX * 2);
  var availH = Math.max(ROWS, H - padTop - padBot);
  unitPx = Math.max(4, Math.floor(Math.min(availW / COLS, availH / ROWS)));
  var gap = unitPx >= 9 ? Math.max(1, Math.round(unitPx * 0.2)) : 1; // 소형 화면 plan B: gap 1px
  cellS = Math.max(2, unitPx - gap);
  gridW = unitPx * COLS - gap;
  gridH = unitPx * ROWS - gap;
  gx = Math.round((W - gridW) / 2);
  gy = padTop + Math.round((availH - gridH) / 2);
  bakeBase();
  rebuildFill();
}

function cellPos(i) { // 색인→좌표: col=floor(i/52), row=i%52
  var col = (i / ROWS) | 0;
  return { x: gx + col * unitPx, y: gy + (i % ROWS) * unitPx };
}

function bakeBase() { // L0: 빈 격자 + 구간 밴드 + 라벨 + 나이 눈금 (1회 베이크)
  baseCv.width = W; baseCv.height = H;
  var b = baseCtx, i, p;
  b.fillStyle = 'rgba(255,255,255,0.075)';
  for (i = 0; i < TOTAL; i++) {
    p = cellPos(i);
    b.fillRect(p.x, p.y, cellS, cellS);
  }
  var fpx = Math.max(9, Math.round(11 * dpr));
  b.textAlign = 'center';
  b.textBaseline = 'alphabetic';
  for (i = 0; i < BANDS.length; i++) {
    var bandDef = BANDS[i];
    var x0 = gx + bandDef.from * unitPx;
    var x1 = gx + bandDef.to * unitPx - (unitPx - cellS);
    b.globalAlpha = 0.08; // 플랜 지정 알파
    b.fillStyle = bandDef.tint;
    b.fillRect(x0, gy, x1 - x0, gridH);
    b.globalAlpha = 1;
    b.fillStyle = 'rgba(154,164,194,0.9)';
    b.font = '600 ' + fpx + 'px ' + FONT_STACK;
    b.fillText(bandDef.name, (x0 + x1) / 2, gy - Math.round(8 * dpr));
  }
  b.fillStyle = 'rgba(154,164,194,0.75)';
  b.font = fpx + 'px ' + FONT_STACK;
  for (i = 0; i <= COLS; i += 10) { // 나이 눈금(10년 단위)
    var tx = gx + i * unitPx;
    b.fillRect(tx, gy + gridH + Math.round(4 * dpr), Math.max(1, Math.round(dpr)), Math.round(5 * dpr));
    b.fillText(String(i), tx, gy + gridH + Math.round(20 * dpr));
  }
}

function drawFillCell(i) { // L1에 셀 1개 누적(고정 해시로 골드 4단 질감)
  var p = cellPos(i);
  fillCtx.fillStyle = FILL_SHADES[(Math.imul(i + 1, 2654435761) >>> 0) % FILL_SHADES.length];
  fillCtx.fillRect(p.x, p.y, cellS, cellS);
}

function rebuildFill() { // 리사이즈·티어 변경 시 진행 상태 유지 재구축
  fillCv.width = W; fillCv.height = H;
  for (var i = 0; i < filledCount; i++) drawFillCell(i);
}

function makeGlowSprite() { // 글로우 스프라이트 1장 프리렌더
  glowCv = document.createElement('canvas');
  glowCv.width = 64; glowCv.height = 64;
  var g = glowCv.getContext('2d');
  var rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,201,77,0.85)');
  rg.addColorStop(0.4, 'rgba(255,201,77,0.28)');
  rg.addColorStop(1, 'rgba(255,201,77,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 64, 64);
}

/* ===== 채움 진행 ===== */
function advanceFill(target, stampT) {
  if (target > fillTotal) target = fillTotal;
  while (filledCount < target) {
    drawFillCell(filledCount);
    if (stampT > 0) { // 글로우·팝용 최근 채움 기록
      recentCell[recentPos] = filledCount;
      recentTime[recentPos] = stampT;
      recentPos = (recentPos + 1) % 64;
    }
    filledCount++;
  }
}

function resetAnim() {
  filledCount = 0; animElapsed = 0;
  animDur = fillTotal > 0 ? clampNum(fillTotal / 300, 4, 8) * 1000 : 0; // T = clamp(주/300, 4, 8)초
  playing = false; paused = false; landed = false;
  recentCell.fill(-1); recentPos = 0;
  fillCtx.clearRect(0, 0, W, H);
  stopPhrases();
  updateStats(0);
  refreshToggle();
}

function startPlay() {
  if (fillTotal <= 0) { land(); return; }
  playing = true; paused = false;
  refreshToggle();
}

function finishInstant() { // reduced-motion: 연출 없이 즉시 완성
  advanceFill(fillTotal, 0);
  land();
}

function land() { // 착지: 파문 1회 + 1.6초 펄스 시작
  advanceFill(fillTotal, 0);
  playing = false; paused = false; landed = true;
  landT = performance.now();
  updateStats(fillTotal);
  buildPhrases();
  refreshToggle();
}

function replay() {
  resetAnim();
  if (rm) finishInstant(); else startPlay();
}

/* ===== 생일 설정 ===== */
function setBirth(str) {
  var wk = weeksSinceBirth(str);
  if (wk === null) { showToast('날짜 형식이 올바르지 않습니다'); return; }
  if (wk < 0) { showToast('미래 날짜는 사용할 수 없습니다'); wk = 0; }
  else if (wk > TOTAL) showToast('90년 범위를 넘는 부분은 표시되지 않습니다');
  birthStr = str;
  var seg = str.split('-');
  bY = +seg[0]; bM = +seg[1]; bD = +seg[2];
  pastWeeks = wk;
  fillTotal = Math.min(wk, TOTAL);
  curIdx = Math.min(wk, TOTAL - 1);
  if (birthInput.value !== str) birthInput.value = str;
  var pi = PRESETS.indexOf(str);
  for (var k = 0; k < presetBtns.length; k++) presetBtns[k].classList.toggle('active', k === pi);
  replay();
}

/* ===== 통계·감정 문구 ===== */
function updateStats(n) { // 채움과 동기 카운트업
  stLived.textContent = fmtInt(n);
  stLeft.textContent = fmtInt(TOTAL - n);
  stPct.textContent = (n / TOTAL * 100).toFixed(1) + '%';
}

function buildPhrases() {
  var remW = TOTAL - fillTotal;
  if (remW <= 0) {
    phrases = ['90년의 달력을 모두 채웠습니다 — 여기서부터는 보너스입니다'];
  } else {
    var remY = Math.max(1, Math.round(remW / 52));
    phrases = [
      '여름이 앞으로 약 ' + fmtInt(remY) + '번 남았습니다',
      '보름달을 약 ' + fmtInt(Math.round(remW * 7 / 29.53)) + '번 더 볼 수 있습니다',
      '주말이 약 ' + fmtInt(remW) + '번 남았습니다'
    ];
  }
  phraseIdx = 0;
  setPhrase(phrases[0]);
  if (!rm && phrases.length > 1) { // 자동 로테이션은 reduced-motion 시 정지
    phraseTimer = window.setInterval(function () {
      if (document.hidden) return;
      phraseIdx = (phraseIdx + 1) % phrases.length;
      setPhrase(phrases[phraseIdx]);
    }, 5200);
  }
}
function stopPhrases() {
  if (phraseTimer) { clearInterval(phraseTimer); phraseTimer = 0; }
  if (phraseShowTimer) { clearTimeout(phraseShowTimer); phraseShowTimer = 0; }
  phraseEl.classList.remove('vis');
}
function setPhrase(txt) {
  phraseEl.classList.remove('vis');
  if (phraseShowTimer) clearTimeout(phraseShowTimer);
  phraseShowTimer = window.setTimeout(function () {
    phraseShowTimer = 0;
    phraseEl.textContent = txt;
    phraseEl.classList.add('vis');
  }, 240);
}

/* ===== 프레임 루프 ===== */
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(100, ts - lastTs); // 탭 복귀 점프 방지
  lastTs = ts;
  fpsTick(dt);
  qualityTick(ts, dt);
  if (playing && !paused) {
    animElapsed += dt;
    if (animElapsed >= animDur) {
      land();
    } else {
      var target = Math.floor(easeCubic(animElapsed / animDur) * fillTotal);
      if (target > filledCount) {
        advanceFill(target, ts);
        updateStats(Math.min(target, fillTotal));
      }
    }
  }
  drawFrame(ts);
}

function drawFrame(now) { // 합성: L0 + L1 + 이펙트
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(baseCv, 0, 0);
  ctx.drawImage(fillCv, 0, 0);
  drawGuide();
  drawRecent(now);
  if (landed) {
    drawRipple(now);
    drawPulse(now);
  }
}

function drawGuide() { // '지금' 세로 가이드
  var col = (curIdx / ROWS) | 0;
  var x = gx + col * unitPx + (cellS >> 1);
  ctx.fillStyle = 'rgba(255,201,77,0.28)';
  ctx.fillRect(x, gy - Math.round(5 * dpr), Math.max(1, Math.round(dpr)), gridH + Math.round(10 * dpr));
  var fpx = Math.max(9, Math.round(11 * dpr));
  ctx.font = '700 ' + fpx + 'px ' + FONT_STACK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,201,77,0.95)';
  ctx.fillText('지금', x, gy + gridH + Math.round(38 * dpr));
}

function drawRecent(now) { // 최근 채움 글로우 + 팝 (하향 2단계·reduced-motion 시 오프)
  if (rm || tier >= 2) return;
  var shown = 0, k, slot, ci, age;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (k = 0; k < 64; k++) {
    slot = ((recentPos - 1 - k) % 64 + 64) % 64;
    ci = recentCell[slot];
    if (ci < 0) break;             // 링은 최신순 → 빈 슬롯이면 종료
    age = now - recentTime[slot];
    if (age > GLOW_LIFE) break;    // 시간순 → 수명 지난 뒤는 전부 지난 것
    if (shown < glowMax && glowCv) {
      var colG = (ci / ROWS) | 0;
      var cxG = gx + colG * unitPx + cellS / 2;
      var cyG = gy + (ci % ROWS) * unitPx + cellS / 2;
      var gsG = unitPx * 3.2;
      ctx.globalAlpha = (1 - age / GLOW_LIFE) * 0.5;
      ctx.drawImage(glowCv, cxG - gsG / 2, cyG - gsG / 2, gsG, gsG);
      shown++;
    }
  }
  ctx.restore();
  for (k = 0; k < 64; k++) { // 팝: 갓 채워진 셀 순간 확대
    slot = ((recentPos - 1 - k) % 64 + 64) % 64;
    ci = recentCell[slot];
    if (ci < 0) break;
    age = now - recentTime[slot];
    if (age > POP_LIFE) break;
    var tt = 1 - age / POP_LIFE;
    var colP = (ci / ROWS) | 0;
    var grow = cellS * 0.7 * tt;
    ctx.globalAlpha = 0.5 + 0.5 * tt;
    ctx.fillStyle = '#ffe9b0';
    ctx.fillRect(gx + colP * unitPx - grow / 2, gy + (ci % ROWS) * unitPx - grow / 2, cellS + grow, cellS + grow);
  }
  ctx.globalAlpha = 1;
}

function drawRipple(now) { // 착지 파문 1회
  if (rm || tier >= 2) return;
  var age = now - landT;
  if (age > RIPPLE_LIFE) return;
  var t = age / RIPPLE_LIFE;
  var eo = 1 - Math.pow(1 - t, 3); // easeOutCubic
  var col = (curIdx / ROWS) | 0;
  var cx = gx + col * unitPx + cellS / 2;
  var cy = gy + (curIdx % ROWS) * unitPx + cellS / 2;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,201,77,' + (0.8 * (1 - t)).toFixed(3) + ')';
  ctx.lineWidth = Math.max(1.5 * dpr, unitPx * 0.3 * (1 - t));
  ctx.beginPath();
  ctx.arc(cx, cy, unitPx * (0.8 + 11 * eo), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawPulse(now) { // 현재 주 펄스(1.6초 주기) — 본질 연출이라 최저 티어에서도 유지
  var col = (curIdx / ROWS) | 0;
  var cx = gx + col * unitPx + cellS / 2;
  var cy = gy + (curIdx % ROWS) * unitPx + cellS / 2;
  var s;
  if (rm) s = 0.75; // reduced-motion: 정적 하이라이트
  else {
    var ph = ((now - landT) % PULSE_MS) / PULSE_MS;
    s = 0.5 - 0.5 * Math.cos(ph * Math.PI * 2);
  }
  if (tier < 2 && glowCv) {
    var gs = unitPx * (3.5 + 4.5 * s);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35 + 0.5 * s;
    ctx.drawImage(glowCv, cx - gs / 2, cy - gs / 2, gs, gs);
    ctx.restore();
  }
  var grow = cellS * 0.6 * s;
  ctx.globalAlpha = 0.55 + 0.45 * s;
  ctx.fillStyle = '#fff3d0';
  ctx.fillRect(cx - cellS / 2 - grow / 2, cy - cellS / 2 - grow / 2, cellS + grow, cellS + grow);
  ctx.globalAlpha = 1;
}

/* ===== 품질 자동 하향 — 워밍업 1.2초 버림, 72프레임 중앙값 > 26ms면 한 단계 하향, 자동 상향 없음 ===== */
function qualityTick(now, dt) {
  if (!qActive || now < qWarmUntil) return;
  qSamples.push(dt);
  if (qSamples.length < 72) return;
  var med = median(qSamples);
  qSamples = [];
  if (med > 26 && tier < 2) {
    setTier(tier + 1, false);
    showToast('품질 자동 조정됨 · ' + TIER_NAMES[tier]);
    qWarmUntil = now + 800; // 하향 후 재측정
  } else {
    qActive = false;
  }
}

function setTier(t, rearm) {
  tier = clampNum(t, 0, 2);
  glowMax = tier === 0 ? 30 : 10; // 하향 1단계: 글로우 30→10
  writeStore(LS_TIER, String(tier));
  applyMetrics(); // dpr 변경 반영 + 재베이크
  updateBadge();
  if (rearm) { qActive = true; qSamples = []; qWarmUntil = performance.now() + 800; }
}

function cycleTier() { // 수동 순환(상향은 수동만)
  setTier((tier + 1) % 3, true);
  showToast('품질: ' + TIER_NAMES[tier]);
}

/* ===== FPS 배지 ===== */
function fpsTick(dt) {
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 500) {
    fpsVal = Math.round(1000 * fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
    updateBadge();
  }
}
function updateBadge() {
  badgeEl.textContent = (fpsVal > 0 ? fpsVal : '--') + ' fps · ' + TIER_NAMES[tier];
}

/* ===== 토스트·힌트 ===== */
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
}
function showHint() {
  if (readStore(LS_SEEN)) return;
  hintEl.textContent = '숫자 1·2·3 키로 세대를 바꿔 보세요';
  hintEl.classList.add('show');
  hintShown = true;
  window.setTimeout(dismissHint, 8000);
}
function dismissHint() { // 첫 입력 시 페이드아웃
  if (!hintShown) return;
  hintShown = false;
  hintEl.classList.remove('show');
  writeStore(LS_SEEN, '1');
}

/* ===== 툴팁 ===== */
function onStageMove(e) {
  var rect = cv.getBoundingClientRect();
  var dx = (e.clientX - rect.left) * dpr;
  var dy = (e.clientY - rect.top) * dpr;
  var col = Math.floor((dx - gx) / unitPx);
  var row = Math.floor((dy - gy) / unitPx);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) { hideTip(); return; }
  var i = col * ROWS + row;
  var when = new Date(bY, bM - 1, bD + i * 7); // 생일 + i주
  var stateTxt = i < filledCount ? '살아온 주' : (i === curIdx ? '바로 지금' : '다가올 주');
  tipEl.innerHTML =
    '<div class="t1">만 ' + col + '세 · ' + when.getFullYear() + '년 ' + (when.getMonth() + 1) + '월경</div>' +
    '<div class="t2">' + fmtInt(i + 1) + '번째 주 · ' + stateTxt + '</div>';
  var tx = e.clientX + 16, ty = e.clientY + 14;
  if (tx + 230 > window.innerWidth) tx = e.clientX - 240;
  if (ty + 62 > window.innerHeight) ty = e.clientY - 66;
  tipEl.style.left = tx + 'px';
  tipEl.style.top = ty + 'px';
  tipEl.classList.add('vis');
}
function hideTip() { tipEl.classList.remove('vis'); }

/* ===== UI 유휴 페이드 ===== */
function wakeUi() {
  document.body.classList.remove('idle');
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = window.setTimeout(function () { document.body.classList.add('idle'); }, 3400);
}

/* ===== 전체화면·도움말·재생 토글 ===== */
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      var pr = document.documentElement.requestFullscreen();
      if (pr && pr.catch) pr.catch(function () { showToast('전체화면 전환이 차단되었습니다'); });
    } else {
      document.exitFullscreen();
    }
  } catch (e3) { showToast('전체화면 전환이 차단되었습니다'); }
}
function toggleHelp() { helpEl.classList.toggle('open'); }
function closeHelp() { helpEl.classList.remove('open'); }

function toggleMain() { // Space·버튼 공용: 재생/정지, 끝났으면 다시 재생
  if (landed) { replay(); return; }
  if (!playing) { if (fillTotal > 0) startPlay(); else replay(); return; }
  paused = !paused;
  refreshToggle();
}
function refreshToggle() {
  if (playing && !paused) btnToggle.textContent = '정지';
  else if (playing && paused) btnToggle.textContent = '재생';
  else btnToggle.textContent = '다시 재생';
}

/* ===== 이벤트 ===== */
window.addEventListener('resize', applyMetrics);
document.addEventListener('visibilitychange', function () { lastTs = 0; });
stage.addEventListener('mousemove', onStageMove);
stage.addEventListener('mouseleave', hideTip);
document.addEventListener('pointermove', wakeUi);
document.addEventListener('pointerdown', function () { dismissHint(); wakeUi(); });

document.addEventListener('keydown', function (e) {
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT') { // date input 입력 중에는 단축키 정지
    if (e.code === 'Escape') e.target.blur();
    return;
  }
  dismissHint();
  wakeUi();
  switch (e.code) {
    case 'Space': e.preventDefault(); toggleMain(); break;
    case 'KeyR': replay(); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyH': toggleHelp(); break;
    case 'KeyP': badgeEl.classList.toggle('show'); break;
    case 'KeyQ': cycleTier(); break;
    case 'Digit1': case 'Numpad1': setBirth(PRESETS[0]); break;
    case 'Digit2': case 'Numpad2': setBirth(PRESETS[1]); break;
    case 'Digit3': case 'Numpad3': setBirth(PRESETS[2]); break;
    case 'Escape': closeHelp(); break;
  }
});

presetBtns.forEach(function (bt, k) {
  bt.addEventListener('click', function () {
    dismissHint();
    setBirth(PRESETS[k]);
    bt.blur();
  });
});
btnToggle.addEventListener('click', function () {
  dismissHint();
  toggleMain();
  btnToggle.blur();
});
birthInput.addEventListener('change', function () {
  if (birthInput.value) { dismissHint(); setBirth(birthInput.value); }
});
helpEl.addEventListener('click', function (e) {
  if (e.target === helpEl) closeHelp();
});

/* ===== 부트 ===== */
function init() {
  var stored = parseInt(readStore(LS_TIER) || '0', 10);
  tier = clampNum(isNaN(stored) ? 0 : stored, 0, 2);
  glowMax = tier === 0 ? 30 : 10;
  makeGlowSprite();
  birthInput.max = todayStr(); // 미래 날짜 선택 방어
  applyMetrics();
  updateBadge();
  qWarmUntil = performance.now() + 1200; // 워밍업 1.2초 버림
  setBirth(PRESETS[1]); // 기본 프리셋 1990년생 자동 재생 (reduced-motion이면 즉시 완성)
  showHint();
  wakeUi();
  requestAnimationFrame(frame);
}
init();

})();
</script>
</body>
</html>
