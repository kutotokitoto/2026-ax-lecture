<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>플레이북 — 2026 AX 강의</title>
<style>
  /* 임시 페이지 — 플레이북 파일이 도착하면 이 index.html을 교체한다 */
  @font-face{font-family:'Galmuri11';font-weight:400;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Galmuri11/Galmuri11-Regular.woff2') format('woff2')}
  @font-face{font-family:'Galmuri11';font-weight:700;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Galmuri11/Galmuri11-Bold.woff2') format('woff2')}
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0b0a1c;
    color: #f2ecd7;
    font-family: 'Galmuri11', 'Galmuri14', 'DungGeunMo', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: none;
  }
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .panel {
    max-width: 560px;
    background: #171334;
    border: 4px solid #f2ecd7;
    box-shadow: 0 0 0 4px #0b0a1c, 8px 8px 0 0 rgba(0,0,0,.6);
    padding: 36px 40px 32px;
    text-align: center;
  }
  .tag { color: #ff6ec7; font-size: 13px; letter-spacing: .2em; }
  h1 { margin: 12px 0 8px; font-size: 30px; color: #ffd166; letter-spacing: -0.01em; }
  p { margin: 6px 0; font-size: 15px; line-height: 1.8; color: #9d97c9; }
  p b { color: #f2ecd7; font-weight: 700; }
  .back {
    display: inline-block;
    margin-top: 24px;
    padding: 9px 16px;
    font-size: 14px;
    color: #f2ecd7;
    background: #241c4e;
    text-decoration: none;
    border: 3px solid #f2ecd7;
    box-shadow: 0 0 0 3px #0b0a1c, 4px 4px 0 0 rgba(0,0,0,.6);
  }
  .back:hover { background: #ffd166; color: #241a3a; }
  .back:active { transform: translate(2px, 2px); box-shadow: 0 0 0 3px #0b0a1c, 2px 2px 0 0 rgba(0,0,0,.6); }
</style>
</head>
<body>
<div class="scan"></div>
<div class="panel">
  <div class="tag">— MANUAL —</div>
  <h1>📖 플레이북</h1>
  <p><b>준비 중입니다.</b></p>
  <p>모험을 마친 용사를 위한 실전 안내서.<br>파일이 도착하면 이 자리에 들어갑니다.</p>
  <a class="back" href="../index.html">← 마을로 돌아가기</a>
</div>
</body>
</html>
