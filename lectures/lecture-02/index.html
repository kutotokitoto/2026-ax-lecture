<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 02 — 2026 AX 강의</title>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f7f9; --border: #e4e6ea;
    --text: #16181d; --text-soft: #5c626c; --text-faint: #8b919b;
    --accent: #2f5cff; --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --bg-soft: #14171c; --border: #262a32;
      --text: #eceef2; --text-soft: #a2a9b5; --text-faint: #737b88;
      --accent: #7f9bff; --accent-soft: #1b2237;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                 "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.65; letter-spacing: -0.01em;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--border); background: var(--bg-soft); }
  .back {
    display: inline-block; margin-bottom: 24px; padding-top: 28px;
    font-size: 14px; color: var(--text-soft); text-decoration: none;
  }
  .back:hover { color: var(--accent); }
  .head-inner { padding-bottom: 44px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 26px; padding: 0 9px; margin-bottom: 12px;
    border-radius: 7px; background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  h1 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -0.03em; }
  .kind { margin: 0; font-size: 14px; color: var(--text-faint); }
  main { padding: 44px 0 72px; }
  .placeholder {
    border: 1px dashed var(--border); border-radius: 14px;
    padding: 40px 24px; text-align: center; color: var(--text-soft); font-size: 15px;
  }
  .placeholder p { margin: 0; }
  .placeholder p + p { margin-top: 8px; font-size: 13px; color: var(--text-faint); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="back" href="../../index.html">← 목록으로</a>
    <div class="head-inner">
      <span class="badge">02</span>
      <h1>강의 02</h1>
      <p class="kind">강의본</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="placeholder">
    <p>내용 준비 중입니다.</p>
    <p>이 자리에 강의본 내용이 들어갑니다.</p>
  </div>
</main>

</body>
</html>
